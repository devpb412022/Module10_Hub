ear rule (piston) – p.255–256; aircraft groups on p.242.", "ref": [255, 256, 242], "note": "The book does not write out B1.1–B1.4 definitions; this answer comes from Part-66 Appendix I (consistent with the grouping on p.255–257)."}, {"id": 43, "t": "p145", "q": "Who is responsible for establishing the safety and quality strategy?", "th": "ใครรับผิดชอบกำหนดกลยุทธ์/นโยบายด้านความปลอดภัยและคุณภาพ?", "o": ["The Accountable Manager", "The Compliance Manager", "The certifying staff"], "key": "Accountable Manager = establish + promote Safety & Quality policy", "exp": "Accountable Manager duties: provide all necessary resources, establish and promote the safety and quality policy of the organisation, establish the operational prerequisites (TOP), demonstrate basic understanding of the Part concerned and set a clear rule for substitution.", "ref": [37]}, {"id": 44, "t": "pm", "q": "Which aircraft must be maintained by a Part-145 approved maintenance organisation?", "th": "อากาศยานประเภทใดต้องซ่อมบำรุงโดยองค์กร Part-145 ที่ได้รับอนุมัติ?", "o": ["Large aircraft and aircraft used for commercial operation (and their components)", "Light sport aircraft in private use", "Balloons and gliders"], "key": "Large + Commercial = Part-145 (M.A.201(g)) • เครื่องเบาไม่พาณิชย์ = CAO / M-F / 145 / ICS", "exp": "M.A.201(g): maintenance of large aircraft, aircraft used for commercial operation and components thereof shall be carried out by a Part-145 approved maintenance organisation.", "ref": [85]}, {"id": 45, "t": "p145", "q": "What approval (rating) does a maintenance organisation need to maintain aircraft below 5,700 kg MTOW?", "th": "องค์กรซ่อมบำรุงต้องมี approval (rating) ใดเพื่อซ่อมบำรุงอากาศยานต่ำกว่า 5,700 kg MTOW?", "o": ["Class A rating, category A2 (aeroplanes below 5,700 kg)", "Class A rating, category A1 (aeroplanes above 5,700 kg)", "Class B rating, category B1 (turbine engines)"], "key": "A1 = > 5,700 kg • A2 = < 5,700 kg • A3 = ฮ. • A4 = อื่น ๆ", "exp": "145.A.20 terms of approval – Class A Aircraft: A1 aeroplanes above 5,700 kg, A2 aeroplanes below 5,700 kg, A3 helicopter, A4 aircraft other than A1, A2 and A3.", "ref": [185]}, {"id": 46, "t": "p21", "q": "By which document are new components released by a manufacturer?", "th": "ชิ้นส่วนใหม่ที่ผู้ผลิตปล่อยออกมา ใช้เอกสารใดรับรอง?", "o": ["EASA Form 1 issued by a Part-21.G production organisation (marked ‘NEW’)", "EASA Form 52 – statement of conformity of a complete new aircraft", "EASA Form 15 – Airworthiness Review Certificate"], "key": "ชิ้นส่วนใหม่ = Form 1 'NEW' จาก 21.G • หลังซ่อม 145 = 'OVERHAULED/REPAIRED…' • Form 52 = ทั้งลำ", "exp": "EASA Form 1 is an official certificate that a component is airworthy and suitable for installation, with traceability of production (21.G) or maintenance (145). Part 21.G marks ‘NEW’ (or ‘PROTOTYPE’ if design data is not yet approved).", "ref": [212, 213]}, {"id": 47, "t": "fw", "q": "How are EU regulations officially enforced?", "th": "กฎระเบียบ EU มีผลบังคับใช้อย่างเป็นทางการอย่างไร?", "o": ["They are published in the Official Journal of the EU and are directly applicable to every person and company in the internal market, taking precedence over national law", "Each Member State must first transpose them into national law before they apply", "They apply only after ICAO ratifies them"], "key": "Regulation = ประกาศใน Official Journal → บังคับใช้ตรงทันที (directly applicable) และอยู่เหนือกฎหมายชาติ", "exp": "Regulations are directly applicable and every natural person and every company active in the European internal market must comply with them. EU regulations always take precedence over national regulations. Amendments are found in the respective Official Journal.", "ref": [10, 22, 30], "note": "The bank wording is short; the book’s answer is ‘directly applicable / precedence over national law’, with the Official Journal as the publication source."}, {"id": 48, "t": "p21", "q": "Which regulation applies to design and production organisations?", "th": "กฎระเบียบใดใช้กับองค์กรออกแบบและองค์กรผลิต?", "o": ["Regulation (EU) 748/2012 – Part-21 (21.J design, 21.G production)", "Regulation (EU) 1321/2014 – Part-145", "Regulation (EU) 965/2012 – ORO"], "key": "21.J = Design • 21.G = Production → ทั้งคู่อยู่ใน Part-21 (748/2012)", "exp": "Approved data flows from the Design Organisation (21.J) to the Production Organisation (21.G) and to Maintenance (CAMO/CAO & 145) under Regulation (EU) 748/2012 Part-21.", "ref": [64, 69, 70]}, {"id": 49, "t": "p66", "q": "Which regulation regulates the requirements for certifying staff?", "th": "กฎระเบียบใดกำหนดข้อกำหนดของ certifying staff?", "o": ["Regulation (EU) 1321/2014, Annex III – Part-66", "Regulation (EU) 748/2012 – Part-21", "Regulation (EU) 1178/2011 – Aircrew"], "key": "Certifying staff + AML = Part-66 = Annex III ของ 1321/2014", "exp": "Part-66 (Annex III of IR 1321/2014) defines the aircraft maintenance licence (AML) and the requirements for application, issue and continued validity.", "ref": [79, 239, 240]}, {"id": 50, "t": "fw", "q": "What does the abbreviation AMC stand for?", "th": "AMC ย่อมาจากอะไร?", "o": ["Acceptable Means of Compliance – non-binding guidance on how to comply with the implementing rules", "Approved Maintenance Certificate", "Aircraft Maintenance Check"], "key": "AMC = Acceptable Means of Compliance • GM = Guidance Material • (soft law)", "exp": "Soft law: AMC (Acceptable Means of Compliance) and GM (Guidance Material) are non-binding guidelines to help those involved comply with the European regulations. Implementing rules are hard law.", "ref": [19, 299]}, {"id": 51, "t": "p21", "q": "Who issues the airworthiness certificate for a new aircraft?", "th": "ใครออกใบสำคัญสมควรเดินอากาศสำหรับอากาศยานใหม่?", "o": ["The national authority (NAA) of the State of Registry – Certificate of Airworthiness, Form 25", "EASA", "The manufacturer’s 21.G organisation with Form 53"], "key": "CofA (Form 25) = NAA ออกให้เมื่อแสดง conformity (Form 52) • ARC ต่ออายุทุกปี", "exp": "The CofA is the formal document issued by the NAA to certify airworthiness. It is issued when the aircraft conforms to the certified type design (Form 52) and is in a condition for safe operation; the annual ARC confirms continued validity.", "ref": [304, 321, 69]}, {"id": 52, "t": "p145", "q": "After a fuel pump has been overhauled in a maintenance shop, which document must be issued before it can be installed on an aircraft?", "th": "หลังโอเวอร์ฮอลปั๊มน้ำมันในโรงซ่อม ต้องออกเอกสารใดก่อนนำไปติดตั้งบนอากาศยาน?", "o": ["EASA Form 1 (marked ‘OVERHAULED’)", "EASA Form 15 – Airworthiness Review Certificate", "EASA Form 25 – Certificate of Airworthiness"], "key": "ชิ้นส่วนซ่อมแล้ว = Form 1 (OVERHAULED / REPAIRED / INSPECTED / MODIFIED) จาก 145", "exp": "EASA Form 1 is the release certificate for components issued by 145 organisations after maintenance, marked overhauled, inspected/tested, modified or repaired, by personnel authorised according to approved procedures (MOE).", "ref": [212, 213]}, {"id": 53, "t": "p145", "q": "Which organisation is allowed to issue an EASA Form 1 after maintenance of an aeronautical component?", "th": "องค์กรใดออก EASA Form 1 ได้หลังการซ่อมบำรุงชิ้นส่วน?", "o": ["A Part-145 approved maintenance organisation with the appropriate privileges", "Any aircraft owner or operator", "A Part-147 training organisation"], "key": "Form 1 ออกได้เฉพาะ 21.G (ของใหม่) และ 145 (หลังซ่อม) ที่มี privileges ตรง", "exp": "EASA Form 1 is an official certificate that may only be used by approved production organisations (21.G) or maintenance organisations (145) with appropriate privileges, issued by personnel authorised according to approved procedures (POE/MOE).", "ref": [212, 213, 308]}, {"id": 54, "t": "p145", "q": "The requirement 145.A.47 to establish production planning is part of the approval for a …?", "th": "ข้อกำหนด 145.A.47 เรื่อง production planning เป็นส่วนหนึ่งของการอนุมัติสำหรับ …?", "o": ["Part-145 maintenance organisation", "Part-21.J ML?", "o": ["EASA Form 19", "EASA Form 4", "EASA Form 2"], "key": "Form 19 = AML (สมัคร/ต่ออายุ/แก้ไข) • Form 4 = ผู้บริหาร • Form 2 = สมัครอนุมัติองค์กร", "exp": "The EASA Form 19 is submitted to the competent authority with evidence of compliance; it is also used for renewal and amendment of the licence.", "ref": [243, 262, 308]}, {"id": 58, "t": "p66", "q": "What work may certifying staff of category A release?", "th": "Certifying staff Category A ปล่อยงาน (CRS) อะไรได้บ้าง?", "o": ["Minor scheduled line maintenance and simple defect rectification within the tasks endorsed on the certification authorisation – only work personally performed; no type rating", "Any base maintenance task on large aircraft", "Avionic troubleshooting on all aircraft types"], "key": "Cat A = งาน line เล็ก + แก้ defect ง่าย ๆ เฉพาะที่ authorised และ 'ทำเอง' ไม่มี type rating", "exp": "A category A AML permits the holder to issue CRS following minor scheduled line maintenance and simple defect rectification within the limits of the tasks specifically endorsed on the certification authorisation. Privileges are restricted to work the holder has personally performed; no type rating.", "ref": [245]}, {"id": 59, "t": "p66", "q": "The Line Maintenance Certifying Mechanic corresponds to the AML category …?", "th": "Line Maintenance Certifying Mechanic ตรงกับ AML หมวด …?", "o": ["Category A", "Category B1", "Category C"], "key": "A = Line Maintenance Certifying Mechanic • B1/B2 = Technician • C = Base Engineer", "exp": "66.A.3: A = Line Maintenance Certifying Mechanic; B1 = Maintenance Certifying Technician (Mechanical); B2 = Maintenance Certifying Technician (Avionic); C = Base Maintenance Certifying Engineer.", "ref": [241, 245]}, {"id": 60, "t": "pm", "q": "What topic is covered in Part-M?", "th": "Part-M ครอบคลุมหัวข้อใด?", "o": ["Continuing airworthiness – maintenance, responsibilities, CAMO, CRS and the Airworthiness Review Certificate", "Type certification and production of aircraft", "Air h edition."}, {"id": 63, "t": "pm", "q": "Which companies are allowed to perform maintenance on non-commercial aircraft?", "th": "บริษัทใดซ่อมบำรุงอากาศยานไม่เชิงพาณิชย์ได้?", "o": ["Organisations approved under Part-145, Part-CAO or Part-M Subpart F (and ICS for Part-ML aircraft)", "Only Part-145 organisations", "Only Part-21.G production organisations"], "key": "Non-commercial (Part-ML): 145 • CAO • M/F • (และ ICS) | Commercial/large = 145 เท่านั้น", "exp": "Part-ML aircraft maintenance can be performed in all maintenance organisations meeting the requirements, with an approval according to Part-CAO, Part-M Subpart F or Part-145; independent certifying staff may also maintain under Part-ML.", "ref": [144, 110, 276]}];

/* ---------- helpers ---------- */
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const CH = Object.fromEntries(CHAPTERS.map(c=>{
  const m=c.pages.match(/(\d+)\D+(\d+)/); c.lo=+m[1]; c.hi=+m[2];
  const words=((c.sections||[]).map(s=>s.en).join(' ')+' '+(c.glossary||[]).map(g=>g.desc_en).join(' ')).split(/\s+/).length;
  c.min=Math.max(3,Math.round(words/130));
  return [c.id,c];
}));
function chOfPage(p){ for(const c of CHAPTERS){ if(p>=c.lo&&p<=c.hi) return c.id } return null }

/* ---------- rich text ---------- */
const TOK=/((?:CAMO|ML|M)\.A\.\d+|\b\d{2,3}\.[AB]\.\d+|Part-[A-Za-z0-9]+|EASA Form \d+[a-z]?|\bForm \d+[a-z]?|\(EU\)(?: No)? ?\d+\/\d{4}|\b\d[\d,]*(?: ?(?:hours|months|years|days|kg|flight hours)))/g;
const hl = t=>esc(t).replace(TOK,'<b class="hl">$1</b>');
function splitEN(t){
  const parts=t.replace(/\.\s+(?=[A-Z(\d])/g,'.\u0001').replace(/;\s+/g,';\u0001').split('\u0001');
  const out=[];
  for(const p of parts){ if(out.length && /(\b(?:e\.g|i\.e|No|Reg|etc|approx)\.)$/.test(out[out.length-1])) out[out.length-1]+=' '+p; else out.push(p) }
  return out;
}
const THHEAD=/\s+(?=(?:(?:CAMO|ML|M)\.A\.\d+|\d{2,3}\.[AB]\.\d+)\s[^:;.()]{2,50}:)/g;
function splitTH(t){ return t.replace(THHEAD,'\u0001').replace(/;\s+/g,';\u0001').split('\u0001') }
function rich(t,lang){
  const parts = lang==='th' ? splitTH(t) : splitEN(t);
  if(parts.length>=3) return '<ul>'+parts.map(p=>`<li>${hl(p.replace(/;$/,''))}</li>`).join('')+'</ul>';
  return `<p>${hl(t)}</p>`;
}
const refChip=p=>{const c=chOfPage(p);return c===null?`<span class="pchip">Book p.${p}</span>`:`<a class="pchip" href="#/ch/${c}/p${p}" title="เปิดหน้า ${p} ในบทที่ ${c}">Book p.${p}</a>`};
const refs=r=>'<div class="refs">'+r.map(refChip).join('')+'</div>';

function applyPrefs(){
  const th = store.theme || (window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');
  document.documentElement.dataset.theme=th;
  document.documentElement.classList.remove('fs0','fs1','fs2');
  document.documentElement.classList.add('fs'+store.fs);
}
function toggleTheme(){ store.theme = document.documentElement.dataset.theme==='dark'?'light':'dark'; save(); applyPrefs(); }
function bumpFs(d){ store.fs=Math.min(2,Math.max(0,store.fs+d)); save(); applyPrefs(); }

function dayLinks(d){
  const out=[], reads=new Set();
  (d.task_en.match(/Ch\.([\d\/]+)/g)||[]).forEach(m=>m.replace('Ch.','').split('/').forEach(x=>{if(CH[+x])reads.add(+x)}));
  reads.forEach(id=>out.push(`<a class="cl" href="#/ch/${id}">อ่านบท ${id}</a>`));
  const q=d.quiz||'';
  if(/Full/i.test(q)) out.push(`<a class="cl q" href="#/practice/full">ข้อสอบรวมทุกบท</a>`);
  else if(/^Ch\./.test(q)){
    const m=q.match(/Ch\.(\d+)(?:-(\d+))?/); const a=+m[1], b=m[2]?+m[2]:a;
    for(let i=a;i<=b;i++) if(CH[i]&&CH[i].quiz&&CH[i].quiz.length) out.push(`<a class="cl q" href="#/practice/ch/${i}">แบบทดสอบบท ${i}</a>`);
  } else if(/Review/i.test(q)) out.push(`<a class="cl q" href="#/practice">ทบทวนด้วยข้อสอบ</a>`);
  if(d.d>=20 || d.d===6) out.push(`<a class="cl q" href="#/practice/real">ข้อสอบจริง</a>`);
  return out.join('');
}

/* ---------- runner ---------- */
let run=null;
function realItems(list){ return list.map(q=>({id:'r'+q.id,rid:q.id,q:q.q,th:q.th,opts:q.o.map(x=>({en:x})),c:0,key:q.key,exp:q.exp,ref:q.ref,note:q.note,topic:RTOPICS[q.t],ch:q.ch})) }
function chapterItems(c){ return (c.quiz||[]).map((q,i)=>({id:'c'+c.id+'_'+i,q:q.q_en,th:q.q_th,opts:q.choices_en.map((e,k)=>({en:e,th:q.choices_th[k]})),c:q.a,ch:c.id,topic:'บท '+c.id})) }
function startRun(items,meta){
  const n=meta.count?Math.min(meta.count,items.length):items.length;
  run={meta,items:shuffle(items).slice(0,n).map(it=>({it,order:shuffle(it.opts.map((_,i)=>i)),chosen:null})),i:0,done:false};
}
function viewRun(){
  if(!run) return go('#/practice');
  mountShell('practice',run.meta.title);
  if(run.done) return viewResult();
  const cur=run.items[run.i], it=cur.it, answered=cur.chosen!==null;
  const pct=Math.round(run.i/run.items.length*100);
  let h=`<div class="wrap narrow"><div class="qmeta"><span>${esc(run.meta.title)} · ${esc(it.topic||'')}</span><span>${run.i+1} / ${run.items.length}</span></div>
  <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><i style="width:${pct}%"></i></div>
  <p class="q-en">${esc(it.q)}</p>${store.th&&it.th?`<p class="q-th">${esc(it.th)}</p>`:'<div style="height:12px"></div>'}
  <div id="opts">${cur.order.map((oi,pos)=>{const o=it.opts[oi];
    let cls='';if(answered){cls=oi===it.c?'correct':(oi===cur.chosen?'wrong':'dim')}
    return `<button class="opt ${cls}" data-oi="${oi}" ${answered?'disabled':''}><span class="k">${'ABCD'[pos]}</span><span>${esc(o.en)}${o.th&&store.th?`<small>${esc(o.th)}</small>`:''}</span></button>`}).join('')}</div>
  <div id="fb" aria-live="polite">${answered?fbHTML(cur):''}</div></div>`;
  setMain(h);
  $$('#opts .opt').forEach(b=>b.onclick=()=>choose(+b.dataset.oi));
  if(answered) $('#next').onclick=nextQ;
}
function fbHTML(cur){
  const it=cur.it, ok=cur.chosen===it.c, last=run.i===run.items.length-1;
  let h=`<div class="fb ${ok?'ok':'no'}"><h3>${ok?'ถูกต้อง ✔':'ยังไม่ถูก ✘ — ข้อที่ถูกคือสีเขียว'}</h3>`;
  if(it.key) h+=`<p class="key">🔑 ${esc(it.key)}</p>`;
  if(it.exp) h+=`<p class="exp" lang="en">${hl(it.exp)}</p>`;
  if(it.note) h+=`<p class="note">ข้อสังเกต: ${esc(it.note)}</p>`;
  if(it.ref) h+=refs(it.ref); else if(it.ch!=null) h+=`<a class="cl" href="#/ch/${it.ch}">ทบทวนบทที่ ${it.ch}</a>`;
  h+=`</div><div class="nextbar"><button class="btn big" id="next">${last?'ดูผลคะแนน':'ข้อถัดไป →'}</button></div>`;
  return h;
}
function choose(oi){
  const cur=run.items[run.i]; if(cur.chosen!==null) return;
  cur.chosen=oi;
  $$('#opts .opt').forEach(b=>{const k=+b.dataset.oi; b.disabled=true; b.classList.add(k===cur.it.c?'correct':(k===oi?'wrong':'dim'))});
  $('#fb').innerHTML=fbHTML(cur); $('#next').onclick=nextQ;
  $('#next').scrollIntoView({block:'nearest'});
}
function nextQ(){
  if(run.i<run.items.length-1){run.i++;viewRun();window.scrollTo(0,0)}
  else{ finishRun(); viewRun(); window.scrollTo(0,0) }
}
function finishRun(){
  run.done=true;
  const right=run.items.filter(x=>x.chosen===x.it.c).length;
  run.pct=Math.round(right/run.items.length*100);
  const k=run.meta.key; if(k && (store.best[k]==null||run.pct>store.best[k])) store.best[k]=run.pct;
  run.items.forEach(x=>{ if(x.it.rid){ const ok=x.chosen===x.it.c; const i=store.wrong.indexOf(x.it.rid); if(!ok&&i<0) store.wrong.push(x.it.rid); if(ok&&i>=0) store.wrong.splice(i,1); } });
  save();
}
function viewResult(){
  const total=run.items.length, right=run.items.filter(x=>x.chosen===x.it.c).length, ok=run.pct>=PASS;
  const bt={}; run.items.forEach(x=>{const t=x.it.topic||'-'; (bt[t]=bt[t]||{r:0,n:0}).n++; if(x.chosen===x.it.c)bt[t].r++});
  const wrong=run.items.filter(x=>x.chosen!==x.it.c);
  let h=`<div class="wrap narrow"><section class="card score"><p class="small">${esc(run.meta.title)}</p><div class="pct ${ok?'pass':'fail'}">${run.pct}%</div>
    <p>${right} / ${total} ถูก · เกณฑ์ผ่าน ${PASS}%</p><h2 class="${ok?'pass':'fail'}" style="margin:6px 0 16px">${ok?'ผ่านเกณฑ์':'ยังไม่ผ่าน — ทบทวนข้อที่ผิดแล้วลองใหม่'}</h2>
    <div class="row" style="justify-content:center">${wrong.length?'<button class="btn" id="rw">ทำเฉพาะข้อที่ผิด ('+wrong.length+')</button>':''}<button class="btn sec" id="again">ชุดใหม่</button><a class="btn sec" href="#/practice">ศูนย์ฝึกข้อสอบ</a></div></section>
  <section class="card"><p class="lbl">ผลแยกตามหัวข้อ</p>${Object.entries(bt).map(([t,v])=>`<div class="trow"><span>${esc(t)}</span><b style="color:${v.r===v.n?'var(--green)':'var(--amber)'}">${v.r}/${v.n}</b></div>`).join('')}</section>`;
  if(wrong.length){ h+=`<h2 style="font-size:1.1rem;color:var(--amber);margin:22px 0 10px">ข้อที่ตอบผิด — อ่านทบทวน</h2>`;
    wrong.forEach(x=>{const it=x.it; h+=`<section class="card"><p class="q-en" style="font-size:1.05rem">${esc(it.q)}</p><p class="ans">✔ ${esc(it.opts[it.c].en)}</p>
      ${it.key||it.exp?`<div class="fb">${it.key?`<p class="key">🔑 ${esc(it.key)}</p>`:''}${it.exp?`<p class="exp" lang="en">${hl(it.exp)}</p>`:''}${it.note?`<p class="note">ข้อสังเกต: ${esc(it.note)}</p>`:''}${it.ref?refs(it.ref):''}</div>`:`<a class="cl" href="#/ch/${it.ch}">ทบทวนบทที่ ${it.ch}</a>`}</section>`}); }
  h+='</div>'; setMain(h);
  $('#again').onclick=()=>{ redo(run.items.map(x=>x.it),run.meta,true) };
  const rw=$('#rw'); if(rw) rw.onclick=()=>{ redo(wrong.map(x=>x.it),{title:run.meta.title+' (ข้อที่ผิด)',key:null},false) };
}
function redo(items,meta,full){
  if(full && meta.key==='real'){ startRun(realItems(REAL.filter(q=>rsel.topics.has(q.t))),meta) }
  else startRun(items,Object.assign({},meta,{count:full?meta.count:null}));
  viewRun(); window.scrollTo(0,0);
}
document.addEventListener('keydown',e=>{
  if(!run||run.done||!location.hash.startsWith('#/practice/run')) return;
  if(e.target.matches('input,select,textarea')) return;
  const cur=run.items[run.i];
  const m={a:0,b:1,c:2,d:3,'1':0,'2':1,'3':2,'4':3}[e.key.toLowerCase()];
  if(m!==undefined&&cur.chosen===null&&m<cur.order.length){ choose(cur.order[m]) }
  else if(e.key==='Enter'&&cur.chosen!==null){ const n=$('#next'); if(n&&document.activeElement!==n) nextQ() }
});

/* ---------- answer key ---------- */
const ksel={topics:new Set(Object.keys(RTOPICS)),q:'',open:false};
function viewKey(){
  mountShell('key','Answer key');
  const list=REAL.filter(q=>ksel.topics.has(q.t)&&(!ksel.q||(q.q+' '+q.o[0]+' '+q.key+' '+q.exp).toLowerCase().includes(ksel.q.toLowerCase())));
  let h=`<div class="wrap narrow"><p class="crumb">ฝึกทำข้อสอบ › Answer key</p><h1 class="h-page">Answer key / ท่องจำ<small>ข้อสอบจริง ${REAL.length} ข้อ พร้อม Key · เฉลย · เลขหน้า</small></h1>
  <div class="card" style="margin-top:16px"><input class="gsearch" id="ks" type="search" placeholder="ค้นหา เช่น ICS, Form 1, 72 hours" value="${esc(ksel.q)}" aria-label="ค้นหา">
  <div class="row" id="kt" style="margin-bottom:10px">${Object.entries(RTOPICS).map(([k,v])=>`<button class="chip" data-t="${k}" aria-pressed="${ksel.topics.has(k)}">${esc(v)}</button>`).join('')}</div>
  <label class="sw" style="margin:0"><input type="checkbox" id="ko" ${ksel.open?'checked':''}> เปิดเฉลยทุกข้อ</label></div>
  <p class="small">${list.length} ข้อ · แตะข้อเพื่อดูเฉลย</p>
  ${list.map(q=>`<details class="sq" ${ksel.open?'open':''}><summary><span class="small">#${q.id} · ${esc(RTOPICS[q.t])}</span><br><strong>${esc(q.q)}</strong><br><span class="small">${esc(q.th)}</span></summary>
   <div class="body"><p class="ans">✔ ${esc(q.o[0])}</p>${q.also?`<p class="also">คำถามในชุด: ${q.also.map(esc).join(' · ')}</p>`:''}
   <div class="fb"><p class="key">🔑 ${esc(q.key)}</p><p class="exp" lang="en">${hl(q.exp)}</p>${q.note?`<p class="note">ข้อสังเกต: ${esc(q.note)}</p>`:''}${refs(q.ref)}</div></div></details>`).join('')}</div>`;
  setMain(h);
  const s=$('#ks'); s.oninput=()=>{ksel.q=s.value;const p=s.selectionStart;viewKey();const n=$('#ks');n.focus();n.setSelectionRange(p,p)};
  $$('#kt .chip').forEach(b=>b.onclick=()=>{const k=b.dataset.t;ksel.topics.has(k)?ksel.topics.delete(k):ksel.topics.add(k);if(!ksel.topics.size)Object.keys(RTOPICS).forEach(x=>ksel.topics.add(x));viewKey()});
  $('#ko').onchange=e=>{ksel.open=e.target.checked;viewKey()};
}

/* ---------- router ---------- */
function go(h){ if(location.hash===h) route(); else location.hash=h }
function route(){
  drawer(false);
  const s=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);
  let keepScroll=false;
  try{
    if(!s.length||s[0]==='home') viewHome();
    else if(s[0]==='ch'){ const pg=s[2]&&/^p\d+$/.test(s[2])?+s[2].slice(1):null; keepScroll=viewChapter(+s[1],pg)==='keep'; }
    else if(s[0]==='key') viewKey();
    else if(s[0]==='practice'){
      if(!s[1]) viewHub();
      else if(s[1]==='real') viewRealSetup();
      else if(s[1]==='run') viewRun();
      else if(s[1]==='ch'&&CH[+s[2]]){ startRun(chapterItems(CH[+s[2]]),{title:'แบบทดสอบบท '+s[2]+' · '+CH[+s[2]].title_en,key:'ch'+s[2]}); history.replaceState(null,'','#/practice/run'); viewRun(); }
      else if(s[1]==='full'){ startRun(CHAPTERS.flatMap(chapterItems),{title:'ข้อสอบรวมทุกบท',key:'full'}); history.replaceState(null,'','#/practice/run'); viewRun(); }
      else if(s[1]==='mistakes'){ const l=REAL.filter(q=>store.wrong.includes(q.id)); if(!l.length) return go('#/practice'); startRun(realItems(l),{title:'ทบทวนข้อที่เคยผิด',key:null}); history.replaceState(null,'','#/practice/run'); viewRun(); }
      else if(s[1]==='real-ch'&&CH[+s[2]]){ const l=relatedReal(+s[2]); startRun(realItems(l),{title:'ข้อสอบจริง · บท '+s[2],key:null}); history.replaceState(null,'','#/practice/run'); viewRun(); }
      else viewHub();
    } else viewHome();
  }catch(err){ console.error(err); setMain('<div class="wrap"><div class="card"><p>เกิดข้อผิดพลาดในการแสดงผล — <a href="#/home">กลับหน้าหลัก</a></p></div></div>'); }
  if(!keepScroll) window.scrollTo(0,0);
  main.focus({preventScroll:true});
}
window.addEventListener('hashchange',route);
applyPrefs();
route();

</script>
</body>
</html>
