ht inspection (need not be done by 145/certifying staff). For air carriers, the operator must be approved as CAMO within its AOC and use own/contracted Part-145. Complex aircraft in commercial use: CAW tasks may be contracted to another CAMO, but maintenance must be by own/contracted Part-145. Large aircraft/commercial ops components: maintenance must be by a Part-145 org. Small aircraft commercial use: CAW tasks contracted to a CAMO. Owner grants authority access for compliance checks.", "th": "M.A.201 ความรับผิดชอบ: เจ้าของรับผิดชอบความสมควรเดินอากาศต่อเนื่อง (โอนไปยังผู้เช่าหากระบุในเอกสารทะเบียน/สัญญาเช่า) นักบินผู้ควบคุม/ผู้ประกอบการรับผิดชอบการตรวจก่อนบิน (ไม่จำเป็นต้องทำโดย 145/บุคลากรออกใบรับรอง) สำหรับสายการบิน ผู้ประกอบการต้องได้รับอนุมัติเป็น CAMO ภายใน AOC และใช้ Part-145 ของตนเอง/ที่ทำสัญญาไว้ อากาศยานซับซ้อนใช้เชิงพาณิชย์: งานความสมควรเดินอากาศต่อเนื่องอาจทำสัญญากับ CAMO อื่นได้ แต่การซ่อมบำรุงต้องทำโดย Part-145 ของตนเอง/ที่ทำสัญญา อากาศยานขนาดใหญ่/ใช้เชิงพาณิชย์: ต้องซ่อมบำรุงโดยองค์กร Part-145 อากาศยานขนาดเล็กใช้เชิงพาณิชย์: งานความสมควรเดินอากาศต่อเนื่องทำสัญญากับ CAMO เจ้าของต้องให้หน่วยงานเข้าถึงเพื่อตรวจสอบการปฏิบัติตาม"}, {"p": "88-89", "en": "M.A.202 Occurrence reporting: any person/org responsible under M.A.201 must report to the State of Registry authority and the design/STC holder any condition endangering flight safety, within 72 hours. A maintenance org must also report to the operator/CAMO.", "th": "M.A.202 การรายงานเหตุการณ์: ผู้ที่รับผิดชอบตาม M.A.201 ต้องรายงานต่อหน่วยงานของรัฐที่จดทะเบียนและผู้ถือใบรับรองแบบ/STC เกี่ยวกับสภาพที่เป็นอันตรายต่อความปลอดภัยการบิน ภายใน 72 ชั่วโมง องค์กรซ่อมบำรุงต้องรายงานต่อผู้ประกอบการ/CAMO ด้วย"}, {"p": "90-93", "en": "M.A.301 Continuing airworthiness tasks are shared: CAMO manages A/W responsibility (SB/AD accomplishment, defect/damage rectification via MEL, maintenance program development/update); Maintenance (145/CAO) performs the work; Operation performs pre-flight checks/maintenance check flights. M.A.302 Aircraft Maintenance Programme (AMP): organised per an approved AMP (can use indirect approval via CAMO/CAO); must comply with authority instructions, ICA (from TC/STC/repair/ETSO holders), and owner/CAMO additions; includes frequency of all tasks; large aircraft using MSG logic must include a reliability program; subject to periodic review.", "th": "M.A.301 งานความสมควรเดินอากาศต่อเนื่องแบ่งกัน: CAMO จัดการความรับผิดชอบด้าน A/W (ดำเนินการ SB/AD แก้ไขข้อบกพร่อง/ความเสียหายผ่าน MEL พัฒนา/ปรับปรุงโปรแกรมซ่อมบำรุง); การซ่อมบำรุง (145/CAO) ทำงานจริง; ฝ่ายปฏิบัติการทำการตรวจก่อนบิน/เที่ยวบินตรวจสอบซ่อมบำรุง M.A.302 โปรแกรมซ่อมบำรุงอากาศยาน (AMP): จัดทำตามโปรแกรมที่ได้รับอนุมัติ (อาจใช้การอนุมัติทางอ้อมผ่าน CAMO/CAO) ต้องปฏิบัติตามคำสั่งหน่วยงาน ICA (จากผู้ถือ TC/STC/ซ่อม/ETSO) และส่วนเพิ่มเติมจากเจ้าของ/CAMO ระบุความถี่ของงานทั้งหมด อากาศยานขนาดใหญ่ที่ใช้ตรรกะ MSG ต้องมีโปรแกรมความน่าเชื่อถือด้วย ต้องทบทวนเป็นระยะ"}, {"p": "94-99", "en": "M.A.303 ADs must be complied with as specified. M.A.304 modifications/repairs must use EASA- or DO-approved data. M.A.305 Aircraft continuing airworthiness records: logbook (TLB), engine/component life history; must show ADs, mods/repairs, maintenance-program compliance, life-limited parts, weighing report, deferred defects list (HIL); components need EASA Form 1, install location, flight time/cycles, NHA, affected AD/LTA data. CAMO controls records; retained ≥36 months. M.A.306: commercial operator's Technical Log system covers each flight, current CRS, maintenance status, deferred deficiencies; approved by authority; retained 36 months.", "th": "M.A.303 ต้องปฏิบัติตาม AD ตามที่กำหนด M.A.304 การดัดแปลง/ซ่อมแซมต้องใช้ข้อมูลที่ได้รับอนุมัติจาก EASA หรือ DO M.A.305 บันทึกความสมควรเดินอากาศต่อเนื่อง: สมุดบันทึก (TLB) ประวัติอายุเครื่องยนต์/ชิ้นส่วน ต้องแสดง AD การดัดแปลง/ซ่อมแซม การปฏิบัติตามโปรแกรมซ่อมบำรุง ชิ้นส่วนอายุจำกัด รายงานชั่งน้ำหนัก รายการข้อบกพร่องที่เลื่อนแก้ไข (HIL); ชิ้นส่วนต้องมี EASA Form 1 ตำแหน่งติดตั้ง ชั่วโมง/รอบการบิน NHA ข้อมูล AD/LTA ที่เกี่ยวข้อง CAMO ควบคุมบันทึก เก็บไว้ ≥36 เดือน M.A.306: ระบบสมุดบันทึกทางเทคนิคของผู้ประกอบการเชิงพาณิชย์ครอบคลุมแต่ละเที่ยวบิน CRS ปัจจุบัน สถานะการซ่อมบำรุง ข้อบกพร่องที่เลื่อนแก้ไข ได้รับอนุมัติจากหน่วยงาน เก็บไว้ 36 เดือน"}, {"p": "100-102", "en": "M.A.401 Maintenance data: org must use only current applicable maintenance data (authority requirements, ADs, ICA, 145.A.45(d) documentation); a work-card/worksheet system must accurately transcribe or reference the data. M.A.402 Performance: qualified staff, independent inspection after safety-critical tasks, calibrated tools, clean work area, verify removal of all tools/foreign objects and reinstallation of covers after maintenance. M.A.403 Aircraft defects: any defect seriously hazarding flight safety must be rectified before next flight; only authorised certifying staff decide (except MEL use or authority-accepted defects); lesser defects rectified within maintenance-data limits; unrectified defects recorded in the aircraft/operator record system.", "th": "M.A.401 ข้อมูลการซ่อมบำรุง: องค์กรต้องใช้เฉพาะข้อมูลซ่อมบำรุงปัจจุบันที่บังคับใช้ (ข้อกำหนดหน่วยงาน AD ICA เอกสารตาม 145.A.45(d)) ระบบบัตรงาน/ใบงานต้องถ่ายทอดข้อมูลอย่างถูกต้องหรืออ้างอิงถึง M.A.402 การปฏิบัติงาน: บุคลากรที่มีคุณสมบัติ ตรวจสอบอิสระหลังงานที่สำคัญต่อความปลอดภัย เครื่องมือที่ผ่านการสอบเทียบ พื้นที่ทำงานสะอาด ตรวจสอบการนำเครื่องมือ/วัตถุแปลกปลอมออกและติดตั้งฝาครอบกลับหลังซ่อมบำรุง M.A.403 ข้อบกพร่องอากาศยาน: ข้อบกพร่องที่เป็นอันตรายร้ายแรงต่อความปลอดภัยการบินต้องแก้ไขก่อนเที่ยวบินถัดไป บุคลากรออกใบรับรองที่ได้รับอนุญาตเท่านั้นที่ตัดสินใจ (ยกเว้นใช้ MEL หรือหน่วยงานยอมรับ) ข้อบกพร่องเล็กน้อยแก้ไขภายในขีดจำกัดของข้อมูลซ่อมบำรุง ข้อบกพร่องที่ไม่แก้ไขต้องบันทึกในระบบบันทึกของอากาศยาน/ผู้ประกอบการ"}, {"p": "103-109", "en": "M.A.501 Component installation: only satisfactory-condition, EASA Form-1-released (or FAA 8130-3), Part-21-marked components; eligibility (mod/AD configuration) must be checked. Standard parts need traceability evidence; materials need Certificate of Conformity (CoC). M.A.502 Component maintenance: by an org approved per Part-M or Part-145 (C-rated); an 'A-rated' org may maintain a component only while fitted (no Form 1 needed); a 'B-rated' org similarly for engine/APU components. M.A.503 service-life-limited components must not exceed approved life limits; removed at end of life. M.A.504 unserviceable components (expired life, AD non-compliance, missing info, defects, incident involvement) must be quarantined/identified; unsalvageable ones destroyed or transferred for training/research only.", "th": "M.A.501 การติดตั้งชิ้นส่วน: เฉพาะชิ้นส่วนสภาพดี มี EASA Form 1 (หรือ FAA 8130-3) และทำเครื่องหมายตาม Part-21 ต้องตรวจสอบคุณสมบัติ (การดัดแปลง/AD ที่เกี่ยวข้อง) ชิ้นส่วนมาตรฐานต้องมีหลักฐานการตรวจสอบย้อนกลับ วัสดุต้องมีหนังสือรับรองความสอดคล้อง (CoC) M.A.502 การซ่อมบำรุงชิ้นส่วน: โดยองค์กรที่ได้รับอนุมัติตาม Part-M หรือ Part-145 (เรตติ้ง C); องค์กร 'เรตติ้ง A' ซ่อมบำรุงชิ้นส่วนได้เฉพาะขณะติดตั้งอยู่ (ไม่ต้องใช้ Form 1); องค์กร 'เรตติ้ง B' เช่นเดียวกันสำหรับชิ้นส่วนเครื่องยนต์/APU M.A.503 ชิ้นส่วนอายุจำกัดต้องไม่เกินขีดจำกัดที่ได้รับอนุมัติ ต้องถอดออกเมื่อครบอายุ M.A.504 ชิ้นส่วนที่ใช้งานไม่ได้ (หมดอายุ ไม่ปฏิบัติตาม AD ข้อมูลขาดหาย มีข้อบกพร่อง เกี่ยวข้องกับเหตุการณ์) ต้องแยกกักไว้/ระบุชัดเจน ชิ้นส่วนที่กู้คืนไม่ได้ต้องทำลายหรือส่งไปใช้ฝึกอบรม/วิจัยเท่านั้น"}, {"p": "110", "en": "Subpart F (Maintenance Organisation, small aircraft) has been transferred to Part-CAO. ELA1 & ELA2 aircraft are maintained under Part-M Subpart F or CAO organisations, which have similar but less restrictive requirements than Part-145 (e.g. no full QM system).", "th": "Subpart F (องค์กรซ่อมบำรุง อากาศยานขนาดเล็ก) ถูกโอนไปยัง Part-CAO แล้ว อากาศยาน ELA1 และ ELA2 ซ่อมบำรุงภายใต้ Part-M Subpart F หรือองค์กร CAO ซึ่งมีข้อกำหนดคล้ายกันแต่เข้มงวดน้อยกว่า Part-145 (เช่น ไม่ต้องมีระบบ QM เต็มรูปแบบ)"}, {"p": "111-119", "en": "Subpart G (CAMO). M.A.701 Scope: requirements to qualify for a CAMO approval. M.A.706 Personnel: accountable manager with corporate authority; nominated person(s) ensuring compliance; for air carriers, a nominated post holder (not employed by a contracted Part-145 org, unless agreed); sufficient qualified staff; competence recorded. M.A.707 Airworthiness Review Staff (ARS): for air carrier/aircraft >2730kg, ≥5 years continuing-airworthiness experience + Part-66 licence (or degree/national equiv.) + formal training + suitable position (Part-66 licence may be replaced by 5 years' experience); for aircraft ≤2730kg/balloons, only 3 years required. ARS must be accepted by the authority after a supervised review; listed by name/type in the CAME; records kept 2 years after leaving.", "th": "Subpart G (CAMO) M.A.701 ขอบเขต: ข้อกำหนดเพื่อผ่านการอนุมัติเป็น CAMO M.A.706 บุคลากร: ผู้จัดการที่รับผิดชอบมีอำนาจองค์กร; บุคคลที่ได้รับมอบหมายให้รับรองการปฏิบัติตาม; สำหรับสายการบิน ต้องมีผู้ดำรงตำแหน่งที่ได้รับการเสนอชื่อ (ไม่ใช่พนักงานขององค์กร Part-145 ที่ทำสัญญา เว้นแต่ตกลงกัน); บุคลากรที่มีคุณสมบัติเพียงพอ; บันทึกความสามารถไว้ M.A.707 เจ้าหน้าที่ตรวจสอบความสมควรเดินอากาศ (ARS): สำหรับสายการบิน/อากาศยาน >2730กก. ต้องมีประสบการณ์ด้านความสมควรเดินอากาศต่อเนื่อง ≥5 ปี + ใบอนุญาต Part-66 (หรือปริญญา/เทียบเท่าระดับชาติ) + ฝึกอบรมทางการ + ตำแหน่งที่เหมาะสม (ใบอนุญาต Part-66 อาจแทนที่ด้วยประสบการณ์ 5 ปี); สำหรับอากาศยาน ≤2730กก./บอลลูน ต้องการเพียง 3 ปี ARS ต้องได้รับการยอมรับจากหน่วยงานหลังการตรวจสอบภายใต้การควบคุมดูแล ระบุชื่อ/ประเภทใน CAME บันทึกเก็บไว้ 2 ปีหลังออกจากองค์กร"}, {"p": "120-124", "en": "M.A.708 CAMO management duties: develop/control the AMP (incl. reliability program), submit AMP to NAA (or indirect approval), manage mod/repair approval, ensure AD compliance and defect correction by approved orgs, coordinate scheduled maintenance/AD/life-limited parts, manage continuing-airworthiness records, ensure mass & balance is current. For large aircraft/CAT not Part-145 approved themselves, a written maintenance contract with a Part-145 org is required (individual work orders allowed for unscheduled line/component maintenance). M.A.710 Airworthiness Review: full documented records review + physical aircraft survey by ARS (markings/placards, flight-manual compliance, no unaddressed defects, no inconsistencies); may be anticipated up to 90 days early; ARC copy sent to NAA within 10 days; cannot be sub-contracted; inconclusive outcome reported to authority within 72 hours.", "th": "M.A.708 หน้าที่การจัดการของ CAMO: พัฒนา/ควบคุม AMP (รวมโปรแกรมความน่าเชื่อถือ) ยื่น AMP ต่อ NAA (หรืออนุมัติทางอ้อม) จัดการอนุมัติการดัดแปลง/ซ่อมแซม รับรอง AD และแก้ไขข้อบกพร่องโดยองค์กรที่ได้รับอนุมัติ ประสานงานซ่อมบำรุงตามกำหนด/AD/ชิ้นส่วนอายุจำกัด จัดการบันทึกความสมควรเดินอากาศต่อเนื่อง รับรองรายงานน้ำหนักและสมดุลเป็นปัจจุบัน สำหรับอากาศยานขนาดใหญ่/CAT ที่ไม่ได้รับอนุมัติ Part-145 เอง ต้องมีสัญญาซ่อมบำรุงเป็นลายลักษณ์อักษรกับองค์กร Part-145 (อนุญาตใบสั่งงานรายบุคคลสำหรับซ่อมบำรุงระดับลาน/ชิ้นส่วนที่ไม่ได้กำหนดไว้) M.A.710 การตรวจสอบความสมควรเดินอากาศ: ทบทวนบันทึกเอกสารเต็มรูปแบบ + สำรวจอากาศยานจริงโดย ARS (เครื่องหมาย/ป้าย การปฏิบัติตามคู่มือการบิน ไม่มีข้อบกพร่องที่ไม่ได้แก้ไข ไม่มีความไม่สอดคล้อง) อาจล่วงหน้าได้ถึง 90 วัน ส่งสำเนา ARC ให้ NAA ภายใน 10 วัน ห้ามรับช่วงต่อ ผลไม่ชัดเจนต้องรายงานหน่วยงานภายใน 72 ชั่วโมง"}, {"p": "125-132", "en": "M.A.711 CAMO privileges: manage CAW of aircraft on its approval (incl. air carrier aircraft if also on the AOC); subcontract limited tasks; extend ARCs issued within a controlled environment; a CAMO also approved for airworthiness reviews may issue/extend ARCs and issue recommendations to the authority; may issue permits to fly. M.A.712 Quality system: compliance manager monitors procedures, contracted maintenance, and continued compliance; records kept ≥2 years; small non-CAT organisations may use organisational reviews instead. M.A.713 Changes (name, location, accountable manager, key personnel, facilities/scope) must be notified before taking place. M.A.714 Records retained until 2 years after aircraft withdrawal from service; backups stored separately. M.A.715 Approval valid indefinitely subject to continued compliance, authority access, and non-surrender. M.A.716 Findings require a corrective action plan agreed with the NAA.", "th": "M.A.711 สิทธิ์ของ CAMO: จัดการความสมควรเดินอากาศต่อเนื่องของอากาศยานตามที่ได้รับอนุมัติ (รวมอากาศยานสายการบินหากอยู่ใน AOC ด้วย); รับช่วงงานบางส่วน; ต่ออายุ ARC ที่ออกภายในสภาพแวดล้อมควบคุม; CAMO ที่ได้รับอนุมัติให้ตรวจสอบความสมควรเดินอากาศด้วยอาจออก/ต่ออายุ ARC และเสนอแนะต่อหน่วยงาน; อาจออกใบอนุญาตบิน M.A.712 ระบบคุณภาพ: ผู้จัดการฝ่ายปฏิบัติตามข้อกำหนดตรวจสอบขั้นตอน การซ่อมบำรุงที่ทำสัญญา และการปฏิบัติตามต่อเนื่อง; เก็บบันทึก ≥2 ปี; องค์กรขนาดเล็กที่ไม่ใช่ CAT อาจใช้การทบทวนองค์กรแทนได้ M.A.713 การเปลี่ยนแปลง (ชื่อ ที่ตั้ง ผู้จัดการที่รับผิดชอบ บุคลากรหลัก สิ่งอำนวยความสะดวก/ขอบเขต) ต้องแจ้งก่อนดำเนินการ M.A.714 บันทึกเก็บไว้จนถึง 2 ปีหลังอากาศยานเลิกใช้งาน สำรองข้อมูลเก็บแยกที่ M.A.715 การอนุมัติมีผลไม่จำกัดเวลาตราบใดที่ปฏิบัติตามต่อเนื่อง หน่วยงานเข้าถึงได้ และไม่ถูกยกเลิก M.A.716 ข้อบกพร่องต้องมีแผนแก้ไขที่ตกลงกับ NAA"}, {"p": "133-143", "en": "Subpart H CRS: for large aircraft, defined in 145.A.50; small/non-CAT aircraft CRS is under Part-CAO. M.A.802 Component CRS = EASA Form 1. M.A.803 Pilot-owner authorisation: requires a valid pilot licence and sole/joint ownership. Subpart I: M.A.901 Airworthiness Review — ARC (Form 15a/b/c) issued after satisfactory review, valid 1 year. 'Controlled environment' = continuously managed by one CAMO and maintained only by Part-145/M-F/CAO for the previous 12 months. CAMO in a controlled environment may issue/extend an ARC twice (1 year each). Non-controlled or large aircraft not managed by a privileged CAMO: ARC issued by the authority based on a CAMO recommendation. M.A.902: ARC becomes invalid if suspended/revoked, CofA suspended/revoked, deregistered, or TC suspended/revoked. M.A.903: transferring registration within the EU keeps the former ARC valid until its expiry.", "th": "Subpart H CRS: สำหรับอากาศยานขนาดใหญ่ กำหนดใน 145.A.50; อากาศยานขนาดเล็ก/ไม่ใช่ CAT อยู่ภายใต้ Part-CAO M.A.802 CRS ของชิ้นส่วน = EASA Form 1 M.A.803 การอนุญาตเจ้าของ-นักบิน: ต้องมีใบอนุญาตนักบินที่ถูกต้องและเป็นเจ้าของแต่เพียงผู้เดียว/ร่วม Subpart I: M.A.901 การตรวจสอบความสมควรเดินอากาศ — ARC (Form 15a/b/c) ออกหลังการตรวจสอบที่น่าพอใจ มีอายุ 1 ปี 'สภาพแวดล้อมควบคุม' = จัดการต่อเนื่องโดย CAMO เดียวและซ่อมบำรุงโดย Part-145/M-F/CAO เท่านั้นในช่วง 12 เดือนที่ผ่านมา CAMO ในสภาพแวดล้อมควบคุมอาจออก/ต่ออายุ ARC ได้สองครั้ง (ครั้งละ 1 ปี) อากาศยานที่ไม่ควบคุมหรือขนาดใหญ่ที่ไม่ได้จัดการโดย CAMO ที่มีสิทธิ์: ARC ออกโดยหน่วยงานตามคำแนะนำของ CAMO M.A.902: ARC เป็นโมฆะหากถูกระงับ/เพิกถอน CofA ถูกระงับ/เพิกถอน ยกเลิกทะเบียน หรือ TC ถูกระงับ/เพิกถอน M.A.903: การโอนทะเบียนภายใน EU ทำให้ ARC เดิมยังใช้ได้จนถึงวันหมดอายุ"}, {"p": "144-145", "en": "Part-ML regulates continuing airworthiness of non-technically-complex aircraft: <2730kg, rotorcraft <1200kg (max 4 occupants), and other ELA2 aircraft — if not operated by an air carrier with AOC. Maintenance may be performed by Part-CAO, Part-M Subpart F, or Part-145 organisations. 'Owner' = registered owner, lessee, or operator (commercial use). 'Independent Certifying Staff' (ICS) = certifying staff not working on behalf of an approved maintenance organisation but meeting Part-66 requirements for the relevant aircraft group.", "th": "Part-ML กำกับความสมควรเดินอากาศต่อเนื่องของอากาศยานที่ไม่ซับซ้อนทางเทคนิค: <2730กก. เฮลิคอปเตอร์ <1200กก. (สูงสุด 4 ที่นั่ง) และอากาศยาน ELA2 อื่น ๆ — หากไม่ได้ปฏิบัติการโดยสายการบินที่มี AOC การซ่อมบำรุงอาจทำโดยองค์กร Part-CAO, Part-M Subpart F หรือ Part-145 'เจ้าของ' = เจ้าของที่จดทะเบียน ผู้เช่า หรือผู้ประกอบการ (ใช้เชิงพาณิชย์) 'บุคลากรออกใบรับรองอิสระ' (ICS) = บุคลากรออกใบรับรองที่ไม่ได้ทำงานในนามองค์กรซ่อมบำรุงที่ได้รับอนุมัติ แต่ผ่านข้อกำหนด Part-66 สำหรับกลุ่มอากาศยานที่เกี่ยวข้อง"}], "quiz": [{"q_en": "Under M.A.201, who is responsible for the continuing airworthiness of an aircraft by default?", "q_th": "ตาม M.A.201 ใครรับผิดชอบความสมควรเดินอากาศต่อเนื่องของอากาศยานโดยปกติ?", "choices_en": ["The owner (or lessee if stated in the lease/registration)", "The passenger", "The airport operator", "ICAO"], "choices_th": ["เจ้าของ (หรือผู้เช่าหากระบุในสัญญาเช่า/ทะเบียน)", "ผู้โดยสาร", "ผู้ดำเนินการสนามบิน", "ICAO"], "a": 0}, {"q_en": "Within what timeframe must an occurrence under M.A.202 be reported to the authority?", "q_th": "เหตุการณ์ตาม M.A.202 ต้องรายงานต่อหน่วยงานภายในเวลาเท่าใด?", "choices_en": ["24 hours", "48 hours", "72 hours", "7 days"], "choices_th": ["24 ชั่วโมง", "48 ชั่วโมง", "72 ชั่วโมง", "7 วัน"], "a": 2}, {"q_en": "An 'A-rated' maintenance organisation may maintain a component under aircraft maintenance data:", "q_th": "องค์กรซ่อมบำรุง 'เรตติ้ง A' อาจซ่อมบำรุงชิ้นส่วนภายใต้ข้อมูลซ่อมบำรุงอากาศยานได้เมื่อใด?", "choices_en": ["Only while the component remains fitted to the aircraft (temporary removal for access is allowed, no Form 1 needed)", "Only in a fully equipped component shop", "Only with EASA Form 1 for every task", "Never — only B-rated organisations can do this"], "choices_th": ["เฉพาะขณะที่ชิ้นส่วนยังติดตั้งอยู่กับอากาศยาน (ถอดชั่วคราวเพื่อเข้าถึงได้ ไม่ต้องใช้ Form 1)", "เฉพาะในโรงซ่อมชิ้นส่วนที่มีอุปกรณ์ครบเท่านั้น", "ต้องใช้ EASA Form 1 ทุกงาน", "ไม่ได้เลย — เฉพาะองค์กรเรตติ้ง B เท่านั้นที่ทำได้"], "a": 0}, {"q_en": "What defines an aircraft as being in a 'controlled environment' for ARC purposes?", "q_th": "อะไรทำให้อากาศยานอยู่ใน 'สภาพแวดล้อมควบคุม' สำหรับวัตถุประสงค์ของ ARC?", "choices_en": ["It has flown internationally", "Continuously managed by one CAMO and maintained only by Part-145/M-F/CAO organisations for the previous 12 months", "It is less than 5 years old", "It is a large aircraft"], "choices_th": ["บินระหว่างประเทศ", "จัดการต่อเนื่องโดย CAMO เดียวและซ่อมบำรุงโดยองค์กร Part-145/M-F/CAO เท่านั้นในช่วง 12 เดือนที่ผ่านมา", "อายุน้อยกว่า 5 ปี", "เป็นอากาศยานขนาดใหญ่"], "a": 1}, {"q_en": "A CAMO in a controlled environment approved to extend an ARC it issued may do so:", "q_th": "CAMO ในสภาพแวดล้อมควบคุมที่ได้รับอนุมัติให้ต่ออายุ ARC ที่ตนออกเอง สามารถทำได้อย่างไร?", "choices_en": ["An unlimited number of times", "Twice, for a period of one year each time", "Only once", "Never, only the NAA can extend an ARC"], "choices_th": ["ไม่จำกัดจำนวนครั้ง", "สองครั้ง ครั้งละ 1 ปี", "ครั้งเดียวเท่านั้น", "ไม่ได้เลย เฉพาะ NAA เท่านั้นที่ต่ออายุ ARC ได้"], "a": 1}, {"q_en": "For a CAMO's Airworthiness Review Staff (ARS) covering aircraft used by air carriers and aircraft above 2730 kg MTOM, how many years of continuing-airworthiness experience are normally required?", "q_th": "เจ้าหน้าที่ ARS ของ CAMO ที่ดูแลอากาศยานของสายการบินและอากาศยานเกิน 2730 กก. MTOM ปกติต้องมีประสบการณ์กี่ปี?", "choices_en": ["1 year", "3 years", "5 years", "10 years"], "choices_th": ["1 ปี", "3 ปี", "5 ปี", "10 ปี"], "a": 2}, {"q_en": "What must an aircraft maintenance programme (AMP) include for large aircraft based on MSG logic?", "q_th": "โปรแกรมซ่อมบำรุงอากาศยาน (AMP) สำหรับอากาศยานขนาดใหญ่ที่ใช้ตรรกะ MSG ต้องมีอะไรรวมอยู่ด้วย?", "choices_en": ["A reliability program", "A noise certificate", "A pilot training syllabus", "A passenger manifest"], "choices_th": ["โปรแกรมความน่าเชื่อถือ", "ใบรับรองเสียง", "หลักสูตรฝึกอบรมนักบิน", "รายชื่อผู้โดยสาร"], "a": 0}, {"q_en": "Which aircraft category does Part-ML regulate?", "q_th": "Part-ML กำกับดูแลอากาศยานประเภทใด?", "choices_en": ["All large commercial airliners", "Non-technically-complex aircraft (<2730kg, rotorcraft <1200kg, other ELA2), if not operated by an air carrier with AOC", "Only military aircraft", "Only aircraft over 5700kg"], "choices_th": ["เครื่องบินโดยสารพาณิชย์ขนาดใหญ่ทั้งหมด", "อากาศยานที่ไม่ซับซ้อนทางเทคนิค (<2730กก. เฮลิคอปเตอร์ <1200กก. ELA2 อื่น ๆ) หากไม่ได้ปฏิบัติการโดยสายการบินที่มี AOC", "อากาศยานทหารเท่านั้น", "อากาศยานเกิน 5700กก. เท่านั้น"], "a": 1}, {"q_en": "How long must an aircraft's detailed maintenance records for a service-life-limited component be retained after release to service?", "q_th": "บันทึกซ่อมบำรุงโดยละเอียดสำหรับชิ้นส่วนอายุจำกัดต้องเก็บไว้นานเท่าใดหลังการปล่อยกลับสู่บริการ?", "choices_en": ["12 months", "24 months", "Not less than 36 months", "Indefinitely, no minimum specified"], "choices_th": ["12 เดือน", "24 เดือน", "ไม่น้อยกว่า 36 เดือน", "ไม่จำกัดเวลา ไม่มีขั้นต่ำกำหนดไว้"], "a": 2}, {"q_en": "An aircraft's Airworthiness Review Certificate (ARC) becomes invalid if:", "q_th": "ใบรับรองการตรวจสอบความสมควรเดินอากาศ (ARC) ของอากาศยานเป็นโมฆะเมื่อใด?", "choices_en": ["The pilot changes airline", "The aircraft is repainted", "The Certificate of Airworthiness is suspended or revoked, or the aircraft is removed from a Member State's register", "The aircraft flies to a non-EU country"], "choices_th": ["นักบินเปลี่ยนสายการบิน", "อากาศยานถูกทาสีใหม่", "ใบสำคัญสมควรเดินอากาศถูกระงับหรือเพิกถอน หรืออากาศยานถูกถอดจากทะเบียนของรัฐสมาชิก", "อากาศยานบินไปประเทศนอก EU"], "a": 2}, {"q_en": "Who must issue a written maintenance contract with a Part-145 organisation when the operator of large/CAT aircraft is not itself Part-145 approved?", "q_th": "ใครต้องออกสัญญาซ่อมบำรุงเป็นลายลักษณ์อักษรกับองค์กร Part-145 เมื่อผู้ประกอบการอากาศยานขนาดใหญ่/CAT ไม่ได้รับอนุมัติ Part-145 เอง?", "choices_en": ["The pilot", "The CAMO", "The passenger", "The airport"], "choices_th": ["นักบิน", "CAMO", "ผู้โดยสาร", "สนามบิน"], "a": 1}, {"q_en": "Airworthiness review tasks under M.A.710 may be:", "q_th": "งานตรวจสอบความสมควรเดินอากาศตาม M.A.710 สามารถทำได้อย่างไร?", "choices_en": ["Freely subcontracted to any organisation", "Never sub-contracted", "Subcontracted only to Part-21 organisations", "Performed by any skilled worker without ARS qualification"], "choices_th": ["รับช่วงต่อให้องค์กรใดก็ได้อย่างอิสระ", "ห้ามรับช่วงต่อ", "รับช่วงต่อได้เฉพาะองค์กร Part-21", "ทำได้โดยช่างฝีมือใดก็ได้โดยไม่ต้องมีคุณสมบัติ ARS"], "a": 1}]}, {"id": 7, "title_en": "Part CAMO & Part CAO", "title_th": "Part CAMO & Part CAO", "pages": "146–179", "diagram": "<svg viewBox=\"0 0 740 210\" xmlns=\"http://www.w3.org/2000/svg\">\n<text x=\"370\" y=\"20\" text-anchor=\"middle\" fill=\"var(--amber)\" font-size=\"13\" font-weight=\"600\" font-family=\"Chakra Petch, Sarabun, sans-serif\">CAO / CAMO responsibility spectrum</text>\n<text x=\"370\" y=\"34\" text-anchor=\"middle\" fill=\"var(--dim)\" font-size=\"10\">สเปกตรัมความรับผิดชอบของ CAO / CAMO</text>\n<rect x=\"20\" y=\"55\" width=\"330\" height=\"120\" rx=\"8\" fill=\"var(--panel)\" stroke=\"var(--cyan)\"/>\n<text x=\"185\" y=\"78\" text-anchor=\"middle\" fill=\"var(--cyan)\" font-size=\"12\" font-weight=\"600\" font-family=\"Chakra Petch, Sarabun, sans-serif\">LSA · ELA1 · ELA2 (≤2730 kg)</text>\n<text x=\"185\" y=\"93\" text-anchor=\"middle\" fill=\"var(--dim)\" font-size=\"9\">NCO / SPO — simple ops</text>\n<text x=\"185\" y=\"112\" text-anchor=\"middle\" fill=\"var(--text)\" font-size=\"9\">CAW mgmt: Pilot-Owner · CAO · CAMO</text>\n<text x=\"185\" y=\"127\" text-anchor=\"middle\" fill=\"var(--text)\" font-size=\"9\">Release: Pilot-Owner · CAO · Part-145</text>\n<text x=\"185\" y=\"150\" text-anchor=\"middle\" fill=\"var(--dim)\" font-size=\"8\">การจัดการ/ปล่อยงานยืดหยุ่นกว่า</text>\n<rect x=\"390\" y=\"55\" width=\"330\" height=\"120\" rx=\"8\" fill=\"var(--amber-bg)\" stroke=\"var(--amber)\"/>\n<text x=\"555\" y=\"78\" text-anchor=\"middle\" fill=\"var(--amber)\" font-size=\"12\" font-weight=\"600\" font-family=\"Chakra Petch, Sarabun, sans-serif\">Complex / CAT aircraft</text>\n<text x=\"555\" y=\"93\" text-anchor=\"middle\" fill=\"var(--dim)\" font-size=\"9\">Commercial air transport</text>\n<text x=\"555\" y=\"112\" text-anchor=\"middle\" fill=\"var(--text)\" font-size=\"9\">CAW mgmt: CAMO only</text>\n<text x=\"555\" y=\"127\" text-anchor=\"middle\" fill=\"var(--text)\" font-size=\"9\">Release: Part-145 only</text>\n<text x=\"555\" y=\"150\" text-anchor=\"middle\" fill=\"var(--dim)\" font-size=\"8\">ต้องใช้ CAMO + Part-145 เท่านั้น</text>\n<line x1=\"350\" y1=\"115\" x2=\"385\" y2=\"115\" stroke=\"var(--dim)\" stroke-width=\"1.5\" marker-end=\"url(#arrow2)\"/>\n<text x=\"370\" y=\"195\" text-anchor=\"middle\" fill=\"var(--dim)\" font-size=\"9\">increasing complexity → / ความซับซ้อนเพิ่มขึ้น →</text>\n<defs><marker id=\"arrow2\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 Z\" fill=\"var(--dim)\"/></marker></defs>\n</svg>", "sections": [{"p": "148", "en": "CAMO.A.005 Scope: requirements to qualify for a certificate managing continuing airworthiness of aircraft and installable components. CAMO.A.105 Competent authority: the Member State where the org is located (if not part of an AOC), the Member State of the operator (if part of an AOC), or EASA (if the org is in a third country).", "th": "CAMO.A.005 ขอบเขต: ข้อกำหนดเพื่อผ่านการรับรองจัดการความสมควรเดินอากาศต่อเนื่องของอากาศยานและชิ้นส่วนที่ติดตั้งได้ CAMO.A.105 หน่วยงานที่มีอำนาจ: รัฐสมาชิกที่องค์กรตั้งอยู่ (หากไม่ได้เป็นส่วนหนึ่งของ AOC) รัฐสมาชิกของผู้ประกอบการ (หากเป็นส่วนหนึ่งของ AOC) หรือ EASA (หากองค์กรตั้งอยู่ในประเทศที่สาม)"}, {"p": "149-152", "en": "CAMO.A.125 Privileges: manage CAW, subcontract limited tasks, extend ARCs, approve AMP (Part-ML), carry out airworthiness reviews and issue/extend ARCs, issue recommendations, issue permits to fly. CAMO.A.135 Continued validity depends on compliance, authority access, and non-surrender. CAMO.A.150 Findings require root-cause identification and a corrective action plan agreed with the authority. CAMO.A.155 must implement mandated safety measures immediately. CAMO.A.160 Occurrence reporting: report within 72 hours to the authority and design organisation, with a follow-up report on preventive actions where relevant.", "th": "CAMO.A.125 สิทธิ์: จัดการความสมควรเดินอากาศต่อเนื่อง รับช่วงงานบางส่วน ต่ออายุ ARC อนุมัติ AMP (Part-ML) ทำการตรวจสอบความสมควรเดินอากาศและออก/ต่ออายุ ARC เสนอแนะ ออกใบอนุญาตบิน CAMO.A.135 ความถูกต้องต่อเนื่องขึ้นอยู่กับการปฏิบัติตาม การเข้าถึงของหน่วยงาน และไม่ถูกยกเลิก CAMO.A.150 ข้อบกพร่องต้องระบุสาเหตุรากเหง้าและแผนแก้ไขที่ตกลงกับหน่วยงาน CAMO.A.155 ต้องดำเนินมาตรการความปลอดภัยที่บังคับใช้ทันที CAMO.A.160 การรายงานเหตุการณ์: รายงานภายใน 72 ชั่วโมงต่อหน่วยงานและองค์กรออกแบบ พร้อมรายงานติดตามผลมาตรการป้องกันหากเกี่ยวข้อง"}, {"p": "153-165", "en": "CAMO.A.200 Management System (SMS, implementing ICAO Annex 19): clear responsibility/accountability lines with AM's direct safety accountability; safety policy; hazard identification & risk management; trained/competent personnel; documentation; compliance monitoring with feedback to AM. Key processes: hazard identification, safety risk management, internal investigation, safety performance monitoring, management of change, continuous improvement, immediate safety action/ERP. Organisation: Safety Manager + Safety Review Board (SRB, chaired by AM — monitors performance vs policy) + optional Safety Action Group (SAG, day-to-day work under the SRB). Responsibility can be delegated; accountability cannot. Compliance monitoring: independent audits (auditors not involved in what they audit), audit plan covering all activities within 1 year, feedback to AM not contracted out, AM meets senior staff every 6 months. CAMO.A.202 Internal safety reporting scheme covers both mandatory (A.160) and internally-reported errors/near-misses/hazards, extended to subcontracted organisations.", "th": "CAMO.A.200 ระบบการจัดการ (SMS ตามกรอบ ICAO Annex 19): สายความรับผิดชอบ/ภาระรับผิดชอบชัดเจนโดย AM รับผิดชอบด้านความปลอดภัยโดยตรง; นโยบายความปลอดภัย; การระบุอันตรายและจัดการความเสี่ยง; บุคลากรที่ผ่านการฝึกอบรม/มีความสามารถ; เอกสาร; การตรวจสอบการปฏิบัติตามพร้อมข้อมูลย้อนกลับถึง AM กระบวนการหลัก: การระบุอันตราย การจัดการความเสี่ยงด้านความปลอดภัย การสอบสวนภายใน การติดตามผลด้านความปลอดภัย การจัดการความเปลี่ยนแปลง การปรับปรุงต่อเนื่อง มาตรการความปลอดภัยทันที/ERP โครงสร้าง: ผู้จัดการความปลอดภัย + คณะกรรมการทบทวนความปลอดภัย (SRB มี AM เป็นประธาน — ติดตามผลเทียบกับนโยบาย) + กลุ่มปฏิบัติการความปลอดภัย (SAG ทำงานประจำวันภายใต้ SRB) ความรับผิดชอบมอบหมายได้ แต่ภาระรับผิดชอบมอบหมายไม่ได้ การตรวจสอบการปฏิบัติตาม: การตรวจสอบอิสระ (ผู้ตรวจสอบไม่เกี่ยวข้องกับสิ่งที่ตรวจ) แผนตรวจสอบครอบคลุมทุกกิจกรรมภายใน 1 ปี ข้อมูลย้อนกลับถึง AM ไม่รับช่วงต่อ AM พบผู้บริหารระดับสูงทุก 6 เดือน CAMO.A.202 ระบบรายงานความปลอดภัยภายในครอบคลุมทั้งการรายงานบังคับ (A.160) และข้อผิดพลาด/เหตุการณ์เกือบเกิด/อันตรายที่รายงานภายใน ขยายไปถึงองค์กรที่รับช่วงต่อด้วย"}, {"p": "166-170", "en": "CAMO.A.205 Contracting/subcontracting: activities must conform to requirements, hazards considered in the management system, authority given access to subcontracted orgs. CAMO.A.220 Records: ARC copies + supporting docs kept 3 years after aircraft transfer; management-system/contract records kept ≥5 years; personnel records kept until 3 years after leaving. CAMO.A.300 CAME must include: AM confirmation statement, safety policy & internal reporting description, scope of work, manpower/availability plan, nominated persons & org chart, ARC-authorised staff list, facilities description, management-system documentation, contracting/subcontracting control procedures, list of approved AMPs, maintenance contracts, and approved AltMoCs; approved by the authority.", "th": "CAMO.A.205 การทำสัญญา/รับช่วงต่อ: กิจกรรมต้องเป็นไปตามข้อกำหนด พิจารณาอันตรายในระบบการจัดการ ให้หน่วยงานเข้าถึงองค์กรที่รับช่วงต่อได้ CAMO.A.220 บันทึก: สำเนา ARC + เอกสารสนับสนุนเก็บไว้ 3 ปีหลังโอนอากาศยาน; บันทึกระบบการจัดการ/สัญญาเก็บไว้ ≥5 ปี; บันทึกบุคลากรเก็บไว้จนถึง 3 ปีหลังออกจากองค์กร CAMO.A.300 CAME ต้องประกอบด้วย: หนังสือยืนยันจาก AM คำอธิบายนโยบายความปลอดภัย/การรายงานภายใน ขอบเขตงาน แผนกำลังคน/ความพร้อม บุคคลที่ได้รับมอบหมาย & ผังองค์กร รายชื่อบุคลากรที่ได้รับอนุญาตออก ARC คำอธิบายสิ่งอำนวยความสะดวก เอกสารระบบการจัดการ ขั้นตอนควบคุมการทำสัญญา/รับช่วงต่อ รายการ AMP ที่ได้รับอนุมัติ สัญญาซ่อมบำรุง และ AltMoC ที่ได้รับอนุมัติ; ได้รับอนุมัติจากหน่วยงาน"}, {"p": "171-177", "en": "CAMO.A.305 Personnel requirements: AM ensures resources, safety policy, nominates compliance-monitoring and safety-management persons with direct access to him/her, demonstrates basic understanding of the Regulation; nominated persons need relevant knowledge/experience and competency including safety management & human factors. CAMO.A.310 ARS qualifications mirror M.A.707 (5 years' experience, Part-66/degree/equivalent, formal training, position in the CAMO, accepted by the authority). CAMO.A.315 Continuing airworthiness management: develop/control AMP w/ reliability program, ensure mod/repair data compliance, manage written maintenance contracts, account for human factors in all contracted/subcontracted work. CAMO.A.320 Airworthiness review per M.A.901/ML.A.903. CAMO.A.325: must hold/use current maintenance data (M.A.401/ML.A.401), which may be provided by the owner/operator.", "th": "CAMO.A.305 ข้อกำหนดบุคลากร: AM รับรองทรัพยากร นโยบายความปลอดภัย มอบหมายบุคคลตรวจสอบการปฏิบัติตามและจัดการความปลอดภัยที่เข้าถึงตนได้โดยตรง แสดงความเข้าใจพื้นฐานของกฎระเบียบ; บุคคลที่ได้รับมอบหมายต้องมีความรู้/ประสบการณ์ที่เกี่ยวข้องและความสามารถรวมถึงการจัดการความปลอดภัยและปัจจัยมนุษย์ CAMO.A.310 คุณสมบัติ ARS เหมือนกับ M.A.707 (ประสบการณ์ 5 ปี Part-66/ปริญญา/เทียบเท่า ฝึกอบรมทางการ ตำแหน่งใน CAMO ได้รับการยอมรับจากหน่วยงาน) CAMO.A.315 การจัดการความสมควรเดินอากาศต่อเนื่อง: พัฒนา/ควบคุม AMP พร้อมโปรแกรมความน่าเชื่อถือ รับรองการปฏิบัติตามข้อมูลดัดแปลง/ซ่อมแซม จัดการสัญญาซ่อมบำรุงเป็นลายลักษณ์อักษร คำนึงถึงปัจจัยมนุษย์ในงานที่ทำสัญญา/รับช่วงต่อทั้งหมด CAMO.A.320 การตรวจสอบความสมควรเดินอากาศตาม M.A.901/ML.A.903 CAMO.A.325: ต้องมี/ใช้ข้อมูลซ่อมบำรุงปัจจุบัน (M.A.401/ML.A.401) ซึ่งเจ้าของ/ผู้ประกอบการอาจเป็นผู้จัดหาให้"}, {"p": "178-179", "en": "Part-CAO (Combined Airworthiness Organisation) performs BOTH continuing airworthiness management AND maintenance for non-complex power-driven aircraft (Part-M/ML + parts of Part-145 apply, less stringently). CAO privileges: maintain aircraft/components per its exposition (CAE); release aircraft (certifying staff, Part-66) and components (national regulation); manage/maintain CAW for aircraft it's certified for; approve AMP; perform/renew airworthiness reviews (ARC 15b) if it has approved ARS. Applicability spans from LSA/ELA1/ELA2 (via CAO/Part-ML/pilot-owner) up to full CAT/complex aircraft (via Part-M/CAMO/Part-145 only) — the more complex the operation, the more it shifts toward Part-M + CAMO + Part-145 + authority oversight.", "th": "Part-CAO (องค์กรความสมควรเดินอากาศแบบผสม) ทำทั้งการจัดการความสมควรเดินอากาศต่อเนื่องและการซ่อมบำรุงสำหรับอากาศยานที่ไม่ซับซ้อนขับเคลื่อนด้วยเครื่องยนต์ (ใช้ Part-M/ML + บางส่วนของ Part-145 แต่เข้มงวดน้อยกว่า) สิทธิ์ของ CAO: ซ่อมบำรุงอากาศยาน/ชิ้นส่วนตามคู่มือ (CAE); ปล่อยอากาศยาน (บุคลากรออกใบรับรอง Part-66) และชิ้นส่วน (กฎระเบียบระดับชาติ); จัดการ/ซ่อมบำรุงความสมควรเดินอากาศต่อเนื่องสำหรับอากาศยานที่ได้รับการรับรอง; อนุมัติ AMP; ทำ/ต่ออายุการตรวจสอบความสมควรเดินอากาศ (ARC 15b) หากมี ARS ที่ได้รับอนุมัติ ขอบเขตการใช้งานตั้งแต่ LSA/ELA1/ELA2 (ผ่าน CAO/Part-ML/เจ้าของ-นักบิน) ไปจนถึง CAT/อากาศยานซับซ้อนเต็มรูปแบบ (ผ่าน Part-M/CAMO/Part-145 เท่านั้น) — ยิ่งปฏิบัติการซับซ้อนมากเท่าใด ยิ่งเปลี่ยนไปทาง Part-M + CAMO + Part-145 + การกำกับดูแลของหน่วยงานมากขึ้นเท่านั้น"}], "quiz": [{"q_en": "Who is the competent authority for a CAMO whose approval is included in an air operator certificate (AOC)?", "q_th": "หน่วยงานที่มีอำนาจสำหรับ CAMO ที่การอนุมัติรวมอยู่ใน AOC คือใคร?", "choices_en": ["The authority of the Member State where the organisation is located, regardless of the AOC", "The authority of the Member State of the operator", "Always EASA", "ICAO"], "choices_th": ["หน่วยงานของรัฐสมาชิกที่องค์กรตั้งอยู่ ไม่ว่า AOC จะเป็นอย่างไร", "หน่วยงานของรัฐสมาชิกของผู้ประกอบการ", "EASA เสมอ", "ICAO"], "a": 1}, {"q_en": "In CAMO.A.200 Safety Management, which statement about responsibility vs accountability is correct?", "q_th": "ใน CAMO.A.200 ด้านการจัดการความปลอดภัย ข้อความใดเกี่ยวกับความรับผิดชอบและภาระรับผิดชอบถูกต้อง?", "choices_en": ["Both can be delegated", "Responsibility can be delegated, but accountability cannot", "Neither can be delegated", "Only accountability can be delegated"], "choices_th": ["มอบหมายได้ทั้งคู่", "ความรับผิดชอบมอบหมายได้ แต่ภาระรับผิดชอบมอบหมายไม่ได้", "มอบหมายไม่ได้ทั้งคู่", "ภาระรับผิดชอบเท่านั้นที่มอบหมายได้"], "a": 1}, {"q_en": "How often must the Accountable Manager meet with senior staff under CAMO.A.200 compliance monitoring?", "q_th": "ผู้จัดการที่รับผิดชอบต้องพบผู้บริหารระดับสูงบ่อยเพียงใดตามการตรวจสอบการปฏิบัติตามของ CAMO.A.200?", "choices_en": ["Every month", "Every 6 months", "Every 2 years", "Only when a finding occurs"], "choices_th": ["ทุกเดือน", "ทุก 6 เดือน", "ทุก 2 ปี", "เฉพาะเมื่อพบข้อบกพร่องเท่านั้น"], "a": 1}, {"q_en": "How long must CAMO management-system and contracting/subcontracting records be kept?", "q_th": "บันทึกระบบการจัดการและการทำสัญญา/รับช่วงต่อของ CAMO ต้องเก็บไว้นานเท่าใด?", "choices_en": ["1 year", "3 years", "A minimum of 5 years", "No retention required"], "choices_th": ["1 ปี", "3 ปี", "อย่างน้อย 5 ปี", "ไม่ต้องเก็บ"], "a": 2}, {"q_en": "What distinguishes a Part-CAO organisation from a Part-CAMO organisation?", "q_th": "อะไรที่ทำให้ Part-CAO ต่างจาก Part-CAMO?", "choices_en": ["CAO can only manage CAW, never perform maintenance", "CAO performs BOTH continuing airworthiness management and maintenance of non-complex aircraft", "CAO only applies to large commercial aircraft", "There is no difference"], "choices_th": ["CAO จัดการเฉพาะความสมควรเดินอากาศต่อเนื่อง ทำการซ่อมบำรุงไม่ได้", "CAO ทำทั้งการจัดการความสมควรเดินอากาศต่อเนื่องและการซ่อมบำรุงอากาศยานที่ไม่ซับซ้อน", "CAO ใช้เฉพาะอากาศยานพาณิชย์ขนาดใหญ่เท่านั้น", "ไม่มีความแตกต่าง"], "a": 1}, {"q_en": "CAMO.A.160 occurrence reports must be submitted within:", "q_th": "รายงานเหตุการณ์ตาม CAMO.A.160 ต้องส่งภายในเวลาใด?", "choices_en": ["24 hours", "72 hours", "7 days", "30 days"], "choices_th": ["24 ชั่วโมง", "72 ชั่วโมง", "7 วัน", "30 วัน"], "a": 1}, {"q_en": "What must the CAME (Continuing Airworthiness Management Exposition) include regarding personnel authorised to issue ARCs?", "q_th": "CAME ต้องมีอะไรเกี่ยวกับบุคลากรที่ได้รับอนุญาตให้ออก ARC?", "choices_en": ["Nothing, this is kept separately", "A list of staff authorised to issue airworthiness review certificates", "Only their home addresses", "Their salary information"], "choices_th": ["ไม่ต้องมี เก็บแยกต่างหาก", "รายชื่อบุคลากรที่ได้รับอนุญาตให้ออกใบรับรองการตรวจสอบความสมควรเดินอากาศ", "ที่อยู่บ้านเท่านั้น", "ข้อมูลเงินเดือน"], "a": 1}, {"q_en": "For CAMO.A.310 Airworthiness Review Staff qualifications, how many years of continuing-airworthiness experience are generally required (matching M.A.707 for large aircraft/air carriers)?", "q_th": "คุณสมบัติ ARS ตาม CAMO.A.310 โดยทั่วไปต้องมีประสบการณ์ด้านความสมควรเดินอากาศต่อเนื่องกี่ปี (สอดคล้องกับ M.A.707 สำหรับอากาศยานขนาดใหญ่/สายการบิน)?", "choices_en": ["1 year", "3 years", "5 years", "10 years"], "choices_th": ["1 ปี", "3 ปี", "5 ปี", "10 ปี"], "a": 2}]}, {"id": 8, "title_en": "Part 145 – Approved Maintenance Organisation", "title_th": "Part 145 – องค์กรซ่อมบำรุงที่ได้รับอนุมัติ", "pages": "180–235", "sections": [{"p": "182-184", "en": "Part-145 sets requirements for a Maintenance Organisation Approval (MOA). Competent authority = NAA (org's principal place of business in an EU state) or EASA (outside EU). 145.A.10 Scope + 145.A.15 Application: apply to the competent authority in its required form/manner.", "th": "Part-145 กำหนดข้อกำหนดสำหรับใบอนุมัติองค์กรซ่อมบำรุง (MOA) หน่วยงานที่มีอำนาจ = NAA (สถานประกอบการหลักในรัฐ EU) หรือ EASA (นอก EU) 145.A.10 ขอบเขต + 145.A.15 การยื่นคำขอ: ยื่นต่อหน่วยงานที่มีอำนาจตามแบบฟอร์ม/วิธีการที่กำหนด"}, {"p": "185-190", "en": "145.A.20 Terms of approval: scope of work (Capability List) specified in the exposition. 145.A.25 Facility requirements: weather-protected, segregated specialised workshops; hangars/workshops sized for planned work; office accommodation for management/certifying staff; suitable working environment — temperature, dust/contamination control, adequate lighting, noise control; specific environmental conditions per maintenance data must be observed; work suspended if conditions deteriorate unacceptably; secure, segregated storage for serviceable vs unserviceable components/materials with restricted access.", "th": "145.A.20 เงื่อนไขการอนุมัติ: ขอบเขตงาน (Capability List) ระบุในคู่มือองค์กร 145.A.25 ข้อกำหนดสิ่งอำนวยความสะดวก: ป้องกันสภาพอากาศ แยกโรงงานเฉพาะทาง; โรงเก็บ/โรงงานขนาดเหมาะสมกับงานที่วางแผน; สำนักงานสำหรับผู้บริหาร/บุคลากรออกใบรับรอง; สภาพแวดล้อมการทำงานที่เหมาะสม — ควบคุมอุณหภูมิ ฝุ่น/สิ่งปนเปื้อน แสงสว่างเพียงพอ ควบคุมเสียง; ต้องปฏิบัติตามสภาพแวดล้อมเฉพาะตามข้อมูลซ่อมบำรุง; ระงับงานหากสภาพเสื่อมลงจนยอมรับไม่ได้; พื้นที่จัดเก็บปลอดภัยแยกชิ้นส่วนใช้งานได้/ใช้งานไม่ได้ พร้อมจำกัดการเข้าถึง"}, {"p": "191-195", "en": "145.A.30 Personnel: accountable manager (AM) ensures resources, safety policy, basic understanding of Part-145; nominates persons (Form 4) for management structure and a compliance-monitoring person with direct access to AM; man-hour planning system with a procedure to reassess work when staffing is reduced; competency (incl. safety management, human factors) controlled per an agreed procedure; NDT personnel competency per EN 4179 or equivalent (CAT B1/B3 may do dye-penetrant tests).", "th": "145.A.30 บุคลากร: ผู้จัดการที่รับผิดชอบ (AM) รับรองทรัพยากร นโยบายความปลอดภัย ความเข้าใจพื้นฐานของ Part-145; มอบหมายบุคคล (Form 4) สำหรับโครงสร้างการบริหารและบุคคลตรวจสอบการปฏิบัติตามที่เข้าถึง AM ได้โดยตรง; ระบบวางแผนชั่วโมงทำงานพร้อมขั้นตอนประเมินงานใหม่เมื่อกำลังคนลดลง; ความสามารถ (รวมการจัดการความปลอดภัยและปัจจัยมนุษย์) ควบคุมตามขั้นตอนที่ตกลงกัน; ความสามารถบุคลากร NDT ตาม EN 4179 หรือเทียบเท่า (CAT B1/B3 อาจทำการทดสอบสีย้อมแทรกซึมได้)"}, {"p": "196-206", "en": "145.A.35 Certifying/support staff: Line Maintenance needs CAT A/B1/B2 staff; Base Maintenance needs CAT C (+ B1/B2 support staff); component release (Form 1) per national regulation. Third-country certifying staff may be used in limited cases (line station outside EU, repeated AD pre-flight checks, limited pilot authorisation, one-time AOG exemption) — reported to the NAA within 7 days, re-checked by an approved org. Certification authorisation lets staff sign CRS on the org's behalf. Certifying/support staff need ≥6 months' actual relevant maintenance experience in any consecutive 2-year period, plus recurrent training every 2 years. Assessment required before issue/reissue of authorisation; minimum age 21. CAT A privileges require satisfactory Category A task training (practical + theory, demonstrated by exam/workplace assessment); CAT B2 exercising limited A-type privileges needs the A task training PLUS 6 months' documented practical experience. Airworthiness Review Staff in a 145 org (for Part-ML aircraft) need 1 year (sailplanes/balloons) or 3 years (other aircraft) CAW experience, a certifying staff authorisation, and knowledge of Part-M/ML Subpart C and the org's ARC procedures; assessed/accepted by the NAA.", "th": "145.A.35 บุคลากรออกใบรับรอง/สนับสนุน: การซ่อมบำรุงระดับลานต้องใช้บุคลากร CAT A/B1/B2; การซ่อมบำรุงระดับฐานต้องใช้ CAT C (+บุคลากรสนับสนุน B1/B2); การปล่อยชิ้นส่วน (Form 1) ตามกฎระเบียบระดับชาติ บุคลากรออกใบรับรองจากประเทศที่สามอาจใช้ได้ในกรณีจำกัด (สถานีนอก EU ตรวจก่อนบินซ้ำตาม AD การอนุญาตนักบินแบบจำกัด ข้อยกเว้น AOG ครั้งเดียว) — รายงานต่อ NAA ภายใน 7 วัน ตรวจซ้ำโดยองค์กรที่ได้รับอนุมัติ การอนุญาตออกใบรับรองให้บุคลากรลงนาม CRS ในนามองค์กร บุคลากรออกใบรับรอง/สนับสนุนต้องมีประสบการณ์ซ่อมบำรุงจริง ≥6 เดือนในทุกช่วง 2 ปีต่อเนื่อง บวกฝึกอบรมทบทวนทุก 2 ปี ต้องประเมินก่อนออก/ต่ออายุการอนุญาต อายุขั้นต่ำ 21 ปี สิทธิ์ CAT A ต้องผ่านการฝึกอบรมงาน Category A ที่น่าพอใจ (ปฏิบัติ+ทฤษฎี พิสูจน์ด้วยข้อสอบ/ประเมินสถานที่ทำงาน); CAT B2 ที่ใช้สิทธิ์แบบ A บางส่วนต้องมีการฝึกอบรมงาน A บวกประสบการณ์ปฏิบัติที่บันทึกไว้ 6 เดือน เจ้าหน้าที่ตรวจสอบความสมควรเดินอากาศในองค์กร 145 (สำหรับอากาศยาน Part-ML) ต้องมีประสบการณ์ 1 ปี (เครื่องร่อน/บอลลูน) หรือ 3 ปี (อากาศยานอื่น) การอนุญาตออกใบรับรอง และความรู้ Part-M/ML Subpart C และขั้นตอน ARC ขององค์กร ประเมิน/ยอมรับโดย NAA"}, {"p": "207-213", "en": "145.A.40 Equipment/tools/material: manufacturer-specified tools used unless an alternative is authority-agreed; permanently available except infrequently-used items detailed in the exposition; base-maintenance orgs need adequate access/inspection platforms; tools/test equipment calibrated to a recognised standard with traceable records. 145.A.42 Component acceptance categorises components (satisfactory/Form 1, unserviceable, unsalvageable, standard parts, materials with CoC); segregation of unserviceable/unsalvageable from serviceable stock is mandatory; a 145 org may fabricate a restricted range of parts per exposition procedures. EASA Form 1 = official certificate of airworthy/installable condition and traceability, issued only by approved 21.G/145 orgs; marked NEW/PROTOTYPE (21.G) or OVERHAULED/INSPECTED/MODIFIED/REPAIRED (145).", "th": "145.A.40 อุปกรณ์/เครื่องมือ/วัสดุ: ใช้เครื่องมือตามที่ผู้ผลิตกำหนด เว้นแต่หน่วยงานเห็นชอบทางเลือกอื่น; ต้องพร้อมใช้งานตลอดเวลา ยกเว้นรายการที่ใช้ไม่บ่อยระบุไว้ในคู่มือองค์กร; องค์กรซ่อมบำรุงระดับฐานต้องมีอุปกรณ์เข้าถึง/แท่นตรวจสอบเพียงพอ; เครื่องมือ/อุปกรณ์ทดสอบต้องสอบเทียบตามมาตรฐานที่ยอมรับพร้อมบันทึกตรวจสอบย้อนกลับได้ 145.A.42 การรับชิ้นส่วนแบ่งประเภท (สภาพดี/Form 1 ใช้งานไม่ได้ กู้คืนไม่ได้ ชิ้นส่วนมาตรฐาน วัสดุที่มี CoC); ต้องแยกชิ้นส่วนใช้งานไม่ได้/กู้คืนไม่ได้ออกจากสต็อกที่ใช้งานได้; องค์กร 145 อาจผลิตชิ้นส่วนช่วงจำกัดตามขั้นตอนในคู่มือองค์กร EASA Form 1 = ใบรับรองทางการของสภาพสมควรเดินอากาศ/ติดตั้งได้และการตรวจสอบย้อนกลับ ออกโดยองค์กร 21.G/145 ที่ได้รับอนุมัติเท่านั้น; ทำเครื่องหมาย NEW/PROTOTYPE (21.G) หรือ OVERHAULED/INSPECTED/MODIFIED/REPAIRED (145)"}, {"p": "214-217", "en": "145.A.45 Maintenance data: org must use current applicable data (NAA requirements, ADs, ICA, approved standards); errors found in maintenance data are reported via the internal safety scheme (145.A.202) to the data's author; modifications to instructions only per an MOE procedure; common work-card/worksheet system for complex/long tasks, subdivided into clear stages. 145.A.47 Production planning: system to plan personnel/tools/materials/records/facilities availability; must consider human performance limitations & fatigue; shift-handover information shared; hazards from external teams considered. 145.A.48 Performance: post-maintenance general verification (no tools/FOD, panels refitted); error-capturing method after critical tasks; minimise error risk/repetition; damage assessed and repairs use approved data.", "th": "145.A.45 ข้อมูลซ่อมบำรุง: องค์กรต้องใช้ข้อมูลปัจจุบันที่บังคับใช้ (ข้อกำหนด NAA, AD, ICA, มาตรฐานที่ได้รับอนุมัติ); ข้อผิดพลาดที่พบในข้อมูลซ่อมบำรุงรายงานผ่านระบบความปลอดภัยภายใน (145.A.202) ไปยังผู้จัดทำข้อมูล; การดัดแปลงคำแนะนำทำได้ตามขั้นตอนใน MOE เท่านั้น; ระบบบัตรงาน/ใบงานร่วมสำหรับงานซับซ้อน/ยาว แบ่งเป็นขั้นตอนชัดเจน 145.A.47 การวางแผนการผลิต: ระบบวางแผนความพร้อมบุคลากร/เครื่องมือ/วัสดุ/บันทึก/สิ่งอำนวยความสะดวก; ต้องคำนึงถึงข้อจำกัดสมรรถนะมนุษย์และความเหนื่อยล้า; ข้อมูลส่งต่อกะทำงานที่แบ่งปันกัน; พิจารณาอันตรายจากทีมงานภายนอก 145.A.48 การปฏิบัติงาน: ตรวจสอบทั่วไปหลังซ่อมบำรุง (ไม่มีเครื่องมือ/วัตถุแปลกปลอม ติดตั้งฝาครอบกลับ); วิธีจับข้อผิดพลาดหลังงานสำคัญ; ลดความเสี่ยงข้อผิดพลาด/การเกิดซ้ำ; ประเมินความเสียหายและซ่อมแซมใช้ข้อมูลที่ได้รับอนุมัติ"}, {"p": "218-225", "en": "145.A.50 Certification of maintenance: CRS issued by authorised certifying staff after verifying all ordered maintenance is complete with no known non-compliance endangering flight safety, before flight; new defects go to the CAMO (MEL-HIL). Component CRS = EASA Form 1. Incomplete work: CRS may be issued within aircraft limitations (MEL-HIL), or a component may be temporarily fitted without proper release for up to 30 flight hours (or until returning to base) with CAMO agreement in an AOG situation away from main base. 145.A.55 Records: retain proof of CRS compliance + subcontractor release docs for 3 years; copy of each CRS + detailed records sent to the CAMO; ARC records kept 3 years, transferred to the last owner/operator if the org terminates; management-system/contract records kept ≥5 years; personnel records kept ≥3 years after leaving. 145.A.60 Occurrence reporting: report to NAA, design-approval holder, and CAMO/requester within 72 hours of discovery — the goal is a free/open safety-reporting culture that doesn't penalise staff for reporting.", "th": "145.A.50 การรับรองการซ่อมบำรุง: บุคลากรออกใบรับรองที่ได้รับอนุญาตออก CRS หลังตรวจสอบว่างานที่สั่งเสร็จสมบูรณ์และไม่มีข้อไม่ปฏิบัติตามที่รู้จักซึ่งเป็นอันตรายต่อความปลอดภัยการบิน ก่อนบิน; ข้อบกพร่องใหม่ส่งให้ CAMO (MEL-HIL) CRS ของชิ้นส่วน = EASA Form 1 งานที่ไม่สมบูรณ์: อาจออก CRS ภายในขีดจำกัดอากาศยาน (MEL-HIL) หรือติดตั้งชิ้นส่วนชั่วคราวโดยไม่มีใบปล่อยที่เหมาะสมได้สูงสุด 30 ชั่วโมงบิน (หรือจนกลับถึงฐาน) โดยได้รับความเห็นชอบจาก CAMO ในสถานการณ์ AOG ที่ไม่ใช่ฐานหลัก 145.A.55 บันทึก: เก็บหลักฐานการปฏิบัติตาม CRS + เอกสารปล่อยของผู้รับเหมาช่วง 3 ปี; สำเนา CRS แต่ละใบ + บันทึกละเอียดส่งให้ CAMO; บันทึก ARC เก็บ 3 ปี โอนให้เจ้าของ/ผู้ประกอบการสุดท้ายหากองค์กรเลิกกิจการ; บันทึกระบบการจัดการ/สัญญาเก็บ ≥5 ปี; บันทึกบุคลากรเก็บ ≥3 ปีหลังออก 145.A.60 การรายงานเหตุการณ์: รายงานต่อ NAA ผู้ถือใบรับรองแบบ และ CAMO/ผู้ร้องขอภายใน 72 ชั่วโมงหลังพบ — เป้าหมายคือวัฒนธรรมการรายงานความปลอดภัยที่เปิดเผยและไม่ลงโทษพนักงานที่รายงาน"}, {"p": "226-235", "en": "145.A.65 Safety/quality policy & procedures: human factors and good maintenance practices considered; clear work orders agreed between org and requester; independent quality assurance monitors compliance, gives feedback, ensures timely corrective action. 145.A.70 MOE must describe the management system, changes procedures, AM confirmation, subcontractor list, work scope, facilities, org chart, certifying/ARS staff lists, personnel capacity data, line-station list. 145.A.75 Privileges: maintain per approval at declared locations, subcontract within scope, AOG maintenance anywhere, line maintenance per MOE, issue CRS. 145.A.85 Changes (name, location, AM, reporting lines, nominated persons, facilities/scope/staff) must be notified to enable the authority to reassess compliance. 145.A.90 Continued validity: unlimited duration subject to compliance, authority access, and non-surrender/revocation. 145.A.95 Findings require root-cause ID, corrective action plan, and demonstrated implementation within an agreed period. 145.A.200 Management system mirrors CAMO.A.200 (accountability, safety policy, hazard ID/risk management, competent personnel, documented processes, compliance monitoring w/ AM feedback), scaled to org size/complexity. 145.A.202 Internal safety reporting scheme covers both mandatory (A.60) and internal error/near-miss/hazard reports, including subcontracted activities. 145.A.205 Contracting/subcontracting: activities must conform to requirements; subcontracted work operates under the subcontracting org's scope of approval.", "th": "145.A.65 นโยบายความปลอดภัย/คุณภาพและขั้นตอน: พิจารณาปัจจัยมนุษย์และแนวปฏิบัติซ่อมบำรุงที่ดี; ตกลงคำสั่งงานที่ชัดเจนระหว่างองค์กรและผู้ร้องขอ; การประกันคุณภาพอิสระตรวจสอบการปฏิบัติตาม ให้ข้อมูลย้อนกลับ รับรองการแก้ไขทันเวลา 145.A.70 MOE ต้องอธิบายระบบการจัดการ ขั้นตอนการเปลี่ยนแปลง การยืนยันจาก AM รายชื่อผู้รับเหมาช่วง ขอบเขตงาน สิ่งอำนวยความสะดวก ผังองค์กร รายชื่อบุคลากรออกใบรับรอง/ARS ข้อมูลกำลังคน รายการสถานีลาน 145.A.75 สิทธิ์: ซ่อมบำรุงตามที่ได้รับอนุมัติ ณ สถานที่ที่ประกาศไว้ รับช่วงต่อภายในขอบเขต ซ่อมบำรุง AOG ที่ใดก็ได้ ซ่อมบำรุงระดับลานตาม MOE ออก CRS 145.A.85 การเปลี่ยนแปลง (ชื่อ ที่ตั้ง AM สายการรายงาน บุคคลที่ได้รับมอบหมาย สิ่งอำนวยความสะดวก/ขอบเขต/บุคลากร) ต้องแจ้งให้หน่วยงานประเมินการปฏิบัติตามได้ 145.A.90 ความถูกต้องต่อเนื่อง: ไม่จำกัดเวลาตราบใดที่ปฏิบัติตาม หน่วยงานเข้าถึงได้ และไม่ถูกยกเลิก/เพิกถอน 145.A.95 ข้อบกพร่องต้องระบุสาเหตุรากเหง้า แผนแก้ไข และแสดงการดำเนินการภายในเวลาที่ตกลงกัน 145.A.200 ระบบการจัดการคล้ายกับ CAMO.A.200 (ภาระรับผิดชอบ นโยบายความปลอดภัย การระบุอันตราย/จัดการความเสี่ยง บุคลากรที่มีความสามารถ กระบวนการที่บันทึกไว้ การตรวจสอบการปฏิบัติตามพร้อมข้อมูลย้อนกลับถึง AM) ปรับตามขนาด/ความซับซ้อนขององค์กร 145.A.202 ระบบรายงานความปลอดภัยภายในครอบคลุมทั้งรายงานบังคับ (A.60) และรายงานข้อผิดพลาด/เหตุการณ์เกือบเกิด/อันตรายภายใน รวมถึงกิจกรรมที่รับช่วงต่อ 145.A.205 การทำสัญญา/รับช่วงต่อ: กิจกรรมต้องเป็นไปตามข้อกำหนด งานที่รับช่วงต่อดำเนินการภายใต้ขอบเขตการอนุมัติขององค์กรที่รับช่วงต่อ"}], "quiz": [{"q_en": "For Line Maintenance under 145.A.35, which certifying staff categories are required?", "q_th": "การซ่อมบำรุงระดับลานตาม 145.A.35 ต้องใช้บุคลากรออกใบรับรองประเภทใด?", "choices_en": ["Only CAT C", "CAT A, B1, B2", "Only unskilled workers", "Only support staff"], "choices_th": ["CAT C เท่านั้น", "CAT A, B1, B2", "ผู้ฝึกงานเท่านั้น", "บุคลากรสนับสนุนเท่านั้น"], "a": 1}, {"q_en": "What is the minimum age for certifying staff and support staff under 145.A.35?", "q_th": "อายุขั้นต่ำของบุคลากรออกใบรับรองและบุคลากรสนับสนุนตาม 145.A.35 คือเท่าใด?", "choices_en": ["18 years", "21 years", "25 years", "No minimum age"], "choices_th": ["18 ปี", "21 ปี", "25 ปี", "ไม่มีอายุขั้นต่ำ"], "a": 1}, {"q_en": "Certifying and support staff must have how much actual relevant maintenance experience in any consecutive 2-year period?", "q_th": "บุคลากรออกใบรับรองและสนับสนุนต้องมีประสบการณ์ซ่อมบำรุงจริงเท่าใดในทุกช่วง 2 ปีต่อเนื่อง?", "choices_en": ["1 month", "At least 6 months", "2 years continuously", "No experience requirement, only training"], "choices_th": ["1 เดือน", "อย่างน้อย 6 เดือน", "2 ปีต่อเนื่อง", "ไม่มีข้อกำหนดประสบการณ์ ต้องการเพียงฝึกอบรม"], "a": 1}, {"q_en": "If a 145 organisation is unable to complete all ordered maintenance, under 145.A.50(e) it may:", "q_th": "หากองค์กร 145 ไม่สามารถทำงานซ่อมบำรุงที่สั่งให้เสร็จสมบูรณ์ ตาม 145.A.50(e) สามารถทำอย่างไร?", "choices_en": ["Never issue a CRS", "Issue a CRS within the approved aircraft limitations (MEL-HIL)", "Ground the aircraft permanently", "Ask the pilot to complete the work"], "choices_th": ["ห้ามออก CRS เด็ดขาด", "ออก CRS ภายในขีดจำกัดอากาศยานที่ได้รับอนุมัติ (MEL-HIL)", "จอดอากาศยานถาวร", "ขอให้นักบินทำงานให้เสร็จ"], "a": 1}, {"q_en": "Under 145.A.42, unsalvageable components must be:", "q_th": "ตาม 145.A.42 ชิ้นส่วนที่กู้คืนไม่ได้ต้องปฏิบัติอย่างไร?", "choices_en": ["Sold to another operator immediately", "Segregated from serviceable stock and not permitted to re-enter the supply system unless a repair/life-extension solution exists", "Kept mixed with serviceable stock for convenience", "Returned to the pilot"], "choices_th": ["ขายให้ผู้ประกอบการอื่นทันที", "แยกออกจากสต็อกที่ใช้งานได้ และห้ามกลับเข้าสู่ระบบจัดหาอีก เว้นแต่มีทางแก้ไข/ขยายอายุ", "เก็บปนกับสต็อกที่ใช้งานได้เพื่อความสะดวก", "คืนให้นักบิน"], "a": 1}, {"q_en": "What is EASA Form 1 primarily used for?", "q_th": "EASA Form 1 ใช้เพื่ออะไรเป็นหลัก?", "choices_en": ["Pilot licence application", "Official certification that a component is airworthy/installable and traceable, issued by approved 21.G or 145 organisations", "Noise certification", "Airworthiness Review Certificate"], "choices_th": ["ยื่นขอใบอนุญาตนักบิน", "ใบรับรองทางการว่าชิ้นส่วนสมควรเดินอากาศ/ติดตั้งได้และตรวจสอบย้อนกลับได้ ออกโดยองค์กร 21.G หรือ 145 ที่ได้รับอนุมัติ", "ใบรับรองเสียง", "ใบรับรองการตรวจสอบความสมควรเดินอากาศ"], "a": 1}, {"q_en": "Within what timeframe must a 145 organisation report an occurrence under 145.A.60?", "q_th": "องค์กร 145 ต้องรายงานเหตุการณ์ตาม 145.A.60 ภายในเวลาใด?", "choices_en": ["24 hours", "72 hours of discovery", "1 week", "1 month"], "choices_th": ["24 ชั่วโมง", "72 ชั่วโมงหลังพบ", "1 สัปดาห์", "1 เดือน"], "a": 1}, {"q_en": "How long must a 145 organisation retain detailed maintenance records including certificates of release to service?", "q_th": "องค์กร 145 ต้องเก็บบันทึกซ่อมบำรุงโดยละเอียดรวมถึง CRS นานเท่าใด?", "choices_en": ["1 year", "3 years from the date of CRS issue", "5 years always", "No retention required"], "choices_th": ["1 ปี", "3 ปีนับจากวันที่ออก CRS", "5 ปีเสมอ", "ไม่ต้องเก็บ"], "a": 1}, {"q_en": "Who must the MOE (Maintenance Organisation Exposition) always provide an up-to-date description of?", "q_th": "MOE ต้องให้คำอธิบายที่เป็นปัจจุบันเกี่ยวกับอะไรเสมอ?", "choices_en": ["The operation of the organisation, including facilities, personnel, and work scope", "The stock market", "Other airlines' pricing", "Passenger complaints only"], "choices_th": ["การดำเนินงานขององค์กร รวมถึงสิ่งอำนวยความสะดวก บุคลากร และขอบเขตงาน", "ตลาดหุ้น", "ราคาของสายการบินอื่น", "ข้อร้องเรียนของผู้โดยสารเท่านั้น"], "a": 0}, {"q_en": "NDT (non-destructive testing) personnel competency in a 145 organisation must comply with which type of standard?", "q_th": "ความสามารถของบุคลากร NDT ในองค์กร 145 ต้องเป็นไปตามมาตรฐานประเภทใด?", "choices_en": ["A recognised standard such as EN 4179 or equivalent", "No standard required", "ISO 9001 only", "IATA standards only"], "choices_th": ["มาตรฐานที่ยอมรับ เช่น EN 4179 หรือเทียบเท่า", "ไม่ต้องมีมาตรฐาน", "ISO 9001 เท่านั้น", "มาตรฐาน IATA เท่านั้น"], "a": 0}, {"q_en": "Under 145.A.90, an approval's continued validity depends on which of the following?", "q_th": "ตาม 145.A.90 ความถูกต้องต่อเนื่องของการอนุมัติขึ้นอยู่กับข้อใด?", "choices_en": ["Compliance with Part-145, authority access, and non-surrender/non-revocation of the certificate", "Only the size of the organisation", "Only annual revenue", "The nationality of the accountable manager"], "choices_th": ["การปฏิบัติตาม Part-145 การเข้าถึงของหน่วยงาน และการไม่ยกเลิก/เพิกถอนใบรับรอง", "ขนาดขององค์กรเท่านั้น", "รายได้ประจำปีเท่านั้น", "สัญชาติของผู้จัดการที่รับผิดชอบ"], "a": 0}, {"q_en": "For a temporary AOG situation away from the main line station, a component may be fitted without the appropriate release certificate for a maximum of:", "q_th": "ในสถานการณ์ AOG ชั่วคราวที่ไม่ใช่สถานีหลัก อาจติดตั้งชิ้นส่วนโดยไม่มีใบปล่อยที่เหมาะสมได้สูงสุดเท่าใด?", "choices_en": ["10 flight hours", "30 flight hours or until the aircraft returns to its main base", "100 flight hours", "There is no limit"], "choices_th": ["10 ชั่วโมงบิน", "30 ชั่วโมงบิน หรือจนกว่าอากาศยานจะกลับถึงฐานหลัก", "100 ชั่วโมงบิน", "ไม่มีขีดจำกัด"], "a": 1}]}, {"id": 9, "title_en": "Part 66 – Certifying Staff", "title_th": "Part 66 – บุคลากรออกใบรับรอง", "pages": "236–274", "diagram": "<svg viewBox=\"0 0 740 230\" xmlns=\"http://www.w3.org/2000/svg\">\n<text x=\"370\" y=\"18\" text-anchor=\"middle\" fill=\"var(--amber)\" font-size=\"13\" font-weight=\"600\" font-family=\"Chakra Petch, Sarabun, sans-serif\">Part-66 licence categories — scope comparison</text>\n<text x=\"370\" y=\"32\" text-anchor=\"middle\" fill=\"var(--dim)\" font-size=\"10\">เปรียบเทียบขอบเขตประเภทใบอนุญาต Part-66</text>\n<g font-family=\"IBM Plex Mono, monospace\" font-size=\"8.5\">\n<rect x=\"20\" y=\"150\" width=\"100\" height=\"45\" fill=\"var(--panel)\" stroke=\"var(--cyan)\"/><text x=\"70\" y=\"145\" text-anchor=\"middle\" fill=\"var(--cyan)\" font-size=\"14\" font-weight=\"700\">A</text><text x=\"70\" y=\"167\" text-anchor=\"middle\" fill=\"var(--text)\">Line, simple</text><text x=\"70\" y=\"179\" text-anchor=\"middle\" fill=\"var(--text)\">defects only</text><text x=\"70\" y=\"191\" text-anchor=\"middle\" fill=\"var(--dim)\">no type rating</text>\n<rect x=\"140\" y=\"105\" width=\"100\" height=\"90\" fill=\"var(--amber-bg)\" stroke=\"var(--amber)\"/><text x=\"190\" y=\"100\" text-anchor=\"middle\" fill=\"var(--amber)\" font-size=\"14\" font-weight=\"700\">B1</text><text x=\"190\" y=\"122\" text-anchor=\"middle\" fill=\"var(--text)\">Line: mech.</text><text x=\"190\" y=\"134\" text-anchor=\"middle\" fill=\"var(--text)\">+elec.+simple</text><text x=\"190\" y=\"146\" text-anchor=\"middle\" fill=\"var(--text)\">avionics test</text><text x=\"190\" y=\"164\" text-anchor=\"middle\" fill=\"var(--green)\">includes A ✓</text>\n<rect x=\"260\" y=\"115\" width=\"100\" height=\"80\" fill=\"var(--panel)\" stroke=\"var(--cyan)\"/><text x=\"310\" y=\"110\" text-anchor=\"middle\" fill=\"var(--cyan)\" font-size=\"14\" font-weight=\"700\">B2</text><text x=\"310\" y=\"132\" text-anchor=\"middle\" fill=\"var(--text)\">Line: avionics</text><text x=\"310\" y=\"144\" text-anchor=\"middle\" fill=\"var(--text)\">+ electrical</text><text x=\"310\" y=\"164\" text-anchor=\"middle\" fill=\"var(--red)\">A not incl. ✗</text>\n<rect x=\"380\" y=\"130\" width=\"100\" height=\"65\" fill=\"var(--panel)\" stroke=\"var(--cyan)\"/><text x=\"430\" y=\"125\" text-anchor=\"middle\" fill=\"var(--cyan)\" font-size=\"14\" font-weight=\"700\">B3</text><text x=\"430\" y=\"147\" text-anchor=\"middle\" fill=\"var(--text)\">Line: light A/C</text><text x=\"430\" y=\"159\" text-anchor=\"middle\" fill=\"var(--text)\">≤2000 kg</text><text x=\"430\" y=\"178\" text-anchor=\"middle\" fill=\"var(--green)\">includes A ✓</text>\n<rect x=\"500\" y=\"85\" width=\"100\" height=\"110\" fill=\"var(--amber-bg)\" stroke=\"var(--amber)\"/><text x=\"550\" y=\"80\" text-anchor=\"middle\" fill=\"var(--amber)\" font-size=\"14\" font-weight=\"700\">C</text><text x=\"550\" y=\"102\" text-anchor=\"middle\" fill=\"var(--text)\">Base Maint.</text><text x=\"550\" y=\"114\" text-anchor=\"middle\" fill=\"var(--text)\">full aircraft</text><text x=\"550\" y=\"130\" text-anchor=\"middle\" fill=\"var(--dim)\">built on B1/B2</text><text x=\"550\" y=\"142\" text-anchor=\"middle\" fill=\"var(--dim)\">support staff</text>\n<rect x=\"620\" y=\"120\" width=\"100\" height=\"75\" fill=\"var(--panel)\" stroke=\"var(--cyan)\"/><text x=\"670\" y=\"115\" text-anchor=\"middle\" fill=\"var(--cyan)\" font-size=\"14\" font-weight=\"700\">L</text><text x=\"670\" y=\"137\" text-anchor=\"middle\" fill=\"var(--text)\">Light A/C:</text><text x=\"670\" y=\"149\" text-anchor=\"middle\" fill=\"var(--text)\">sailplane,</text><text x=\"670\" y=\"161\" text-anchor=\"middle\" fill=\"var(--text)\">balloon, airship</text>\n</g>\n<line x1=\"10\" y1=\"195\" x2=\"730\" y2=\"195\" stroke=\"var(--border)\" stroke-width=\"1\"/>\n<text x=\"370\" y=\"212\" text-anchor=\"middle\" fill=\"var(--dim)\" font-size=\"9\">Bar height = relative scope of certification privileges (illustrative) / ความสูงแท่ง = ขอบเขตสิทธิ์การออกใบรับรองโดยเปรียบเทียบ</text>\n</svg>", "sections": [{"p": "238-240", "en": "Certifying Staff qualification considers: job-related experience, theoretical knowledge, practical training, and licensing (AML = Aircraft Maintenance Licence), followed by assessment & release authorisation from the 145 org. 66.A.1 Scope: defines the AML and requirements for application, issue and continued validity. Note: component maintenance (Part-145 B&C) certifying staff qualification is 'nationally regulated' by the NAA, not under Part-66 directly.", "th": "คุณสมบัติบุคลากรออกใบรับรองพิจารณาจาก: ประสบการณ์ที่เกี่ยวข้องกับงาน ความรู้ทางทฤษฎี การฝึกอบรมภาคปฏิบัติ และการออกใบอนุญาต (AML = ใบอนุญาตซ่อมบำรุงอากาศยาน) ตามด้วยการประเมินและมอบอำนาจปล่อยงานจากองค์กร 145 66.A.1 ขอบเขต: กำหนด AML และข้อกำหนดสำหรับการยื่นคำขอ การออก และความถูกต้องต่อเนื่อง หมายเหตุ: คุณสมบัติบุคลากรออกใบรับรองซ่อมบำรุงชิ้นส่วน (Part-145 B&C) 'กำกับดูแลระดับชาติ' โดย NAA ไม่ได้อยู่ภายใต้ Part-66 โดยตรง"}, {"p": "241-242", "en": "Licence categories (66.A.3): A = Line Maintenance Certifying Mechanic; B1 = Maintenance Certifying Technician (Mechanical); B2 = Maintenance Certifying Technician (Avionic); B3 = Maintenance Certifying Technician (Mechanical, light aircraft); C = Base Maintenance Certifying Engineer. 66.A.5 classifies aircraft into groups for rating purposes.", "th": "ประเภทใบอนุญาต (66.A.3): A = ช่างออกใบรับรองซ่อมบำรุงระดับลาน; B1 = ช่างเทคนิคออกใบรับรองซ่อมบำรุง (เครื่องกล); B2 = ช่างเทคนิคออกใบรับรองซ่อมบำรุง (อิเล็กทรอนิกส์การบิน); B3 = ช่างเทคนิคออกใบรับรองซ่อมบำรุง (เครื่องกล อากาศยานเบา); C = วิศวกรออกใบรับรองซ่อมบำรุงระดับฐาน 66.A.5 แบ่งกลุ่มอากาศยานเพื่อวัตถุประสงค์การรับรองแบบ"}, {"p": "243-244", "en": "66.A.10 Application: initial application to the competent authority of a Member State via EASA Form 19, with evidence of compliance. 66.A.15 Eligibility: minimum age 18 for the AML itself (note: 21 is required separately to be authorised as certifying/support staff within a 145 organisation per 145.A.35(m)).", "th": "66.A.10 การยื่นคำขอ: ยื่นคำขอครั้งแรกต่อหน่วยงานที่มีอำนาจของรัฐสมาชิกผ่าน EASA Form 19 พร้อมหลักฐานการปฏิบัติตาม 66.A.15 คุณสมบัติ: อายุขั้นต่ำ 18 ปีสำหรับตัว AML เอง (หมายเหตุ: ต้องการอายุ 21 ปีแยกต่างหากเพื่อได้รับอนุญาตเป็นบุคลากรออกใบรับรอง/สนับสนุนภายในองค์กร 145 ตาม 145.A.35(m))"}, {"p": "245-252", "en": "66.A.20 Privileges by category — CAT A: issue CRS for minor scheduled line maintenance/simple defect rectification on personally-performed tasks only, no type rating. CAT B1: CRS + B1 support staff for aircraft structure/powerplant/mechanical/electrical systems + simple avionics tests (automatically includes matching A subcategory). CAT B2: CRS + B2 support staff for avionic/electrical systems + simple electrical/avionics tests within powerplant/mechanical (does NOT include A subcategory). CAT B2L: similar to B2 but for specific system ratings endorsed on the licence (does not include A). CAT B3: like B1 but limited to piston-engine, non-pressurised aeroplanes ≤2000kg MTOM. CAT C: CRS after Base Maintenance (complete aircraft), based on physical work by B1/B2 support staff. CAT L: CRS for aircraft structure/powerplant/mechanical/electrical + radio/ELT/transponder + simple avionics tests; subcategories L1/L1C (sailplanes), L2/L2C (powered sailplanes/ELA1), L3H/L3G (balloons), L4H/L4G (airships), L5 (airship with type rating).", "th": "66.A.20 สิทธิ์ตามประเภทใบอนุญาต — CAT A: ออก CRS สำหรับงานซ่อมบำรุงระดับลานตามกำหนดเล็กน้อย/แก้ไขข้อบกพร่องง่ายเฉพาะงานที่ทำเองเท่านั้น ไม่มีการรับรองแบบ CAT B1: CRS + บุคลากรสนับสนุน B1 สำหรับโครงสร้างอากาศยาน/เครื่องยนต์/ระบบเครื่องกล/ไฟฟ้า + ทดสอบอิเล็กทรอนิกส์การบินง่าย ๆ (รวมหมวดย่อย A โดยอัตโนมัติ) CAT B2: CRS + บุคลากรสนับสนุน B2 สำหรับระบบอิเล็กทรอนิกส์การบิน/ไฟฟ้า + ทดสอบไฟฟ้า/อิเล็กทรอนิกส์การบินง่าย ๆ ภายในเครื่องยนต์/เครื่องกล (ไม่รวมหมวดย่อย A) CAT B2L: คล้าย B2 แต่จำกัดตามการรับรองระบบเฉพาะบนใบอนุญาต (ไม่รวม A) CAT B3: เหมือน B1 แต่จำกัดเฉพาะเครื่องยนต์ลูกสูบ อากาศยานไม่ปรับความดัน ≤2000กก. MTOM CAT C: CRS หลังการซ่อมบำรุงระดับฐาน (อากาศยานทั้งลำ) จากงานจริงของบุคลากรสนับสนุน B1/B2 CAT L: CRS สำหรับโครงสร้างอากาศยาน/เครื่องยนต์/เครื่องกล/ไฟฟ้า + วิทยุ/ELT/transponder + ทดสอบอิเล็กทรอนิกส์การบินง่าย ๆ; หมวดย่อย L1/L1C (เครื่องร่อน) L2/L2C (เครื่องร่อนขับเคลื่อน/ELA1) L3H/L3G (บอลลูน) L4H/L4G (เรือเหาะ) L5 (เรือเหาะพร้อมการรับรองแบบ)"}, {"p": "253", "en": "General privilege conditions: AML holder may only exercise privileges if they hold a certifying authorisation per Part-M/F, CAO or Part-145; have had 6 months' maintenance experience in the preceding 2 years matching the AML privileges; have adequate competence for the aircraft type; and can read/write/communicate in the language of the relevant technical documentation/procedures.", "th": "เงื่อนไขทั่วไปในการใช้สิทธิ์: ผู้ถือ AML ใช้สิทธิ์ได้ก็ต่อเมื่อมีการอนุญาตออกใบรับรองตาม Part-M/F, CAO หรือ Part-145; มีประสบการณ์ซ่อมบำรุง 6 เดือนในช่วง 2 ปีที่ผ่านมาซึ่งตรงกับสิทธิ์ AML; มีความสามารถเพียงพอสำหรับประเภทอากาศยาน; และสามารถอ่าน/เขียน/สื่อสารในภาษาของเอกสารทางเทคนิค/ขั้นตอนที่เกี่ยวข้อง"}, {"p": "254-261", "en": "66.A.25 Basic knowledge: divided into modules, proven via theory exam (Part-147 org or authority), pass mark ≥75%, courses/exams valid within 10 years prior to application. 66.A.30 Basic experience: CAT A / B1.2 / B1.4 / B3 = 3 years practical (no prior training), 2 years + relevant skilled-worker training, or 1 year + approved Part-147 basic course (Cat B1/B2 = 2000hrs, Cat A = 800hrs). CAT B2 / B1.1 / B1.3 = 5 years, 3 years + training, or 2 years + approved course (2400hrs). CAT C = 3–5 years exercising B1/B2 privileges (or 3 years + technical degree, incl. 6 months base-maintenance observation). CAT L = 2 years practical, representative cross-section. License extension needs experience per Appendix IV; at least 1 year recent (or 3 months for additions) within the corresponding category, acquired within the preceding 10 years.", "th": "66.A.25 ความรู้พื้นฐาน: แบ่งเป็นโมดูล พิสูจน์ด้วยข้อสอบทฤษฎี (องค์กร Part-147 หรือหน่วยงาน) เกณฑ์ผ่าน ≥75% หลักสูตร/ข้อสอบต้องอยู่ในช่วง 10 ปีก่อนยื่นคำขอ 66.A.30 ประสบการณ์พื้นฐาน: CAT A / B1.2 / B1.4 / B3 = ประสบการณ์จริง 3 ปี (ไม่มีการฝึกอบรมมาก่อน) 2 ปี + ฝึกอบรมช่างฝีมือที่เกี่ยวข้อง หรือ 1 ปี + หลักสูตรพื้นฐาน Part-147 ที่ได้รับอนุมัติ (Cat B1/B2 = 2000 ชม. Cat A = 800 ชม.) CAT B2 / B1.1 / B1.3 = 5 ปี, 3 ปี + ฝึกอบรม หรือ 2 ปี + หลักสูตรที่ได้รับอนุมัติ (2400 ชม.) CAT C = 3–5 ปีใช้สิทธิ์ B1/B2 (หรือ 3 ปี + ปริญญาทางเทคนิค รวมสังเกตการณ์ซ่อมบำรุงระดับฐาน 6 เดือน) CAT L = ประสบการณ์จริง 2 ปี ครอบคลุมหลากหลาย การขยายใบอนุญาตต้องมีประสบการณ์ตาม Appendix IV; อย่างน้อย 1 ปีล่าสุด (หรือ 3 เดือนสำหรับการเพิ่มเติม) ในประเภทที่สอดคล้องกัน ได้รับภายใน 10 ปีที่ผ่านมา"}, {"p": "262-269", "en": "66.A.40 Continued validity: AML expires 5 years after last issue/renewal unless submitted to the authority for verification (Form 19, may be via a Part-145 org); CRS rights lapse if the AML becomes invalid; AML valid only when issued/amended by the authority and signed by the holder. 66.A.45 Endorsement with aircraft ratings: requires satisfactory type training (+ On-the-Job Training for the first type, within 3 years of application); Group 2/3 aircraft have sub-group/full-group rating rules requiring multiple type experiences; unendorsed Group 3 ratings may carry structural-type limitations (pressurised, metal, composite, wood, tube-and-fabric) until experience is demonstrated. 66.A.50 Limitations exclude certain certification privileges; removed upon demonstrated experience or a satisfactory authority assessment (or exam for conversion-related limitations). 66.A.55 Evidence: certifying/support staff must produce their licence within 24 hours of request.", "th": "66.A.40 ความถูกต้องต่อเนื่อง: AML หมดอายุ 5 ปีหลังออก/ต่ออายุครั้งล่าสุด เว้นแต่ยื่นต่อหน่วยงานเพื่อตรวจสอบ (Form 19 อาจผ่านองค์กร Part-145 ได้); สิทธิ์ CRS หมดไปหาก AML เป็นโมฆะ; AML ใช้ได้เฉพาะเมื่อออก/แก้ไขโดยหน่วยงานและลงนามโดยผู้ถือ 66.A.45 การรับรองแบบอากาศยาน: ต้องผ่านการฝึกอบรมแบบที่น่าพอใจ (+ OJT สำหรับแบบแรก ภายใน 3 ปีจากวันยื่นคำขอ); อากาศยานกลุ่ม 2/3 มีกฎการรับรองกลุ่มย่อย/กลุ่มเต็มที่ต้องมีประสบการณ์หลายแบบ; การรับรองกลุ่ม 3 ที่ไม่ได้รับการรับรองอาจมีข้อจำกัดโครงสร้าง (ปรับความดัน โลหะ คอมโพสิต ไม้ ท่อผ้าใบ) จนกว่าจะแสดงประสบการณ์ 66.A.50 ข้อจำกัดกีดกันสิทธิ์การออกใบรับรองบางอย่าง; ยกเลิกเมื่อแสดงประสบการณ์หรือผ่านการประเมินของหน่วยงาน (หรือสอบสำหรับข้อจำกัดจากการแปลงใบอนุญาต) 66.A.55 หลักฐาน: บุคลากรออกใบรับรอง/สนับสนุนต้องแสดงใบอนุญาตภายใน 24 ชั่วโมงเมื่อถูกร้องขอ"}, {"p": "271-274", "en": "66.A.70 Conversion provisions: pre-existing national certifying-staff qualifications are converted to an AML without further examination, subject to Section B Subpart D conditions; limitations may be added to reflect differences with Part-66's basic-knowledge/examination standards. 66.B.500: the authority shall suspend/limit/revoke an AML for safety issues or evidence of falsified documents, failure to carry out/report required maintenance, negligent maintenance, falsified records, issuing a CRS knowing work wasn't done or without verification, working under alcohol/drugs, or issuing a CRS while non-compliant with Part-M/145/66. Component certifying staff (145 'C' organisations) are trained/qualified/authorised per national requirements to issue Form 1 for components like generators, landing gear, brakes.", "th": "66.A.70 บทบัญญัติการแปลงใบอนุญาต: คุณสมบัติบุคลากรออกใบรับรองระดับชาติเดิมถูกแปลงเป็น AML โดยไม่ต้องสอบเพิ่มเติม ภายใต้เงื่อนไข Section B Subpart D; อาจเพิ่มข้อจำกัดเพื่อสะท้อนความแตกต่างกับมาตรฐานความรู้พื้นฐาน/การสอบของ Part-66 66.B.500: หน่วยงานจะระงับ/จำกัด/เพิกถอน AML สำหรับปัญหาความปลอดภัยหรือหลักฐานการปลอมแปลงเอกสาร ไม่ทำ/รายงานการซ่อมบำรุงที่จำเป็น ซ่อมบำรุงโดยประมาท ปลอมแปลงบันทึก ออก CRS ทั้งที่รู้ว่างานยังไม่เสร็จหรือไม่ได้ตรวจสอบ ทำงานภายใต้ฤทธิ์แอลกอฮอล์/ยา หรือออก CRS ขณะไม่ปฏิบัติตาม Part-M/145/66 บุคลากรออกใบรับรองชิ้นส่วน (องค์กร 145 'C') ได้รับการฝึกอบรม/รับรอง/อนุญาตตามข้อกำหนดระดับชาติเพื่อออก Form 1 สำหรับชิ้นส่วน เช่น เครื่องกำเนิดไฟฟ้า ล้อลงจอด เบรก"}], "quiz": [{"q_en": "Which AML category permits the holder to issue a CRS after Base Maintenance of a complete aircraft?", "q_th": "ใบอนุญาต AML ประเภทใดอนุญาตให้ผู้ถือออก CRS หลังการซ่อมบำรุงระดับฐานของอากาศยานทั้งลำ?", "choices_en": ["CAT A", "CAT B2", "CAT C", "CAT L"], "choices_th": ["CAT A", "CAT B2", "CAT C", "CAT L"], "a": 2}, {"q_en": "Does a Category B1 AML automatically include Category A sub-category privileges?", "q_th": "ใบอนุญาต Category B1 รวมสิทธิ์ของหมวดย่อย Category A โดยอัตโนมัติหรือไม่?", "choices_en": ["Yes, automatically", "No, B2 and B1 never include A", "No category ever includes another", "Only B3 includes A"], "choices_th": ["ใช่ รวมโดยอัตโนมัติ", "ไม่ B2 และ B1 ไม่เคยรวม A", "ไม่มีหมวดใดรวมหมวดอื่นเลย", "B3 เท่านั้นที่รวม A"], "a": 0}, {"q_en": "Does a Category B2 AML include Category A sub-category privileges?", "q_th": "ใบอนุญาต Category B2 รวมสิทธิ์ของหมวดย่อย Category A หรือไม่?", "choices_en": ["Yes, always", "No — B2 does NOT include the A subcategory", "Only for helicopters", "Only after 10 years"], "choices_th": ["ใช่ เสมอ", "ไม่ — B2 ไม่รวมหมวดย่อย A", "เฉพาะเฮลิคอปเตอร์เท่านั้น", "หลังจาก 10 ปีเท่านั้น"], "a": 1}, {"q_en": "What is the minimum age to apply for an aircraft maintenance licence (AML) under 66.A.15?", "q_th": "อายุขั้นต่ำในการยื่นขอใบอนุญาต AML ตาม 66.A.15 คือเท่าใด?", "choices_en": ["16 years", "18 years", "21 years", "25 years"], "choices_th": ["16 ปี", "18 ปี", "21 ปี", "25 ปี"], "a": 1}, {"q_en": "What is the pass mark for Part-66 basic knowledge theory examinations?", "q_th": "เกณฑ์ผ่านสำหรับข้อสอบทฤษฎีความรู้พื้นฐาน Part-66 คือเท่าใด?", "choices_en": ["50%", "65%", "75%", "90%"], "choices_th": ["50%", "65%", "75%", "90%"], "a": 2}, {"q_en": "An AML expires how many years after its last issue or renewal, unless submitted for verification?", "q_th": "AML หมดอายุกี่ปีหลังการออกหรือต่ออายุครั้งล่าสุด เว้นแต่ยื่นเพื่อตรวจสอบ?", "choices_en": ["2 years", "5 years", "10 years", "It never expires"], "choices_th": ["2 ปี", "5 ปี", "10 ปี", "ไม่หมดอายุเลย"], "a": 1}, {"q_en": "CAT B3 is applicable to which type of aircraft?", "q_th": "CAT B3 ใช้กับอากาศยานประเภทใด?", "choices_en": ["All large complex aircraft", "Piston-engine, non-pressurised aeroplanes of 2000 kg MTOM and below", "Only helicopters", "Only jet-engine aircraft"], "choices_th": ["อากาศยานซับซ้อนขนาดใหญ่ทั้งหมด", "เครื่องบินเครื่องยนต์ลูกสูบไม่ปรับความดัน MTOM 2000 กก. ลงมา", "เฮลิคอปเตอร์เท่านั้น", "อากาศยานเครื่องยนต์เจ็ตเท่านั้น"], "a": 1}, {"q_en": "How many years of practical maintenance experience does Category A / B1.2 / B1.4 / B3 require with NO prior relevant technical training?", "q_th": "Category A / B1.2 / B1.4 / B3 ต้องการประสบการณ์ซ่อมบำรุงจริงกี่ปี หากไม่มีการฝึกอบรมทางเทคนิคมาก่อน?", "choices_en": ["1 year", "2 years", "3 years", "5 years"], "choices_th": ["1 ปี", "2 ปี", "3 ปี", "5 ปี"], "a": 2}, {"q_en": "Within how many hours must certifying/support staff produce their licence upon request by an authorised person?", "q_th": "บุคลากรออกใบรับรอง/สนับสนุนต้องแสดงใบอนุญาตภายในกี่ชั่วโมงเมื่อถูกร้องขอโดยผู้มีอำนาจ?", "choices_en": ["1 hour", "24 hours", "72 hours", "7 days"], "choices_th": ["1 ชั่วโมง", "24 ชั่วโมง", "72 ชั่วโมง", "7 วัน"], "a": 1}, {"q_en": "Which of the following is grounds for the authority to suspend, limit or revoke an AML under 66.B.500?", "q_th": "ข้อใดเป็นเหตุให้หน่วยงานระงับ จำกัด หรือเพิกถอน AML ตาม 66.B.500?", "choices_en": ["Taking annual leave", "Issuing a CRS knowing the specified maintenance was not carried out", "Requesting additional training", "Working part-time"], "choices_th": ["การลาพักร้อนประจำปี", "การออก CRS ทั้งที่รู้ว่าการซ่อมบำรุงที่ระบุไว้ยังไม่ได้ดำเนินการ", "การขอฝึกอบรมเพิ่มเติม", "การทำงานนอกเวลา"], "a": 1}, {"q_en": "An applicant holding a Category B1.2 or B3 AML is deemed to meet the basic experience requirements for which category?", "q_th": "ผู้ถือ AML Category B1.2 หรือ B3 ถือว่าผ่านข้อกำหนดประสบการณ์พื้นฐานสำหรับหมวดใด?", "choices_en": ["Category C only", "Subcategories L1C, L1, L2C and L2", "Category B2 automatically", "No other category"], "choices_th": ["Category C เท่านั้น", "หมวดย่อย L1C, L1, L2C และ L2", "Category B2 โดยอัตโนมัติ", "ไม่มีหมวดอื่นใด"], "a": 1}, {"q_en": "How long is the basic-knowledge training course/examination valid prior to an application for the AML?", "q_th": "หลักสูตรฝึกอบรม/ข้อสอบความรู้พื้นฐานมีอายุใช้ได้นานเท่าใดก่อนยื่นคำขอ AML?", "choices_en": ["1 year", "5 years", "10 years", "No time limit"], "choices_th": ["1 ปี", "5 ปี", "10 ปี", "ไม่มีขีดจำกัดเวลา"], "a": 2}]}, {"id": 10, "title_en": "Independent Certifying Staff (ICS)", "title_th": "บุคลากรออกใบรับรองอิสระ (ICS)", "pages": "275–278", "sections": [{"p": "276", "en": "In non-commercial maintenance, independent technicians/inspectors (ICS) may act on their own behalf, holding a valid Part-66 licence (or national qualification if Part-66 doesn't apply). Approval requires a satisfactory airworthiness review under NAA supervision; scope is limited by Part-ML and the licence's aircraft scope. ICS covers light aircraft, gliders, balloons — and does NOT work on behalf of an approved maintenance organisation.", "th": "ในการซ่อมบำรุงที่ไม่ใช่เชิงพาณิชย์ ช่างเทคนิค/ผู้ตรวจสอบอิสระ (ICS) อาจปฏิบัติงานในนามตนเอง โดยถือใบอนุญาต Part-66 ที่ถูกต้อง (หรือคุณสมบัติระดับชาติหาก Part-66 ไม่บังคับใช้) การอนุมัติต้องผ่านการตรวจสอบความสมควรเดินอากาศที่น่าพอใจภายใต้การควบคุมดูแลของ NAA ขอบเขตจำกัดโดย Part-ML และขอบเขตอากาศยานบนใบอนุญาต ICS ครอบคลุมอากาศยานเบา เครื่องร่อน บอลลูน — และไม่ทำงานในนามองค์กรซ่อมบำรุงที่ได้รับอนุมัติ"}, {"p": "277-278", "en": "ICS may: perform maintenance per Part-ML (ML.A.201/ML.A.502) and CS-STAN; carry out airworthiness reviews & issue ARC (Form 15c, ML.A.903) for aircraft ≤2730kg MTOM, rotorcraft ≤1200kg (≤4 occupants), and other ELA2 (gliders/balloons); review the maintenance programme; issue CRS under ML.A.801. CS-STAN (EASA certification specifications) covers acceptable methods for standard modifications/repairs — but NOT for integrated avionics/communication/navigation/surveillance systems.", "th": "ICS สามารถ: ทำการซ่อมบำรุงตาม Part-ML (ML.A.201/ML.A.502) และ CS-STAN; ทำการตรวจสอบความสมควรเดินอากาศและออก ARC (Form 15c, ML.A.903) สำหรับอากาศยาน ≤2730กก. MTOM เฮลิคอปเตอร์ ≤1200กก. (≤4 ที่นั่ง) และ ELA2 อื่น ๆ (เครื่องร่อน/บอลลูน); ทบทวนโปรแกรมซ่อมบำรุง; ออก CRS ตาม ML.A.801 CS-STAN (ข้อกำหนดการรับรองของ EASA) ครอบคลุมวิธีที่ยอมรับได้สำหรับการดัดแปลง/ซ่อมมาตรฐาน — แต่ไม่รวมระบบอิเล็กทรอนิกส์การบิน/สื่อสาร/นำทาง/เฝ้าระวังแบบบูรณาการ"}], "quiz": [{"q_en": "What is the maximum MTOM of a fixed-wing aircraft for which an Independent Certifying Staff (ICS) may issue an ARC?", "q_th": "MTOM สูงสุดของอากาศยานปีกตรึงที่ ICS สามารถออก ARC ได้คือเท่าใด?", "choices_en": ["1200 kg", "2730 kg", "5700 kg", "No limit"], "choices_th": ["1200 กก.", "2730 กก.", "5700 กก.", "ไม่มีขีดจำกัด"], "a": 1}, {"q_en": "An Independent Certifying Staff (ICS) works:", "q_th": "บุคลากรออกใบรับรองอิสระ (ICS) ทำงานอย่างไร?", "choices_en": ["Always on behalf of a Part-145 organisation", "On their own behalf, not for an approved maintenance organisation", "Only for the manufacturer", "Only for EASA directly"], "choices_th": ["ในนามองค์กร Part-145 เสมอ", "ในนามตนเอง ไม่ใช่ในนามองค์กรซ่อมบำรุงที่ได้รับอนุมัติ", "ให้ผู้ผลิตเท่านั้น", "ให้ EASA โดยตรงเท่านั้น"], "a": 1}, {"q_en": "What does CS-STAN NOT cover?", "q_th": "CS-STAN ไม่ครอบคลุมอะไร?", "choices_en": ["Standard structural repairs", "Standard modifications", "Installation/replacement of integrated avionics, communication, navigation or surveillance systems", "Nothing, it covers everything"], "choices_th": ["การซ่อมโครงสร้างมาตรฐาน", "การดัดแปลงมาตรฐาน", "การติดตั้ง/เปลี่ยนระบบอิเล็กทรอนิกส์การบิน สื่อสาร นำทาง หรือเฝ้าระวังแบบบูรณาการ", "ไม่มี ครอบคลุมทุกอย่าง"], "a": 2}]}, {"id": 11, "title_en": "Oversight Principles in Continuing Airworthiness", "title_th": "หลักการกำกับดูแลความสมควรเดินอากาศต่อเนื่อง", "pages": "279–285", "sections": [{"p": "280-281", "en": "National Aviation Authorities (NAA) implement EU law/EASA regulations on behalf of EASA: approve/supervise maintenance, production, training and CAW organisations; review/approve maintenance programmes; issue ADs; approve/supervise certifying staff; participate in legislative development; supervise airlines; certify aircraft; manage national databases (aircraft register, licences); issue permits to fly; conduct spot checks. NAA-specific CAW tasks: supervise individual aircraft CAW & issue ARCs; approve maintenance programmes; supervise CAMOs, CAOs, Part-145 orgs, and subcontracted activities. Each organisation must be audited annually within an audit programme (risk/performance-based); supervisory planning cycle must not exceed 24 months.", "th": "หน่วยงานการบินแห่งชาติ (NAA) นำกฎหมาย EU/EASA ไปปฏิบัติในนาม EASA: อนุมัติ/กำกับดูแลองค์กรซ่อมบำรุง ผลิต ฝึกอบรม และความสมควรเดินอากาศต่อเนื่อง; ทบทวน/อนุมัติโปรแกรมซ่อมบำรุง; ออก AD; อนุมัติ/กำกับดูแลบุคลากรออกใบรับรอง; มีส่วนร่วมในการพัฒนากฎหมาย; กำกับดูแลสายการบิน; รับรองอากาศยาน; จัดการฐานข้อมูลระดับชาติ (ทะเบียนอากาศยาน ใบอนุญาต); ออกใบอนุญาตบิน; สุ่มตรวจ งานเฉพาะด้าน CAW ของ NAA: กำกับดูแลความสมควรเดินอากาศต่อเนื่องของอากาศยานแต่ละลำและออก ARC; อนุมัติโปรแกรมซ่อมบำรุง; กำกับดูแล CAMO, CAO, องค์กร Part-145 และกิจกรรมที่รับช่วงต่อ แต่ละองค์กรต้องได้รับการตรวจสอบทุกปีภายในโปรแกรมตรวจสอบ (อิงความเสี่ยง/ผลการปฏิบัติงาน); วงจรการวางแผนกำกับดูแลต้องไม่เกิน 24 เดือน"}, {"p": "282-283", "en": "Main oversight elements: granting the Certificate of Airworthiness (CofA, register entry), airworthiness reviews (ARC renewal), the ACAM programme, and licensing of pilots/certifying staff. ACAM (Aircraft Continuing Airworthiness Monitoring): random inspections (announced or unannounced) by NAA inspectors of registered aircraft — check
