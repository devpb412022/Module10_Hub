ing inspection status vs maintenance programme, maintenance records, regulatory compliance, and periodic safety assessments — in addition to the annual airworthiness review.", "th": "องค์ประกอบหลักของการกำกับดูแล: การออกใบสำคัญสมควรเดินอากาศ (CofA การจดทะเบียน) การตรวจสอบความสมควรเดินอากาศ (ต่ออายุ ARC) โปรแกรม ACAM และการออกใบอนุญาตนักบิน/บุคลากรออกใบรับรอง ACAM (การติดตามความสมควรเดินอากาศต่อเนื่องของอากาศยาน): การตรวจสอบแบบสุ่ม (แจ้งล่วงหน้าหรือไม่แจ้งล่วงหน้า) โดยผู้ตรวจสอบ NAA ต่ออากาศยานที่จดทะเบียน — ตรวจสอบสถานะการตรวจสอบเทียบกับโปรแกรมซ่อมบำรุง บันทึกซ่อมบำรุง การปฏิบัติตามกฎระเบียบ และการประเมินความปลอดภัยเป็นระยะ — เพิ่มเติมจากการตรวจสอบความสมควรเดินอากาศประจำปี"}, {"p": "284-285", "en": "Regulations (EU) 2019/1383 & (EU) 2021/1963 require CAMOs, CAOs and maintenance organisations to establish an SMS; NAAs also run their own management systems and share safety-related information with EASA (European Safety Risk Management process) when organisations report deficiencies/occurrences. Component Certifying Staff (CC/S) in a 145 'C1-22' rated organisation issue Form 1 per an NAA-approved procedure (national requirements) for components like generators, valves, landing gear, engines/APU, avionics.", "th": "Regulations (EU) 2019/1383 & (EU) 2021/1963 กำหนดให้ CAMO, CAO และองค์กรซ่อมบำรุงต้องจัดตั้ง SMS; NAA ยังใช้ระบบการจัดการของตนเองและแบ่งปันข้อมูลด้านความปลอดภัยกับ EASA (กระบวนการจัดการความเสี่ยงด้านความปลอดภัยของยุโรป) เมื่อองค์กรรายงานข้อบกพร่อง/เหตุการณ์ บุคลากรออกใบรับรองชิ้นส่วน (CC/S) ในองค์กร 145 เรตติ้ง 'C1-22' ออก Form 1 ตามขั้นตอนที่ NAA อนุมัติ (ข้อกำหนดระดับชาติ) สำหรับชิ้นส่วนเช่น เครื่องกำเนิดไฟฟ้า วาล์ว ล้อลงจอด เครื่องยนต์/APU อิเล็กทรอนิกส์การบิน"}], "quiz": [{"q_en": "What is the maximum supervisory planning cycle for a national authority's audit programme of an organisation?", "q_th": "วงจรการวางแผนกำกับดูแลสูงสุดสำหรับโปรแกรมตรวจสอบองค์กรของหน่วยงานระดับชาติคือเท่าใด?", "choices_en": ["6 months", "12 months", "24 months", "5 years"], "choices_th": ["6 เดือน", "12 เดือน", "24 เดือน", "5 ปี"], "a": 2}, {"q_en": "What does ACAM stand for and involve?", "q_th": "ACAM คืออะไรและเกี่ยวข้องกับอะไร?", "choices_en": ["A pilot training programme", "Aircraft Continuing Airworthiness Monitoring — random NAA inspections of registered aircraft", "A type of Airworthiness Directive", "An airline's internal audit only"], "choices_th": ["โปรแกรมฝึกอบรมนักบิน", "การติดตามความสมควรเดินอากาศต่อเนื่องของอากาศยาน — การตรวจสอบแบบสุ่มโดย NAA ต่ออากาศยานที่จดทะเบียน", "คำสั่งความสมควรเดินอากาศประเภทหนึ่ง", "การตรวจสอบภายในของสายการบินเท่านั้น"], "a": 1}, {"q_en": "Which regulations require CAMOs, CAOs and maintenance organisations to establish a Safety Management System (SMS)?", "q_th": "กฎระเบียบใดกำหนดให้ CAMO, CAO และองค์กรซ่อมบำรุงต้องจัดตั้ง SMS?", "choices_en": ["(EU) 2019/1383 & (EU) 2021/1963", "(EU) No 748/2012 only", "(EU) No 1178/2011 only", "ICAO Annex 6 only"], "choices_th": ["(EU) 2019/1383 & (EU) 2021/1963", "(EU) No 748/2012 เท่านั้น", "(EU) No 1178/2011 เท่านั้น", "ICAO Annex 6 เท่านั้น"], "a": 0}]}, {"id": 12, "title_en": "Maintenance & Certification Beyond Current EU Regulations", "title_th": "การซ่อมบำรุงและการรับรองนอกเหนือกฎระเบียบ EU ปัจจุบัน", "pages": "286–293", "sections": [{"p": "287-288", "en": "EASA also oversees Part-145/147/CAMO organisations based outside the EU (via BASA/MAG agreements). Aircraft outside the Basic Regulation's scope (historic aircraft, sports equipment, small aircraft, plus military/government) are monitored under nationally-supervised facilities with similar but nationally-defined requirements, often under 'L'-licensed inspectors, and the Pilot-Owner-Maintenance / independent certifying staff concept.", "th": "EASA ยังกำกับดูแลองค์กร Part-145/147/CAMO ที่ตั้งอยู่นอก EU ด้วย (ผ่านข้อตกลง BASA/MAG) อากาศยานนอกขอบเขต Basic Regulation (อากาศยานประวัติศาสตร์ อุปกรณ์กีฬา อากาศยานขนาดเล็ก รวมถึงทหาร/รัฐบาล) ได้รับการตรวจสอบภายใต้สถานประกอบการที่กำกับดูแลระดับชาติด้วยข้อกำหนดที่คล้ายกันแต่กำหนดโดยระดับชาติ มักใช้ผู้ตรวจสอบที่มีใบอนุญาต 'L' และแนวคิดการซ่อมบำรุงโดยเจ้าของ-นักบิน/บุคลากรออกใบรับรองอิสระ"}, {"p": "289", "en": "EMAR (European Military Airworthiness Requirements) harmonise military airworthiness standards across European nations, similar to civil EASA standards but tailored for military aviation, promoting interoperability. In Germany, EMAR was transposed nationally as DEMAR by the Luftfahrtamt der Bundeswehr; military technicians earn a Military Aircraft Maintenance License (MAML). Systems currently listed in German DEMAR: A400M, NH90, A321LR.", "th": "EMAR (ข้อกำหนดความสมควรเดินอากาศทางทหารของยุโรป) ประสานมาตรฐานความสมควรเดินอากาศทางทหารทั่วยุโรป คล้ายมาตรฐาน EASA พลเรือนแต่ปรับให้เหมาะกับการบินทหาร ส่งเสริมการทำงานร่วมกัน ในเยอรมนี EMAR ถูกนำไปบัญญัติเป็น DEMAR โดย Luftfahrtamt der Bundeswehr ช่างเทคนิคทหารได้รับใบอนุญาตซ่อมบำรุงอากาศยานทหาร (MAML) ระบบที่อยู่ใน DEMAR เยอรมันปัจจุบัน: A400M, NH90, A321LR"}, {"p": "290-293", "en": "Component maintenance special services: CMM (Component Maintenance Manual) from the manufacturer covers general info, handling/storage, removal/installation, disassembly/repair/assembly, inspection guidelines, testing, troubleshooting, repair methods/wear limits, parts, special tools, and SBs; national authority (e.g. LBA) defines qualification for authorised personnel (C/CS – PvL4) in component orgs. Welding: specialised materials (titanium, aluminium, special steels, etc.) require qualified welders per standards like DIN 29595 / DIN ISO 24394. Painting: industry-accepted practices per AMM/CMM; no special national/EASA permit for painting orgs, but the aircraft must be monitored by an approved Part-145 org and inspected/released after painting. NDT: standards such as DIN EN 4179 / ISO 9712 govern methods (eddy current, penetrant, magnetic particle, radiographic, ultrasonic, visual), intervals, acceptability values and personnel qualification.", "th": "บริการพิเศษการซ่อมบำรุงชิ้นส่วน: CMM (คู่มือซ่อมบำรุงชิ้นส่วน) จากผู้ผลิตครอบคลุมข้อมูลทั่วไป การจัดการ/จัดเก็บ การถอด/ติดตั้ง การแยกชิ้นส่วน/ซ่อม/ประกอบ แนวทางตรวจสอบ การทดสอบ การแก้ไขปัญหา วิธีซ่อม/ขีดจำกัดการสึกหรอ ชิ้นส่วน เครื่องมือพิเศษ และ SB; หน่วยงานระดับชาติ (เช่น LBA) กำหนดคุณสมบัติสำหรับบุคลากรที่ได้รับอนุญาต (C/CS – PvL4) ในองค์กรชิ้นส่วน การเชื่อม: วัสดุพิเศษ (ไทเทเนียม อะลูมิเนียม เหล็กกล้าพิเศษ ฯลฯ) ต้องใช้ช่างเชื่อมที่มีคุณสมบัติตามมาตรฐาน เช่น DIN 29595 / DIN ISO 24394 การพ่นสี: แนวปฏิบัติที่อุตสาหกรรมยอมรับตาม AMM/CMM; ไม่มีใบอนุญาตพิเศษระดับชาติ/EASA สำหรับองค์กรพ่นสี แต่อากาศยานต้องถูกควบคุมโดยองค์กร Part-145 ที่ได้รับอนุมัติ และตรวจสอบ/ปล่อยหลังการพ่นสี NDT: มาตรฐาน เช่น DIN EN 4179 / ISO 9712 กำกับวิธีการ (กระแสไหลวน สีย้อมแทรกซึม อนุภาคแม่เหล็ก รังสี อัลตราซาวด์ การตรวจด้วยสายตา) ช่วงเวลา ค่าที่ยอมรับได้ และคุณสมบัติบุคลากร"}], "quiz": [{"q_en": "What does EMAR stand for and cover?", "q_th": "EMAR คืออะไรและครอบคลุมอะไร?", "choices_en": ["European Military Airworthiness Requirements — harmonised military airworthiness standards across Europe", "A civil-only EASA regulation", "An engine manufacturer's warranty programme", "A pilot licensing scheme"], "choices_th": ["ข้อกำหนดความสมควรเดินอากาศทางทหารของยุโรป — ประสานมาตรฐานความสมควรเดินอากาศทางทหารทั่วยุโรป", "กฎระเบียบ EASA สำหรับพลเรือนเท่านั้น", "โปรแกรมรับประกันของผู้ผลิตเครื่องยนต์", "ระบบออกใบอนุญาตนักบิน"], "a": 0}, {"q_en": "Which standard governs Non-Destructive Testing (NDT) personnel qualification mentioned in this chapter?", "q_th": "มาตรฐานใดกำกับคุณสมบัติบุคลากร NDT ที่กล่าวถึงในบทนี้?", "choices_en": ["DIN EN 4179 / ISO 9712", "IATA Resolution 850", "ICAO Annex 6", "Part-147 only"], "choices_th": ["DIN EN 4179 / ISO 9712", "IATA Resolution 850", "ICAO Annex 6", "Part-147 เท่านั้น"], "a": 0}, {"q_en": "For aircraft painting, what is required regarding oversight after the paint job?", "q_th": "หลังการพ่นสีอากาศยาน ต้องมีการกำกับดูแลอย่างไร?", "choices_en": ["No inspection is needed", "The aircraft must be inspected and released by an approved maintenance organisation", "Only the painter needs to sign off, no maintenance org involvement", "EASA must personally inspect every paint job"], "choices_th": ["ไม่ต้องตรวจสอบ", "อากาศยานต้องได้รับการตรวจสอบและปล่อยโดยองค์กรซ่อมบำรุงที่ได้รับอนุมัติ", "ช่างพ่นสีเซ็นรับรองเองได้ ไม่ต้องมีองค์กรซ่อมบำรุงเกี่ยวข้อง", "EASA ต้องตรวจสอบการพ่นสีทุกครั้งด้วยตนเอง"], "a": 1}]}, {"id": 13, "title_en": "Cybersecurity in Aviation Maintenance", "title_th": "ความปลอดภัยไซเบอร์ในงานซ่อมบำรุงอากาศยาน", "pages": "294–297", "sections": [{"p": "295-296", "en": "Increasingly complex electronic aircraft systems and IT infrastructure create new vulnerabilities: gateways connect avionics, passenger info/entertainment systems and technical data, exposing them to threats that could affect airworthiness via unauthorised access, disclosure, interference, alteration or destruction of electronic information/interfaces. Cybersecurity in maintenance matters for: Safety & Airworthiness (a cyberattack could corrupt/manipulate data affecting airworthiness), Reliability, Privacy (proprietary/passenger data), and Compliance (growing regulatory requirements).", "th": "ระบบอิเล็กทรอนิกส์อากาศยานและโครงสร้างพื้นฐานไอทีที่ซับซ้อนมากขึ้นสร้างช่องโหว่ใหม่: เกตเวย์เชื่อมต่ออิเล็กทรอนิกส์การบิน ระบบข้อมูล/ความบันเทิงผู้โดยสาร และข้อมูลทางเทคนิค ทำให้เสี่ยงต่อภัยคุกคามที่อาจกระทบความสมควรเดินอากาศผ่านการเข้าถึง เปิดเผย รบกวน เปลี่ยนแปลง หรือทำลายข้อมูล/อินเทอร์เฟซอิเล็กทรอนิกส์โดยไม่ได้รับอนุญาต ความปลอดภัยไซเบอร์ในงานซ่อมบำรุงสำคัญต่อ: ความปลอดภัยและความสมควรเดินอากาศ (การโจมตีไซเบอร์อาจบิดเบือน/จัดการข้อมูลที่กระทบความสมควรเดินอากาศ) ความน่าเชื่อถือ ความเป็นส่วนตัว (ข้อมูลกรรมสิทธิ์/ผู้โดยสาร) และการปฏิบัติตามกฎระเบียบ (ข้อกำหนดที่เพิ่มขึ้น)"}, {"p": "297", "en": "Regulation (EU) 2023/203 Part-IS (Information Security) requires identification, application and management of information security risks with potential aviation-safety implications, via an Information Security Management System (ISMS) based on impact analyses. Implementation requires: senior management leadership/commitment for top-down ISMS implementation; security goals aligned with business goals; information security policies; defined roles/responsibilities/resources; effective internal/external communication.", "th": "Regulation (EU) 2023/203 Part-IS (ความปลอดภัยข้อมูล) กำหนดให้ระบุ ใช้ และจัดการความเสี่ยงด้านความปลอดภัยข้อมูลที่อาจส่งผลต่อความปลอดภัยการบิน ผ่านระบบการจัดการความปลอดภัยข้อมูล (ISMS) โดยอิงจากการวิเคราะห์ผลกระทบ การนำไปปฏิบัติต้องมี: ความเป็นผู้นำ/ความมุ่งมั่นของผู้บริหารระดับสูงเพื่อการนำ ISMS ไปปฏิบัติแบบบนลงล่าง; เป้าหมายความปลอดภัยที่สอดคล้องกับเป้าหมายธุรกิจ; นโยบายความปลอดภัยข้อมูล; บทบาท/ความรับผิดชอบ/ทรัพยากรที่กำหนดชัดเจน; การสื่อสารภายใน/ภายนอกที่มีประสิทธิภาพ"}], "quiz": [{"q_en": "Which EU regulation introduces Part-IS (Information Security) requirements?", "q_th": "กฎระเบียบ EU ใดที่นำ Part-IS (ความปลอดภัยข้อมูล) มาบังคับใช้?", "choices_en": ["(EU) 2023/203", "(EU) 965/2012", "(EU) 748/2012", "(EU) 1178/2011"], "choices_th": ["(EU) 2023/203", "(EU) 965/2012", "(EU) 748/2012", "(EU) 1178/2011"], "a": 0}, {"q_en": "What does an ISMS (Information Security Management System) rely on to determine required protection levels?", "q_th": "ISMS อาศัยอะไรในการกำหนดระดับการป้องกันที่จำเป็น?", "choices_en": ["Random guessing", "Information security impact analyses", "Only the accountable manager's opinion", "Passenger surveys"], "choices_th": ["การเดาแบบสุ่ม", "การวิเคราะห์ผลกระทบด้านความปลอดภัยข้อมูล", "ความเห็นของผู้จัดการที่รับผิดชอบเท่านั้น", "แบบสำรวจผู้โดยสาร"], "a": 1}, {"q_en": "Why is cybersecurity relevant to aircraft airworthiness?", "q_th": "เหตุใดความปลอดภัยไซเบอร์จึงเกี่ยวข้องกับความสมควรเดินอากาศ?", "choices_en": ["It is unrelated to airworthiness", "A cyberattack could manipulate or corrupt data used for maintenance/operation, jeopardising airworthiness", "It only affects the entertainment system", "It only affects ground staff salaries"], "choices_th": ["ไม่เกี่ยวข้องกับความสมควรเดินอากาศเลย", "การโจมตีไซเบอร์อาจบิดเบือนหรือทำให้ข้อมูลที่ใช้ในการซ่อมบำรุง/ปฏิบัติการเสียหาย ซึ่งเป็นอันตรายต่อความสมควรเดินอากาศ", "ส่งผลกระทบเฉพาะระบบความบันเทิงเท่านั้น", "ส่งผลกระทบเฉพาะเงินเดือนพนักงานภาคพื้นเท่านั้น"], "a": 1}]}, {"id": 14, "title_en": "Abbreviations & Glossary", "title_th": "อักษรย่อและศัพท์", "pages": "298–322", "glossary": [{"abbr": "A/C, A/W", "term_en": "Aircraft; Airworthiness", "term_th": "อากาศยาน; ความสมควรเดินอากาศ", "desc_en": "A/C = a vehicle that flies within the earth's atmosphere. A/W = an aircraft is airworthy when the requirements for safe operation are met.", "desc_th": "A/C = ยานพาหนะที่บินอยู่ในชั้นบรรยากาศโลก A/W = อากาศยานมีความสมควรเดินอากาศเมื่อผ่านข้อกำหนดสำหรับการปฏิบัติการที่ปลอดภัย"}, {"abbr": "ACAM", "term_en": "Aircraft Continuing Airworthiness Monitoring", "term_th": "การติดตามความสมควรเดินอากาศต่อเนื่องของอากาศยาน", "desc_en": "Random monitoring of continuing airworthiness of aircraft by official airworthiness inspectors, in addition to the annual airworthiness review.", "desc_th": "การสุ่มตรวจสอบความสมควรเดินอากาศต่อเนื่องของอากาศยานโดยผู้ตรวจสอบความสมควรเดินอากาศทางการ นอกเหนือจากการตรวจสอบความสมควรเดินอากาศประจำปี"}, {"abbr": "AD / LTA", "term_en": "Airworthiness Directive", "term_th": "คำสั่งความสมควรเดินอากาศ", "desc_en": "Mandatory measures if, after certification, a defect restricting airworthiness is found — a notification that a known safety deficiency (aircraft/engine/avionics/other system) exists and must be corrected.", "desc_th": "มาตรการบังคับเมื่อพบข้อบกพร่องที่จำกัดความสมควรเดินอากาศหลังการรับรองแบบ — การแจ้งเตือนว่ามีข้อบกพร่องด้านความปลอดภัยที่ทราบแล้ว (อากาศยาน/เครื่องยนต์/อิเล็กทรอนิกส์การบิน/ระบบอื่น) และต้องได้รับการแก้ไข"}, {"abbr": "AFM / AOM", "term_en": "Aircraft Flight Manual / Aircraft Operating Manual", "term_th": "คู่มือการบินอากาศยาน / คู่มือปฏิบัติการอากาศยาน", "desc_en": "AFM contains information necessary for safe operation, tailored to a specific aircraft. AOM documents flight execution and aircraft operating instructions.", "desc_th": "AFM บรรจุข้อมูลที่จำเป็นสำหรับการปฏิบัติการที่ปลอดภัย เฉพาะเจาะจงกับอากาศยานแต่ละลำ AOM บันทึกการปฏิบัติการบินและคำแนะนำการใช้งานอากาศยาน"}, {"abbr": "AMC / GM", "term_en": "Acceptable Means of Compliance / Guidance Material", "term_th": "แนวทางปฏิบัติที่ยอมรับได้ / เอกสารแนะนำ", "desc_en": "Non-binding, negotiable information provided by EASA to illustrate implementing rules (AMC) or assist users in complying with them (GM).", "desc_th": "ข้อมูลที่ไม่บังคับและต่อรองได้ ซึ่ง EASA จัดทำเพื่ออธิบายกฎบังคับใช้ (AMC) หรือช่วยผู้ใช้ปฏิบัติตาม (GM)"}, {"abbr": "AML", "term_en": "Aircraft Maintenance Licence (EASA Form 26)", "term_th": "ใบอนุญาตซ่อมบำรุงอากาศยาน", "desc_en": "Part-66 licence issued by an NAA, indicating which category and aircraft type a maintenance technician is approved for.", "desc_th": "ใบอนุญาตตาม Part-66 ที่ออกโดย NAA ระบุประเภทและแบบอากาศยานที่ช่างซ่อมบำรุงได้รับอนุมัติ"}, {"abbr": "AMM", "term_en": "Aircraft Maintenance Manual", "term_th": "คู่มือซ่อมบำรุงอากาศยาน", "desc_en": "Approved manual describing how to perform all maintenance operations: functional checks, measurements, service work, component removal.", "desc_th": "คู่มือที่ได้รับอนุมัติซึ่งอธิบายวิธีปฏิบัติงานซ่อมบำรุงทั้งหมด: การตรวจสอบการทำงาน การวัด งานบริการ การถอดชิ้นส่วน"}, {"abbr": "AOC", "term_en": "Air Operator Certificate", "term_th": "ใบรับรองผู้ดำเนินการเดินอากาศ", "desc_en": "Certificate authorising an operator to perform commercial air transport services (ICAO Annex 6); requires personnel, assets and systems ensuring safety.", "desc_th": "ใบรับรองที่อนุญาตให้ผู้ประกอบการให้บริการขนส่งทางอากาศเชิงพาณิชย์ (ICAO Annex 6) ต้องมีบุคลากร ทรัพย์สิน และระบบที่รับรองความปลอดภัย"}, {"abbr": "AOG", "term_en": "Aircraft On Ground", "term_th": "อากาศยานติดพื้น", "desc_en": "Condition where an aircraft is not ready to fly for technical reasons and must remain on the ground until spare parts/tools/personnel restore airworthiness.", "desc_th": "สภาวะที่อากาศยานไม่พร้อมบินด้วยเหตุผลทางเทคนิค และต้องจอดอยู่บนพื้นจนกว่าจะมีอะไหล่/เครื่องมือ/บุคลากรมาแก้ไขให้กลับสู่สภาพสมควรเดินอากาศ"}, {"abbr": "AR / ARC / ARO / ARS", "term_en": "Airworthiness Review; Certificate; Authority Requirements for Air Ops; Review Staff", "term_th": "การตรวจสอบความสมควรเดินอากาศ; ใบรับรอง; ข้อกำหนดหน่วยงานสำหรับปฏิบัติการบิน; เจ้าหน้าที่ตรวจสอบ", "desc_en": "AR = complete documented records review + physical inspection. ARC (EASA Form 15) = issued/renewed annually by CAMO or NAA; needs a 'controlled environment' for CAMO renewal (up to twice). ARO = Part-ARO, non-commercial complex-aircraft ops authority requirements. ARS = personnel performing airworthiness reviews (5 yrs experience, AML etc.).", "desc_th": "AR = ทบทวนบันทึกเอกสารครบถ้วน + ตรวจสอบทางกายภาพ ARC (EASA Form 15) = ออก/ต่ออายุประจำปีโดย CAMO หรือ NAA ต้องมี 'สภาพแวดล้อมควบคุม' สำหรับการต่ออายุโดย CAMO (สูงสุดสองครั้ง) ARO = Part-ARO ข้อกำหนดหน่วยงานสำหรับปฏิบัติการอากาศยานซับซ้อนไม่เชิงพาณิชย์ ARS = บุคลากรที่ทำการตรวจสอบความสมควรเดินอากาศ (ประสบการณ์ 5 ปี มี AML ฯลฯ)"}, {"abbr": "ASB / SB / SL", "term_en": "Alert Service Bulletin / Service Bulletin / Service Letter", "term_th": "Alert Service Bulletin / Service Bulletin / Service Letter", "desc_en": "SB proposes technical improvements; if classified as a safety issue it's issued as 'Alert SB' and usually followed by an AD. SL is general operational/technical information from the design org.", "desc_th": "SB เสนอการปรับปรุงทางเทคนิค; หากจัดว่าเป็นประเด็นความปลอดภัยจะออกเป็น 'Alert SB' และมักตามด้วย AD SL คือข้อมูลปฏิบัติการ/เทคนิคทั่วไปจากองค์กรออกแบบ"}, {"abbr": "Ass / Audit", "term_en": "Assessment; Audit", "term_th": "การประเมิน; การตรวจสอบ", "desc_en": "Assessment = competency check (e.g. for certification authorisation, Form 4). Audit = independent examination of whether processes/requirements/policies meet required standards (internal, external, or approval audits).", "desc_th": "การประเมิน = ตรวจสอบความสามารถ (เช่น เพื่อการอนุญาตออกใบรับรอง, Form 4) การตรวจสอบ = การตรวจสอบอิสระว่ากระบวนการ/ข้อกำหนด/นโยบายเป็นไปตามมาตรฐานที่กำหนด (ภายใน ภายนอก หรือการตรวจสอบเพื่ออนุมัติ)"}, {"abbr": "ATA", "term_en": "Air Transport Association (chapter system)", "term_th": "ระบบบทของ Air Transport Association", "desc_en": "A worldwide standard dividing all aircraft technical systems into chapters/sub-chapters, e.g. fuel system = chapter 28.", "desc_th": "มาตรฐานสากลที่แบ่งระบบเทคนิคของอากาศยานทั้งหมดออกเป็นบท/บทย่อย เช่น ระบบเชื้อเพลิง = บทที่ 28"}, {"abbr": "AWO", "term_en": "All Weather Operation", "term_th": "การปฏิบัติการทุกสภาพอากาศ", "desc_en": "Requirements for airlines/operators when their aircraft operate under difficult visibility conditions.", "desc_th": "ข้อกำหนดสำหรับสายการบิน/ผู้ประกอบการเมื่ออากาศยานปฏิบัติการภายใต้สภาพทัศนวิสัยที่ยากลำบาก"}, {"abbr": "CAA / LBA / FAA / TCCA / BCAA", "term_en": "National Aviation Authority examples", "term_th": "ตัวอย่างหน่วยงานการบินแห่งชาติ", "desc_en": "CAA = UK (no longer EU/EASA member since 2021); LBA = Germany; FAA = USA; TCCA = Canada; BCAA = Belgium. Each is an NAA analogous to the others.", "desc_th": "CAA = สหราชอาณาจักร (ไม่เป็นสมาชิก EU/EASA ตั้งแต่ปี 2021); LBA = เยอรมนี; FAA = สหรัฐฯ; TCCA = แคนาดา; BCAA = เบลเยียม แต่ละแห่งคือ NAA ที่เทียบเท่ากัน"}, {"abbr": "Finding / Beanstandung", "term_en": "Finding, Defect", "term_th": "ข้อบกพร่อง", "desc_en": "Non-conformity in an operational process, or a complaint/defect on the aircraft; must be recorded in the technical logbook or another approved procedure and rectified/deferred per repair instructions or the MEL before the next flight.", "desc_th": "ความไม่สอดคล้องในกระบวนการปฏิบัติงาน หรือข้อร้องเรียน/ข้อบกพร่องบนอากาศยาน ต้องบันทึกในสมุดบันทึกทางเทคนิคหรือขั้นตอนที่ได้รับอนุมัติอื่น และแก้ไข/เลื่อนตามคำแนะนำการซ่อมหรือ MEL ก่อนเที่ยวบินถัดไป"}, {"abbr": "CA", "term_en": "Certification Authorisation / Continuing Airworthiness", "term_th": "การอนุญาตออกใบรับรอง / ความสมควรเดินอากาศต่อเนื่อง", "desc_en": "Certification Authorisation = issued by the 145 org to release-authorised personnel once requirements are met. Continuing Airworthiness = all measures for monitoring, preserving and managing airworthiness, per Reg. 1321/2014.", "desc_th": "การอนุญาตออกใบรับรอง = ออกโดยองค์กร 145 ให้บุคลากรที่ได้รับอนุญาตปล่อยงานเมื่อผ่านข้อกำหนดแล้ว ความสมควรเดินอากาศต่อเนื่อง = มาตรการทั้งหมดในการติดตาม รักษา และจัดการความสมควรเดินอากาศ ตาม Reg. 1321/2014"}, {"abbr": "CAE / CAME / CAMO / CAMO+ / CAO", "term_en": "Exposition & organisation types for Continuing Airworthiness", "term_th": "คู่มือและประเภทองค์กรความสมควรเดินอากาศต่อเนื่อง", "desc_en": "CAE = CAO's operating manual. CAME = CAMO's operating manual. CAMO = organisation managing continuing airworthiness on behalf of the operator (Part-M/G or Part-CAMO). CAMO+ = authorised to extend ARCs (needs ARS + controlled environment). CAO = combined org doing BOTH CAW management and maintenance.", "desc_th": "CAE = คู่มือปฏิบัติงานของ CAO CAME = คู่มือปฏิบัติงานของ CAMO CAMO = องค์กรที่จัดการความสมควรเดินอากาศต่อเนื่องในนามผู้ประกอบการ (Part-M/G หรือ Part-CAMO) CAMO+ = ได้รับอนุญาตให้ต่ออายุ ARC (ต้องมี ARS + สภาพแวดล้อมควบคุม) CAO = องค์กรผสมที่ทำทั้งการจัดการความสมควรเดินอากาศต่อเนื่องและการซ่อมบำรุง"}, {"abbr": "CDL", "term_en": "Configuration Deviation List", "term_th": "รายการเบี่ยงเบนการจัดวางอุปกรณ์", "desc_en": "Provides measures to be taken when attachments, components or panels are missing from an aircraft.", "desc_th": "ให้มาตรการที่ต้องดำเนินการเมื่ออุปกรณ์ประกอบ ชิ้นส่วน หรือแผงขาดหายไปจากอากาศยาน"}, {"abbr": "CE", "term_en": "Controlled Environment", "term_th": "สภาพแวดล้อมควบคุม", "desc_en": "An aircraft permanently managed by one contracted CAMO for continuing airworthiness — enabling that CAMO ('CAMO+') to extend the ARC.", "desc_th": "อากาศยานที่จัดการต่อเนื่องโดย CAMO เดียวที่ทำสัญญาไว้สำหรับความสมควรเดินอากาศต่อเนื่อง — ทำให้ CAMO นั้น ('CAMO+') สามารถต่ออายุ ARC ได้"}, {"abbr": "CMM / CoC", "term_en": "Component Maintenance Manual / Certificate of Conformity", "term_th": "คู่มือซ่อมบำรุงชิ้นส่วน / หนังสือรับรองความสอดคล้อง", "desc_en": "CMM (from the OEM) describes maintenance tasks/intervals for a component; is the working instruction for a 145 'C'-rated organisation. CoC certifies conformity of sub-components or consumables.", "desc_th": "CMM (จากผู้ผลิตดั้งเดิม) อธิบายงาน/ช่วงเวลาซ่อมบำรุงของชิ้นส่วน เป็นคำแนะนำการทำงานสำหรับองค์กร 145 เรตติ้ง 'C' CoC รับรองความสอดคล้องของชิ้นส่วนย่อยหรือวัสดุสิ้นเปลือง"}, {"abbr": "CofA / CofR", "term_en": "Certificate of Airworthiness / Certificate of Registration", "term_th": "ใบสำคัญสมควรเดินอากาศ / ใบสำคัญการจดทะเบียน", "desc_en": "CofA (EASA Form 25): formal NAA document certifying airworthiness once conformity to type design is shown; kept valid by the annual ARC. CofR: issued by the NAA upon registration, assigning the aircraft's identification (e.g. D-AIPA).", "desc_th": "CofA (EASA Form 25): เอกสารทางการของ NAA ที่รับรองความสมควรเดินอากาศเมื่อแสดงความสอดคล้องกับแบบที่ได้รับอนุมัติ คงความถูกต้องด้วย ARC ประจำปี CofR: ออกโดย NAA เมื่อจดทะเบียน กำหนดรหัสประจำอากาศยาน (เช่น D-AIPA)"}, {"abbr": "CRS", "term_en": "Certificate of Release to Service", "term_th": "ใบรับรองการปล่อยกลับสู่บริการ", "desc_en": "Release document after aircraft maintenance, issued only by certifying staff (CAT A/B1/B2/B3/C); documented in the technical logbook.", "desc_th": "เอกสารปล่อยหลังการซ่อมบำรุงอากาศยาน ออกโดยบุคลากรออกใบรับรองเท่านั้น (CAT A/B1/B2/B3/C) บันทึกในสมุดบันทึกทางเทคนิค"}, {"abbr": "CS", "term_en": "Certification Specification / Certifying Staff", "term_th": "ข้อกำหนดการรับรอง / บุคลากรออกใบรับรอง", "desc_en": "Certification Specification = EASA-coordinated development principles demonstrated in the type-test programme (e.g. CS-25). Certifying Staff = personnel authorised for aircraft, components or engines.", "desc_th": "ข้อกำหนดการรับรอง = หลักการพัฒนาที่ประสานกับ EASA ซึ่งพิสูจน์ในโปรแกรมทดสอบแบบ (เช่น CS-25) บุคลากรออกใบรับรอง = บุคลากรที่ได้รับอนุญาตสำหรับอากาศยาน ชิ้นส่วน หรือเครื่องยนต์"}, {"abbr": "DDA / DO / DOA / DOE", "term_en": "Direct Delivery Authorisation / Design Organisation & Approval & Exposition", "term_th": "การอนุญาตส่งมอบโดยตรง / องค์กรออกแบบและการอนุมัติและคู่มือ", "desc_en": "DDA authorises a component manufacturer (21.G) to ship directly to final customers. DO develops/supports a product type (Part-21.J); DOA is its approval certificate; DOE is its exposition manual.", "desc_th": "DDA อนุญาตให้ผู้ผลิตชิ้นส่วน (21.G) ส่งมอบโดยตรงถึงลูกค้าปลายทาง DO พัฒนา/สนับสนุนแบบผลิตภัณฑ์ (Part-21.J); DOA คือใบรับรองการอนุมัติ; DOE คือคู่มือองค์กร"}, {"abbr": "EASA / ECAC / EFTA / Euro Control / ICAN / ICAO / JAA", "term_en": "International & regional aviation bodies", "term_th": "องค์กรการบินระหว่างประเทศและระดับภูมิภาค", "desc_en": "EASA (2003, Cologne) = EU aviation safety authority. ECAC (1955, France) = harmonises European aviation legislation. EFTA = growth/cooperation for non-EU Western European states. Euro Control = seamless European ATM. ICAN (1919) = predecessor of ICAO. ICAO (1947, Montreal, UN) = 193 member states, standardises civil aviation globally. JAA (dissolved 2009) = predecessor whose tasks EASA took over.", "desc_th": "EASA (2003, โคโลญ) = หน่วยงานความปลอดภัยการบินของ EU ECAC (1955, ฝรั่งเศส) = ประสานกฎหมายการบินยุโรป EFTA = การเติบโต/ความร่วมมือสำหรับรัฐยุโรปตะวันตกนอก EU Euro Control = การจัดการจราจรทางอากาศยุโรปแบบไร้รอยต่อ ICAN (1919) = องค์กรก่อนหน้า ICAO ICAO (1947, มอนทรีออล, UN) = สมาชิก 193 ประเทศ กำหนดมาตรฐานการบินพลเรือนทั่วโลก JAA (ยุบปี 2009) = องค์กรก่อนหน้าที่ EASA รับช่วงภารกิจต่อ"}, {"abbr": "EFB", "term_en": "Electronic Flight Bag", "term_th": "กระเป๋าการบินอิเล็กทรอนิกส์", "desc_en": "Portable electronic display devices for crew use; can store/display aeronautical data or perform performance/fuel calculations.", "desc_th": "อุปกรณ์แสดงผลอิเล็กทรอนิกส์แบบพกพาสำหรับลูกเรือ สามารถเก็บ/แสดงข้อมูลการบินหรือคำนวณสมรรถนะ/เชื้อเพลิงได้"}, {"abbr": "ELA1 / ELA2 / LSA", "term_en": "European Light Aircraft classes 1 & 2 / Light Sport Aircraft", "term_th": "ประเภทอากาศยานเบายุโรป 1 และ 2 / อากาศยานกีฬาเบา", "desc_en": "ELA1: MTOW ≤1200kg non-complex, small balloon, 4-PAX max hot-air airship. ELA2: MTOW ≤2000kg non-complex, balloon, hot-air/gas airship, very light rotorcraft. LSA: ≤600kg, ≤2 seats, single non-turbine engine, non-pressurised.", "desc_th": "ELA1: MTOW ≤1200กก. ไม่ซับซ้อน บอลลูนเล็ก เรือเหาะลมร้อนสูงสุด 4 ที่นั่ง ELA2: MTOW ≤2000กก. ไม่ซับซ้อน บอลลูน เรือเหาะลมร้อน/แก๊ส เฮลิคอปเตอร์เบามาก LSA: ≤600กก. ≤2 ที่นั่ง เครื่องยนต์เดี่ยวไม่ใช่เทอร์ไบน์ ไม่ปรับความดัน"}, {"abbr": "ETOPS", "term_en": "Extended-range Twin-engine Operations Performance Standards", "term_th": "มาตรฐานสมรรถนะปฏิบัติการเครื่องยนต์คู่พิสัยขยาย", "desc_en": "Standard rules defining the possibility for twin-engine aircraft to operate on routes over areas without a possible landing within a defined time (e.g. in case of engine failure).", "desc_th": "กฎมาตรฐานที่กำหนดความเป็นไปได้ในการปฏิบัติการเครื่องบินสองเครื่องยนต์บนเส้นทางเหนือพื้นที่ที่ไม่สามารถลงจอดได้ภายในเวลาที่กำหนด (เช่น กรณีเครื่องยนต์ขัดข้อง)"}, {"abbr": "Form 1/2/4/15/19/25/45/52/53", "term_en": "Key EASA Forms", "term_th": "แบบฟอร์ม EASA ที่สำคัญ", "desc_en": "Form 1 = component release certificate. Form 2 = application for a Part-145/M-G org approval. Form 4 = management-personnel application. Form 15 = ARC (see ARC). Form 19 = AML issuance/renewal/amendment. Form 25 = Certificate of Airworthiness. Form 45 = noise certificate. Form 52 = statement of conformity (manufacturer). Form 53 = manufacturer's certificate of release to service.", "desc_th": "Form 1 = ใบรับรองการปล่อยชิ้นส่วน Form 2 = คำขออนุมัติองค์กร Part-145/M-G Form 4 = คำขอสำหรับบุคลากรบริหาร Form 15 = ARC (ดู ARC) Form 19 = การออก/ต่ออายุ/แก้ไข AML Form 25 = ใบสำคัญสมควรเดินอากาศ Form 45 = ใบรับรองเสียง Form 52 = หนังสือรับรองความสอดคล้อง (ผู้ผลิต) Form 53 = ใบรับรองการปล่อยกลับสู่บริการของผู้ผลิต"}, {"abbr": "IA / ICA", "term_en": "Initial Airworthiness / Instructions for Continued Airworthiness", "term_th": "ความสมควรเดินอากาศเบื้องต้น / คำแนะนำความสมควรเดินอากาศต่อเนื่อง", "desc_en": "IA = tasks performed during aircraft development (Part-21). ICA = continuing-airworthiness documentation issued by the TC holder/Design Organisation.", "desc_th": "IA = งานที่ทำระหว่างการพัฒนาอากาศยาน (Part-21) ICA = เอกสารความสมควรเดินอากาศต่อเนื่องที่ออกโดยผู้ถือ TC/องค์กรออกแบบ"}, {"abbr": "IH", "term_en": "Maintenance (Instandhaltung)", "term_th": "การซ่อมบำรุง", "desc_en": "Preventive and reactive maintenance, repair, overhaul (international term: MRO). In the EASA world called Line, Base or Component Maintenance.", "desc_th": "การซ่อมบำรุงเชิงป้องกันและเชิงตอบสนอง การซ่อมแซม การซ่อมใหญ่ (คำสากล: MRO) ในโลกของ EASA เรียกว่าการซ่อมบำรุงระดับลาน ระดับฐาน หรือระดับชิ้นส่วน"}, {"abbr": "IPC / WDM / SRM / TSM / FIM / RDAS / ITEM", "term_en": "Technical manuals", "term_th": "คู่มือทางเทคนิค", "desc_en": "IPC = Illustrated Parts Catalog. WDM = Wiring Diagram Manual. SRM = Structural Repair Manual. TSM/FIM = Trouble-shooting/Fault Isolation Manual. RDAS = repair release doc from TC holder for repairs beyond SRM. ITEM = Illustrated Tool & Equipment Manual.", "desc_th": "IPC = แคตตาล็อกชิ้นส่วนพร้อมภาพ WDM = คู่มือแผนผังสายไฟ SRM = คู่มือซ่อมโครงสร้าง TSM/FIM = คู่มือแก้ไขปัญหา/แยกข้อบกพร่อง RDAS = เอกสารปล่อยการซ่อมจากผู้ถือ TC สำหรับการซ่อมนอกเหนือ SRM ITEM = คู่มือเครื่องมือและอุปกรณ์พร้อมภาพ"}, {"abbr": "IR", "term_en": "Implementing Rules", "term_th": "กฎบังคับใช้", "desc_en": "EU laws ratified by the EU Commission and published by EASA, e.g. Regulation 1321/2014.", "desc_th": "กฎหมาย EU ที่ให้สัตยาบันโดยคณะกรรมาธิการยุโรปและเผยแพร่โดย EASA เช่น Regulation 1321/2014"}, {"abbr": "LM / LRU", "term_en": "Line Maintenance / Line Replaceable Unit", "term_th": "การซ่อมบำรุงระดับลาน / หน่วยเปลี่ยนได้ที่ลาน", "desc_en": "LM = troubleshooting, small structural repairs, <C-Check inspections, component/LRU/life-limited part replacement, minor mods, servicing. LRU = a component replaceable in line maintenance without much effort (e.g. hydraulic pump, tyre).", "desc_th": "LM = แก้ไขปัญหา ซ่อมโครงสร้างเล็กน้อย ตรวจสอบต่ำกว่า C-Check เปลี่ยนชิ้นส่วน/LRU/ชิ้นส่วนอายุจำกัด ดัดแปลงเล็กน้อย งานบริการ LRU = ชิ้นส่วนที่เปลี่ยนได้ในงานซ่อมบำรุงระดับลานโดยไม่ต้องใช้ความพยายามมาก (เช่น ปั๊มไฮดรอลิก ยาง)"}, {"abbr": "M.A. / MEL / MMEL", "term_en": "Part-M reference; Minimum Equipment List; Master MEL", "term_th": "การอ้างอิง Part-M; รายการอุปกรณ์ขั้นต่ำ; MEL หลัก", "desc_en": "M.A. = Annex I Part-M of IR 1321/2014. MEL describes possibilities for continued operation with a technical defect and time limits (prepared by operator/CAMO). MMEL, issued by the design org, sets the baseline restrictions the MEL must at least contain.", "desc_th": "M.A. = Annex I Part-M ของ IR 1321/2014 MEL อธิบายความเป็นไปได้ในการปฏิบัติการต่อเมื่อมีข้อบกพร่องทางเทคนิคและขีดจำกัดเวลา (จัดทำโดยผู้ประกอบการ/CAMO) MMEL ออกโดยองค์กรออกแบบ กำหนดข้อจำกัดพื้นฐานที่ MEL ต้องมีอย่างน้อย"}, {"abbr": "MO / MOA / MOE", "term_en": "Maintenance Organisation & its Approval & Exposition", "term_th": "องค์กรซ่อมบำรุงและการอนุมัติและคู่มือ", "desc_en": "MO = approved for various scopes under Part-145, CAO, M/F or ML. MOA = its approval certificate. MOE = its exposition, presenting Part-145 requirements/procedures.", "desc_th": "MO = ได้รับอนุมัติในขอบเขตต่าง ๆ ภายใต้ Part-145, CAO, M/F หรือ ML MOA = ใบรับรองการอนุมัติ MOE = คู่มือองค์กรที่นำเสนอข้อกำหนด/ขั้นตอนของ Part-145"}, {"abbr": "MoC / Mod", "term_en": "Means of Compliance / Modification", "term_th": "วิธีตรวจสอบการปฏิบัติตาม / การดัดแปลง", "desc_en": "MoC 0-9 describes verification/test procedures in type certification (e.g. MoC4 = laboratory test, MoC6 = flight test). Mod = a modification of the type design (minor/major/significant/substantial), via SB or type-design change.", "desc_th": "MoC 0-9 อธิบายขั้นตอนการตรวจสอบ/ทดสอบในกระบวนการรับรองแบบ (เช่น MoC4 = ทดสอบในห้องปฏิบัติการ MoC6 = ทดสอบบิน) Mod = การดัดแปลงแบบที่ได้รับอนุมัติ (เล็กน้อย/ใหญ่/สำคัญ/สาระสำคัญ) ผ่าน SB หรือการเปลี่ยนแบบ"}, {"abbr": "MP / MPD / MRB", "term_en": "Maintenance Programme / Planning Document / Review Board", "term_th": "โปรแกรมซ่อมบำรุง / เอกสารวางแผน / คณะกรรมการทบทวน", "desc_en": "MPD = basic maintenance programme from the design org/TC holder, used by the Operator/CAMO to develop its own AMP. MRB = design-org committee defining minimum maintenance requirements based on MSG-3 standards.", "desc_th": "MPD = โปรแกรมซ่อมบำรุงพื้นฐานจากองค์กรออกแบบ/ผู้ถือ TC ใช้โดยผู้ประกอบการ/CAMO เพื่อพัฒนา AMP ของตนเอง MRB = คณะกรรมการองค์กรออกแบบที่กำหนดข้อกำหนดซ่อมบำรุงขั้นต่ำตามมาตรฐาน MSG-3"}, {"abbr": "MTO / MTOE / MTOW", "term_en": "Maintenance Training Organisation & Exposition / Maximum Take-Off Weight", "term_th": "องค์กรฝึกอบรมซ่อมบำรุงและคู่มือ / น้ำหนักวิ่งขึ้นสูงสุด", "desc_en": "MTO (Part-147) trains maintenance technicians; MTOE is its exposition. MTOW = maximum take-off weight incl. fuel, load, passengers.", "desc_th": "MTO (Part-147) ฝึกอบรมช่างซ่อมบำรุง; MTOE คือคู่มือองค์กร MTOW = น้ำหนักวิ่งขึ้นสูงสุด รวมเชื้อเพลิง สัมภาระ ผู้โดยสาร"}, {"abbr": "NAA", "term_en": "National Aviation Authority", "term_th": "หน่วยงานการบินแห่งชาติ", "desc_en": "The competent national aviation authority of an EU member state or third country, e.g. LBA or FAA.", "desc_th": "หน่วยงานการบินแห่งชาติที่มีอำนาจของรัฐสมาชิก EU หรือประเทศที่สาม เช่น LBA หรือ FAA"}, {"abbr": "NCC / NCO / ORO / SPA / SPO", "term_en": "Air Operations Annexes (non-commercial, organisational, specific approval, specialised)", "term_th": "ภาคผนวกการปฏิบัติการบิน", "desc_en": "NCC (Annex VI) = non-commercial ops, complex aircraft. NCO (Annex VII) = non-commercial ops, non-complex aircraft. ORO (Annex III) = organisational requirements for operators. SPA (Annex V) = specific approvals (MNPS, RVSM, LVO, ETOPS, dangerous goods, HHO, HEMS, NVIS). SPO (Annex VIII) = specialised operations (agriculture, photography, surveying, aerial advertising, etc.).", "desc_th": "NCC (Annex VI) = ปฏิบัติการไม่เชิงพาณิชย์ อากาศยานซับซ้อน NCO (Annex VII) = ปฏิบัติการไม่เชิงพาณิชย์ อากาศยานไม่ซับซ้อน ORO (Annex III) = ข้อกำหนดองค์กรสำหรับผู้ประกอบการ SPA (Annex V) = การอนุมัติเฉพาะ (MNPS, RVSM, LVO, ETOPS, สินค้าอันตราย, HHO, HEMS, NVIS) SPO (Annex VIII) = ปฏิบัติการเฉพาะทาง (เกษตรกรรม ถ่ายภาพ สำรวจ โฆษณาทางอากาศ ฯลฯ)"}, {"abbr": "NHA / NP", "term_en": "Next Higher Assembly / Nominated Person", "term_th": "ชุดประกอบระดับสูงกว่า / บุคคลที่ได้รับมอบหมาย", "desc_en": "NHA = the assembly a component is installed into (e.g. wheel+brake = landing gear). NP = a person named in the exposition with defined roles/functions; substitution rules often required.", "desc_th": "NHA = ชุดประกอบที่ชิ้นส่วนติดตั้งอยู่ (เช่น ล้อ+เบรก = ล้อลงจอด) NP = บุคคลที่ระบุในคู่มือองค์กรพร้อมบทบาท/หน้าที่ที่กำหนด มักต้องมีกฎการมอบหมายทดแทน"}, {"abbr": "PO / POA / POE / PPA", "term_en": "Production Organisation & its Approval & Exposition / Products, Parts & Appliances", "term_th": "องค์กรผลิตและการอนุมัติและคู่มือ / ผลิตภัณฑ์ ชิ้นส่วน อุปกรณ์", "desc_en": "PO (Part-21.G) = involved in manufacturing products/parts/appliances, approved or supplying another PO. POA = its approval certificate. POE = its exposition. PPA = products (needing a TC), parts and appliances all requiring certification per Reg. 748/2012.", "desc_th": "PO (Part-21.G) = เกี่ยวข้องกับการผลิตผลิตภัณฑ์/ชิ้นส่วน/อุปกรณ์ ได้รับอนุมัติหรือจัดหาให้ PO อื่น POA = ใบรับรองการอนุมัติ POE = คู่มือองค์กร PPA = ผลิตภัณฑ์ (ต้องมี TC) ชิ้นส่วน และอุปกรณ์ ที่ต้องได้รับการรับรองตาม Reg. 748/2012"}, {"abbr": "Q / QMS", "term_en": "Quality / Quality Management System", "term_th": "คุณภาพ / ระบบการจัดการคุณภาพ", "desc_en": "Quality (per DIN EN 9000) = degree to which inherent characteristics meet requirements. QMS ensures system/process/product quality is checked and improved for lasting performance/safety and regulatory compliance.", "desc_th": "คุณภาพ (ตาม DIN EN 9000) = ระดับที่คุณลักษณะโดยธรรมชาติเป็นไปตามข้อกำหนด QMS รับรองว่าคุณภาพของระบบ/กระบวนการ/ผลิตภัณฑ์ได้รับการตรวจสอบและปรับปรุงเพื่อสมรรถนะ/ความปลอดภัยที่ยั่งยืนและการปฏิบัติตามกฎระเบียบ"}, {"abbr": "SACA / SAFA", "term_en": "Safety Assessment of Community/Foreign Aircraft", "term_th": "การประเมินความปลอดภัยอากาศยานของประชาคม/ต่างชาติ", "desc_en": "Ramp inspections of aircraft at aerodromes to serve air traffic safety — SACA for European aircraft, SAFA for foreign aircraft.", "desc_th": "การตรวจอากาศยาน ณ ลานจอดของสนามบินเพื่อความปลอดภัยการจราจรทางอากาศ — SACA สำหรับอากาศยานยุโรป SAFA สำหรับอากาศยานต่างชาติ"}, {"abbr": "Scrap / S / U/S", "term_en": "Scrap; Serviceable; Unserviceable", "term_th": "ทิ้ง; ใช้งานได้; ใช้งานไม่ได้", "desc_en": "Scrap = parts that can no longer be installed and must be marked/scrapped. Serviceable = technically faultless with correct documentation (Form 1). Unserviceable (U/S) = defective, suspect, or lacking documentation.", "desc_th": "Scrap = ชิ้นส่วนที่ติดตั้งไม่ได้อีกต่อไปและต้องทำเครื่องหมาย/ทิ้ง ใช้งานได้ (Serviceable) = ไม่มีข้อบกพร่องทางเทคนิคและมีเอกสารถูกต้อง (Form 1) ใช้งานไม่ได้ (U/S) = มีข้อบกพร่อง น่าสงสัย หรือขาดเอกสาร"}, {"abbr": "SRM / SRU / STC / STD", "term_en": "Structural Repair Manual / Shop Replaceable Unit / Supplemental Type Certificate / Standard", "term_th": "คู่มือซ่อมโครงสร้าง / หน่วยเปลี่ยนได้ในโรงซ่อม / ใบรับรองแบบเสริม / มาตรฐาน", "desc_en": "SRM approved by the TC holder. SRU = a part installed in a component, replaceable in the shop cycle. STC = supplemental type certificate for products/parts/appliances (e.g. cargo conversion). STD = a widely accepted uniform way of describing/producing/performing something.", "desc_th": "SRM ได้รับอนุมัติจากผู้ถือ TC SRU = ชิ้นส่วนที่ติดตั้งในส่วนประกอบ เปลี่ยนได้ในรอบโรงซ่อม STC = ใบรับรองแบบเสริมสำหรับผลิตภัณฑ์/ชิ้นส่วน/อุปกรณ์ (เช่น ดัดแปลงเป็นเครื่องบินขนส่งสินค้า) STD = วิธีที่ยอมรับกันอย่างกว้างขวางในการอธิบาย/ผลิต/ปฏิบัติสิ่งใดสิ่งหนึ่ง"}, {"abbr": "SW / UW / SS", "term_en": "Skilled Worker / Unskilled Worker / Supporting Staff", "term_th": "ช่างฝีมือ / ผู้ฝึกงาน / บุคลากรสนับสนุน", "desc_en": "SW = qualified worker without certification authority (e.g. paint shop), aircraft certification done by Certifying Staff. UW = employee in training, works under supervision. SS = CAT B1/B2 authorised as support personnel in base maintenance; CAT C ultimately releases the aircraft via CRS.", "desc_th": "SW = ช่างที่มีคุณสมบัติแต่ไม่มีอำนาจออกใบรับรอง (เช่น แผนกพ่นสี) การรับรองอากาศยานทำโดยบุคลากรออกใบรับรอง UW = พนักงานระหว่างฝึก ทำงานภายใต้การควบคุมดูแล SS = CAT B1/B2 ที่ได้รับอนุญาตเป็นบุคลากรสนับสนุนในการซ่อมบำรุงระดับฐาน โดย CAT C เป็นผู้ปล่อยอากาศยานขั้นสุดท้ายผ่าน CRS"}, {"abbr": "TC / TCDS", "term_en": "Type Certificate / Type Certificate Data Sheet", "term_th": "ใบรับรองแบบ / เอกสารข้อมูลใบรับรองแบบ", "desc_en": "TC = type certification for aircraft/products/parts/appliances. TCDS describes the product/its approved design/variants, proof of airworthiness & noise/emission compliance, and operational limitations.", "desc_th": "TC = การรับรองแบบสำหรับอากาศยาน/ผลิตภัณฑ์/ชิ้นส่วน/อุปกรณ์ TCDS อธิบายผลิตภัณฑ์/แบบที่ได้รับอนุมัติ/รุ่นต่าง ๆ หลักฐานความสมควรเดินอากาศ & การปฏิบัติตามข้อกำหนดเสียง/การปล่อยมลพิษ และข้อจำกัดปฏิบัติการ"}, {"abbr": "Teil 21/66/145/147/M/ML/OPS/CAMO/CAO", "term_en": "'Part-xx' — German naming convention", "term_th": "'Teil-xx' — ชื่อเรียกภาษาเยอรมัน", "desc_en": "'Teil' is simply German for 'Part'. Teil-21=Part-21 (certification), Teil-66=Part-66 (licensing), Teil-145=Part-145 (maintenance org), Teil-147=Part-147 (training org), Teil M/ML=Part-M/ML (continuing airworthiness), Teil OPS=Air Operations, Teil CAMO/CAO=Part-CAMO/CAO.", "desc_th": "'Teil' เป็นภาษาเยอรมันแปลว่า 'Part' Teil-21=Part-21 (การรับรองแบบ) Teil-66=Part-66 (การออกใบอนุญาต) Teil-145=Part-145 (องค์กรซ่อมบำรุง) Teil-147=Part-147 (องค์กรฝึกอบรม) Teil M/ML=Part-M/ML (ความสมควรเดินอากาศต่อเนื่อง) Teil OPS=การปฏิบัติการบิน Teil CAMO/CAO=Part-CAMO/CAO"}, {"abbr": "TLB / TOP", "term_en": "Technical Log Book / Technical-Organisational-Personnel prerequisites", "term_th": "สมุดบันทึกทางเทคนิค / เงื่อนไขด้านเทคนิค-องค์กร-บุคลากร", "desc_en": "TLB records defects/relevant airworthiness info (paper or electronic/EFB). TOP = the technical, organisational and personnel prerequisites required to be allowed to perform development/production/maintenance (facilities, work environment, equipment, work-planning, document control).", "desc_th": "TLB บันทึกข้อบกพร่อง/ข้อมูลความสมควรเดินอากาศที่เกี่ยวข้อง (กระดาษหรืออิเล็กทรอนิกส์/EFB) TOP = เงื่อนไขด้านเทคนิค องค์กร และบุคลากรที่จำเป็นเพื่อได้รับอนุญาตทำการพัฒนา/ผลิต/ซ่อมบำรุง (สิ่งอำนวยความสะดวก สภาพแวดล้อมการทำงาน อุปกรณ์ การวางแผนงาน การควบคุมเอกสาร)"}, {"abbr": "Unit / Event", "term_en": "Aircraft or Helicopter (as a unit); Occurrence", "term_th": "อากาศยานหรือเฮลิคอปเตอร์ (ในฐานะหน่วยหนึ่ง); เหตุการณ์", "desc_en": "Unit = an individually designed/built/certified aircraft verified by a Declaration of Conformity / Single Inspection Certificate (Form 52). Event/Occurrence = a reportable finding of an airworthiness/safety deficiency, requiring a report to the NAA within 72 hours.", "desc_th": "Unit = อากาศยานที่ออกแบบ/สร้าง/รับรองแยกลำ ยืนยันด้วยหนังสือรับรองความสอดคล้อง/ใบรับรองการตรวจครั้งเดียว (Form 52) Event/เหตุการณ์ = ข้อบกพร่องด้านความสมควรเดินอากาศ/ความปลอดภัยที่ต้องรายงาน ภายใน 72 ชั่วโมงต่อ NAA"}, {"abbr": "VZ", "term_en": "Registration of Aircraft", "term_th": "การจดทะเบียนอากาศยาน", "desc_en": "The NAA approves the aircraft for operation by issuing a CofA specifying intended use; the aircraft is entered in the national aircraft register; approval may be restricted, modified, or time-limited; revoked by withdrawing the CofA.", "desc_th": "NAA อนุมัติอากาศยานสำหรับปฏิบัติการโดยออก CofA ระบุวัตถุประสงค์การใช้งาน; อากาศยานถูกบันทึกในทะเบียนแห่งชาติ; การอนุมัติอาจถูกจำกัด แก้ไข หรือจำกัดเวลา; เพิกถอนโดยการถอน CofA"}, {"abbr": "WO", "term_en": "Work Order", "term_th": "ใบสั่งงาน", "desc_en": "Work mandated by the CAMO to a Part-145 organisation, covering modifications, repairs and routine checks — usually a task collection with a summary list & cover sheet.", "desc_th": "งานที่ CAMO มอบหมายให้องค์กร Part-145 ครอบคลุมการดัดแปลง การซ่อมแซม และการตรวจสอบตามปกติ — โดยปกติเป็นชุดงานพร้อมรายการสรุปและหน้าปก"}], "quiz": [{"q_en": "What does AOG stand for and mean?", "q_th": "AOG ย่อมาจากอะไรและหมายความว่าอย่างไร?", "choices_en": ["Aircraft On Ground — not ready to fly for technical reasons", "Airline Operations Group", "Aircraft Ownership Guarantee", "Approved Organisation Guideline"], "choices_th": ["Aircraft On Ground — ไม่พร้อมบินด้วยเหตุผลทางเทคนิค", "กลุ่มปฏิบัติการสายการบิน", "การรับประกันความเป็นเจ้าของอากาศยาน", "แนวทางองค์กรที่ได้รับอนุมัติ"], "a": 0}, {"q_en": "What is the difference between an MEL and an MMEL?", "q_th": "MEL กับ MMEL ต่างกันอย่างไร?", "choices_en": ["No difference", "MMEL is issued by the design org and sets the baseline the operator/CAMO's MEL must at least contain", "MEL is issued by the pilot only", "MMEL only applies to helicopters"], "choices_th": ["ไม่มีความแตกต่าง", "MMEL ออกโดยองค์กรออกแบบและกำหนดพื้นฐานที่ MEL ของผู้ประกอบการ/CAMO ต้องมีอย่างน้อย", "MEL ออกโดยนักบินเท่านั้น", "MMEL ใช้กับเฮลิคอปเตอร์เท่านั้น"], "a": 1}, {"q_en": "What is a CMM and who typically issues it?", "q_th": "CMM คืออะไรและใครเป็นผู้ออกโดยทั่วไป?", "choices_en": ["Component Maintenance Manual, issued by the component manufacturer (OEM)", "A pilot's licence, issued by the NAA", "Continuing Maintenance Model, issued by ICAO", "A type of Airworthiness Directive"], "choices_th": ["คู่มือซ่อมบำรุงชิ้นส่วน ออกโดยผู้ผลิตชิ้นส่วนดั้งเดิม (OEM)", "ใบอนุญาตนักบิน ออกโดย NAA", "แบบจำลองการซ่อมบำรุงต่อเนื่อง ออกโดย ICAO", "คำสั่งความสมควรเดินอากาศประเภทหนึ่ง"], "a": 0}, {"q_en": "What does NHA (Next Higher Assembly) refer to?", "q_th": "NHA (Next Higher Assembly) หมายถึงอะไร?", "choices_en": ["The pilot's next flight", "The assembly that a component is installed into, e.g. wheel+brake = landing gear", "A higher educational qualification", "The next Airworthiness Directive"], "choices_th": ["เที่ยวบินถัดไปของนักบิน", "ชุดประกอบที่ชิ้นส่วนติดตั้งอยู่ เช่น ล้อ+เบรก = ล้อลงจอด", "คุณวุฒิการศึกษาที่สูงขึ้น", "คำสั่งความสมควรเดินอากาศฉบับถัดไป"], "a": 1}, {"q_en": "An Airworthiness Review Certificate (ARC) is documented on which EASA Form?", "q_th": "ใบรับรองการตรวจสอบความสมควรเดินอากาศ (ARC) บันทึกในแบบฟอร์ม EASA ใด?", "choices_en": ["Form 1", "Form 15", "Form 25", "Form 53"], "choices_th": ["Form 1", "Form 15", "Form 25", "Form 53"], "a": 1}, {"q_en": "What is a Type Certificate Data Sheet (TCDS)?", "q_th": "Type Certificate Data Sheet (TCDS) คืออะไร?", "choices_en": ["A pilot's medical record", "A document describing the product, its approved design, variants, and airworthiness/noise/emission compliance", "A maintenance work order", "A component's shipping invoice"], "choices_th": ["ประวัติการแพทย์ของนักบิน", "เอกสารอธิบายผลิตภัณฑ์ แบบที่ได้รับอนุมัติ รุ่นต่าง ๆ และการปฏิบัติตามความสมควรเดินอากาศ/เสียง/การปล่อยมลพิษ", "ใบสั่งงานซ่อมบำรุง", "ใบแจ้งหนี้การจัดส่งชิ้นส่วน"], "a": 1}, {"q_en": "An SRU (Shop Replaceable Unit) is:", "q_th": "SRU (Shop Replaceable Unit) คืออะไร?", "choices_en": ["A part installed in a component that can be replaced in the shop cycle", "A unit only replaceable at the factory", "A pilot rating", "A form used for aircraft registration"], "choices_th": ["ชิ้นส่วนที่ติดตั้งในส่วนประกอบซึ่งเปลี่ยนได้ในรอบโรงซ่อม", "หน่วยที่เปลี่ยนได้ที่โรงงานเท่านั้น", "การรับรองแบบของนักบิน", "แบบฟอร์มที่ใช้สำหรับจดทะเบียนอากาศยาน"], "a": 0}, {"q_en": "What does 'controlled environment' mean in the context of ARC renewal by a CAMO?", "q_th": "'สภาพแวดล้อมควบคุม' หมายถึงอะไรในบริบทการต่ออายุ ARC โดย CAMO?", "choices_en": ["The aircraft is kept in a hangar at all times", "The aircraft is permanently managed by one contracted CAMO for continuing airworthiness", "The aircraft only flies in good weather", "The aircraft is owned by the government"], "choices_th": ["อากาศยานถูกเก็บในโรงเก็บเครื่องบินตลอดเวลา", "อากาศยานถูกจัดการต่อเนื่องโดย CAMO เดียวที่ทำสัญญาไว้สำหรับความสมควรเดินอากาศต่อเนื่อง", "อากาศยานบินเฉพาะสภาพอากาศดีเท่านั้น", "อากาศยานเป็นของรัฐบาล"], "a": 1}]}];
const REAL = [{"id": 1, "t": "ics", "q": "What is CS-STAN?", "th": "CS-STAN คืออะไร?", "o": ["EASA certification specifications with acceptable methods, techniques and practices for standard modifications and standard repairs", "A list of approved standard parts and materials for Part-145 stores", "An EASA standard for the training of airworthiness review staff"], "key": "CS-STAN = Standard modification + Standard repair (ใช้ได้กับงานมาตรฐาน) แต่ห้ามใช้กับ integrated avionics / COM-NAV-SUR", "exp": "CS-STAN contains acceptable methods, techniques and practices for performing standard modifications and standard repairs. It is not for the installation or replacement of integrated avionics or communication, navigation or surveillance systems. ICS may maintain according to Part-ML and CS-STAN.", "ref": [277, 278]}, {"id": 2, "t": "p21", "q": "Who is a type certificate holder (TC holder)?", "th": "ใครคือผู้ถือใบรับรองแบบ (TC holder)?", "o": ["The design organisation (manufacturer) of the aircraft or component, which issues the Service Bulletins and ICA", "The operator (airline) named on the Air Operator Certificate", "The maintenance organisation that signs the Certificate of Release to Service"], "key": "TC holder = Design Organisation (ผู้ออกแบบ/ผู้ผลิตต้นแบบ) → ออก SB / ICA ส่วน Authority เป็นคนออก AD", "exp": "Design organisations are the type certificate holders of aircraft and components. They improve their products and inform owners/CAMOs through SIL and SB. The TC holder issues the service bulletin describing the action; the authority makes it mandatory by publishing the AD.", "ref": [54, 55], "also": ["Who is a TC holder? (asked 3 times)"]}, {"id": 3, "t": "p21", "q": "What is defined in Part-21?", "th": "Part-21 กำหนดเรื่องอะไร?", "o": ["Certification of aircraft, parts and appliances (initial airworthiness: type certificate, type design, design and production organisations)", "Continuing airworthiness and maintenance of aircraft in service", "Licensing and basic knowledge requirements of certifying staff"], "key": "21 = Initial (เริ่มต้น/ออกแบบ-ผลิต-รับรองแบบ) | M = Continuing | 66 = Licence", "exp": "Regulation (EU) No 748/2012 (Part-21, Initial Airworthiness) covers aeronautical products, parts and appliances that require certification. Products (aircraft, engines, propellers) require a Type Certificate; all parts must comply with the Type Design.", "ref": [64, 65]}, {"id": 4, "t": "camo", "q": "Which organisation requires Airworthiness Review Staff (ARS)?", "th": "องค์กรใดต้องมี Airworthiness Review Staff (ARS)?", "o": ["A CAMO – to be approved to carry out airworthiness reviews and issue the ARC", "A Part-21 production organisation (21.G)", "A Part-147 maintenance training organisation"], "key": "ARS = คนทำ Airworthiness Review ออก ARC → อยู่ใน CAMO (5 ปีประสบการณ์ ถ้า >2730 kg/สายการบิน)", "exp": "M.A.707: to be approved to carry out airworthiness reviews, a CAMO shall have appropriate airworthiness review staff (ARS) to issue ARCs. (A Part-145 organisation can also have ARS, but only for Part-ML aircraft – p.206.)", "ref": [118, 111]}, {"id": 5, "t": "pm", "q": "Part-M and Part-ML …?", "th": "Part-M และ Part-ML …?", "o": ["Both regulate continuing airworthiness; Part-ML is for non-complex aircraft (<2730 kg, rotorcraft <1200 kg, other ELA2) not operated by an air carrier with AOC", "Both regulate initial airworthiness; Part-ML applies only to large aircraft", "Both regulate air operations; Part-ML applies only to non-commercial flights"], "key": "M = Continuing A/W ทั่วไป | ML = Light (เครื่องเบาไม่ซับซ้อน, ไม่ใช่สายการบินที่มี AOC)", "exp": "Part-M defines the philosophy, criteria and requirements for continuing airworthiness. Part-ML regulates the continuing airworthiness of aircraft which are not technically complex (<2730 kg, rotorcraft <1200 kg with max 4 occupants, other ELA2), if not operated by an air carrier with AOC.", "ref": [80, 144]}, {"id": 6, "t": "pm", "q": "Who is responsible that the maintenance is carried out in accordance with the maintenance programme (commercial aircraft)?", "th": "ใครรับผิดชอบให้การซ่อมบำรุงเป็นไปตามโปรแกรมซ่อมบำรุง (เครื่องพาณิชย์)?", "o": ["The owner/operator – for air carriers, the operator (through its CAMO), M.A.201", "The pilot-in-command", "The certifying staff of the Part-145 organisation alone"], "key": "M.A.201: Owner/Operator รับผิดชอบ Continuing A/W (สายการบิน = Operator + CAMO) | นักบิน = pre-flight เท่านั้น", "exp": "M.A.201(a): the owner is responsible for continuing airworthiness and must ensure that no flight takes place unless maintenance is performed per the approved maintenance programme (M.A.302). M.A.201(e): for air carriers the operator is responsible and shall be approved as CAMO within its AOC.", "ref": [82, 84, 90]}, {"id": 7, "t": "camo", "q": "Who needs a CAMO as part of their organisation approval (AOC)?", "th": "ใครต้องมี CAMO เป็นส่วนหนึ่งของการอนุมัติองค์กร (AOC)?", "o": ["Air carriers – the operator must be approved as CAMO within its AOC", "Part-145 maintenance organisations", "Private pilot-owners of ELA1 aircraft"], "key": "มี AOC (สายการบิน) = ต้องมี CAMO ใน AOC ของตัวเอง และใช้ Part-145 ของตัวเองหรือที่ทำสัญญา", "exp": "M.A.201(e): in case of air carriers the operator is responsible for continuing airworthiness and shall be approved as CAMO within his AOC and perform all maintenance by his own or a contracted Part-145 organisation.", "ref": [84]}, {"id": 8, "t": "pm", "q": "What is the reference for the maintenance procedures / job cards / task cards to be carried out on a commercial aircraft?", "th": "เอกสารอ้างอิงของ procedure / job card / task card ที่ใช้กับเครื่องพาณิชย์คืออะไร?", "o": ["The current applicable maintenance data (e.g. AMM / ICA from the TC holder) – work cards transcribe it or refer precisely to it", "The Aircraft Flight Manual (AFM)", "The operator’s Minimum Equipment List (MEL)"], "key": "Job card ต้องอ้าง 'maintenance data' (AMM/ICA) • AMP = ทำอะไร/เมื่อไร, AMM = ทำอย่างไร", "exp": "M.A.401: maintenance must use only applicable current maintenance data (ADs, ICA from TC/STC holders, 145.A.45(d) documents). A work card or worksheet system shall transcribe the data accurately or make precise reference to the maintenance task in that data. The AMM is the approved manual describing how to perform maintenance.", "ref": [100, 53, 91], "note": "Wording is open: if the bank’s answer is the ‘approved maintenance programme (AMP)’, that defines WHAT/WHEN (M.A.302, p.91–93); the job card steps come from the maintenance data."}, {"id": 9, "t": "pm", "q": "In which part of Regulation (EU) 1321/2014 is continuing airworthiness described?", "th": "Regulation (EU) 1321/2014 ส่วนใดอธิบายเรื่อง continuing airworthiness?", "o": ["Annex I – Part-M", "Annex III – Part-66", "Annex II – Part-145"], "key": "1321/2014: Annex I = Part-M (Continuing A/W) • II = 145 • III = 66 • IV = 147", "exp": "IR (EU) 1321/2014 Continuing Airworthiness: Annex I Part-M, Annex II Part-145, Annex III Part-66, Annex IV Part-147 (plus Part-CAMO, Part-ML, Part-CAO). Part-M defines the requirements for continuing airworthiness.", "ref": [79, 80], "also": ["In which annex/part, the continuing airworthiness requirements are defined?"]}, {"id": 10, "t": "pm", "q": "Which EU regulation requires that large aircraft must be maintained in a Part-145 maintenance organisation?", "th": "กฎระเบียบ EU ฉบับใดกำหนดว่าเครื่องบินขนาดใหญ่ต้องซ่อมบำรุงในองค์กร Part-145?", "o": ["Regulation (EU) 1321/2014 – Part-M, M.A.201(g)", "Regulation (EU) 748/2012 – Part-21", "Regulation (EU) 965/2012 – Air Operations"], "key": "Large aircraft / commercial → Part-145 เสมอ (M.A.201(g)) อยู่ใน IR 1321/2014", "exp": "M.A.201(g): maintenance of large aircraft, aircraft used for commercial operation and components thereof shall be carried out by a Part-145 approved maintenance organisation.", "ref": [85]}, {"id": 11, "t": "misc", "q": "What does the abbreviation AD stand for?", "th": "AD ย่อมาจากอะไร?", "o": ["Airworthiness Directive", "Aircraft Deficiency", "Approved Design"], "key": "AD = คำสั่งบังคับจาก Authority • SB = ข้อเสนอจาก TC holder", "exp": "An Airworthiness Directive contains mandatory measures if a defect restricting airworthiness is found after certification. The authority makes the SB mandatory by publishing the AD.", "ref": [55, 299], "also": ["What does the abbreviation AD stand for? (asked 3 times)"]}, {"id": 12, "t": "misc", "q": "What is ACAM?", "th": "ACAM คืออะไร?", "o": ["Aircraft Continuing Airworthiness Monitoring – random checks of registered aircraft by authority airworthiness inspectors, in addition to the annual airworthiness review", "Approved Certification Authorisation for Maintenance – the company authorisation of certifying staff", "Annual Component Acceptance Method – inspection of components in the stores"], "key": "ACAM = สุ่มตรวจโดย NAA (แจ้ง/ไม่แจ้งล่วงหน้า) • เพิ่มเติมจาก ARC ประจำปี", "exp": "Airworthiness inspectors randomly select aircraft from the national register and check their airworthy condition, maintenance records, regulatory compliance and safety. These inspections are in addition to the annual airworthiness reviews and may be announced or unannounced.", "ref": [283, 45, 299], "also": ["What is ACAM? (asked 3 times)"]}, {"id": 13, "t": "pm", "q": "Every aircraft’s airworthiness is checked once a year …?", "th": "ความสมควรเดินอากาศของอากาศยานทุกลำถูกตรวจปีละครั้งโดย …?", "o": ["By an airworthiness review – the resulting ARC (Form 15) is valid for one year", "By an ACAM inspection – every aircraft is inspected every year by the authority", "By a C-check carried out in base maintenance"], "key": "Airworthiness Review → ARC อายุ 1 ปี (CAMO ต่อได้ 2 ครั้งใน controlled environment) • ACAM = สุ่ม", "exp": "M.A.901: an airworthiness review certificate is issued after a satisfactory airworthiness review; the ARC is valid one year. ACAM selects aircraft randomly and is in addition to the annual review.", "ref": [135, 283]}, {"id": 14, "t": "fw", "q": "Are aircraft used for military purposes subject to EASA regulations in accordance with Basic Regulation 2018/1139?", "th": "อากาศยานที่ใช้ทางทหารอยู่ภายใต้กฎ EASA ตาม Basic Regulation 2018/1139 หรือไม่?", "o": ["No – the Basic Regulation does not apply to military, customs, police, search & rescue, firefighting, border/coast guard activities under Member State control", "Yes – all aircraft in the EU, including military aircraft, must comply", "Yes, but only for their maintenance, not for their design"], "key": "2018/1139 ไม่ครอบคลุม: ทหาร ศุลกากร ตำรวจ SAR ดับเพลิง ชายแดน (ทหารใช้ EMAR/DEMAR แทน)", "exp": "Regulation (EU) 2018/1139 does not apply to aircraft used for military, customs, police, search and rescue, fire-fighting, border control and coast guard or similar activities carried out under the control and responsibility of a Member State.", "ref": [15, 16, 289], "also": ["Asked 3 times"]}, {"id": 15, "t": "misc", "q": "The CMM is …?", "th": "CMM คือ …?", "o": ["The Component Maintenance Manual – issued by the component manufacturer (OEM); the working instruction for Part-145 ‘C’ organisations", "The Continuing Maintenance Method – the operator’s own maintenance programme", "The Certification and Maintenance Manual – issued by the national authority"], "key": "CMM = Component Maintenance Manual จาก OEM → ใช้ใน shop (145 Class C)", "exp": "The CMM describes the maintenance tasks, intervals and other information for subassemblies or components (LRU). It is usually issued by the component manufacturer (OEM) and is the working instruction for the maintenance (145 ‘C’) organisation.", "ref": [304, 59]}, {"id": 16, "t": "misc", "q": "What does the abbreviation NDT stand for?", "th": "NDT ย่อมาจากอะไร?", "o": ["Non-Destructive Testing (e.g. X-ray, dye penetrant, eddy current, ultrasonic)", "Non-Deferred Task", "Nominated Duty Technician"], "key": "NDT = Non-Destructive Testing (ตรวจโดยไม่ทำลายชิ้นงาน) • มาตรฐาน DIN EN 4179", "exp": "Non-destructive testing is an examination of components or parts for quality and structure that does not damage or impair them; regulated in the international standard DIN EN 4179. Examples: X-ray, dye penetrant, eddy current, ultrasonic.", "ref": [314], "also": ["Asked 3 times"]}, {"id": 17, "t": "p145", "q": "What is the approval classification of a Part-145 maintenance organisation performing component maintenance?", "th": "องค์กร Part-145 ที่ซ่อมบำรุงชิ้นส่วน (component) ได้รับการอนุมัติในคลาสใด?", "o": ["Class C (C1–C22: components other than complete engines or APUs)", "Class A (aircraft)", "Class D (specialised services such as NDT)"], "key": "A = Aircraft • B = Engines/APU • C = Components • D = Specialised (NDT)", "exp": "Part-145 approval classes: A Aircraft (A1 >5700 kg, A2 <5700 kg, A3 helicopter, A4 other), B Engines (B1 turbine, B2 piston, B3 APU), C Components other than complete engines or APUs (C1–C22), D Specialised services (D1 NDT).", "ref": [185, 186], "also": ["Asked 2 times"]}, {"id": 18, "t": "camo", "q": "A Combined Airworthiness Organisation (CAO) …?", "th": "Combined Airworthiness Organisation (CAO) …?", "o": ["Is responsible for continuing airworthiness AND is authorised to perform maintenance (non-complex aircraft, Part-CAO)", "Only manages continuing airworthiness and must contract all maintenance to a Part-145 organisation", "Only produces new parts and issues EASA Form 1 under Part-21"], "key": "CAO = CAMO + Maintenance ในองค์กรเดียว (เครื่องไม่ซับซ้อน เช่น ELA1/ELA2)", "exp": "A CAO is a combined organisation responsible for the continuing airworthiness of aircraft and authorised to perform maintenance. It is regulated in Regulation (EU) 1321/2014, Part-CAO.", "ref": [303, 178, 179]}, {"id": 19, "t": "p145", "q": "What must a maintenance organisation demonstrate as part of its approval certificate to maintain aircraft or components?", "th": "องค์กรซ่อมบำรุงต้องแสดงอะไรเป็นส่วนหนึ่งของใบอนุมัติเพื่อซ่อมบำรุงอากาศยานหรือชิ้นส่วน?", "o": ["Its scope of work – approval classes/ratings and limitations, listed in the exposition (Capability List)", "That it holds an Air Operator Certificate for commercial air transport", "That it holds an Airworthiness Review Certificate for every aircraft it maintains"], "key": "145.A.20 Terms of approval = Scope of work ใน MOE (Capability List) / Class-Rating", "exp": "145.A.20: the organisation shall specify the scope of work deemed to constitute approval in its exposition → Capability List (approval classes A–D with categories and limitations).", "ref": [185, 186], "note": "The bank wording is short; ‘scope of work / capability’ is the book’s answer for the terms of approval."}, {"id": 20, "t": "p145", "q": "Who must be notified of safety issues or safety-relevant events related to the technical condition of the aircraft that are discovered during maintenance?", "th": "ต้องแจ้งใครเมื่อพบปัญหาความปลอดภัยหรือเหตุการณ์ที่เกี่ยวกับสภาพทางเทคนิคของอากาศยานระหว่างซ่อมบำรุง?", "o": ["The competent authority, the design approval holder, and the CAMO/operator (or the requester for components) – within 72 hours", "Only the Accountable Manager of the maintenance organisation (internal report)", "Only the Part-147 training organisation"], "key": "145.A.60 → รายงานภายใน 72 ชม.: NAA + Design org (TC holder) + CAMO/ผู้สั่งงาน", "exp": "145.A.60(b): report to the competent authority and to the design approval holder; (c) also to the CAMO for aircraft, or to the person who requested maintenance for components; as soon as practicable but within 72 hours of discovery.", "ref": [224, 225]}, {"id": 21, "t": "p145", "q": "What is line maintenance according to Part-145?", "th": "Line maintenance ตาม Part-145 คืออะไร?", "o": ["Maintenance in between flight operations: troubleshooting/defect rectification, minor structural repairs, scheduled checks below C-check, LRU and life-limited part exchange, minor modifications, servicing", "Major structural repairs, C-check and higher, major modifications and retrofits", "Work on components off the aircraft in a component shop according to the CMM"], "key": "Line = ระหว่างเที่ยวบิน (< C-check) • Base = C-check ขึ้นไป/major • Component = ใน shop (CMM) • Pre-flight = หน้าที่ operator", "exp": "Line maintenance: maintenance measures between flight operations to ensure airworthiness. The pre-flight inspection is an exception – it is the operator’s responsibility.", "ref": [57, 311]}, {"id": 22, "t": "ics", "q": "What is the maximum weight of an aircraft that an independent certifying staff (ICS) can approve?", "th": "ICS อนุมัติ (ARC/CRS) อากาศยานที่มีน้ำหนักสูงสุดเท่าใด?", "o": ["2,730 kg MTOM (rotorcraft up to 1,200 kg with max 4 occupants; other ELA2 such as gliders/balloons)", "5,700 kg MTOM", "1,200 kg MTOM for all aircraft types"], "key": "ICS: เครื่อง ≤ 2,730 kg • ฮ. ≤ 1,200 kg (≤4 ที่นั่ง) • ELA2 อื่น ๆ (ร่อน/บอลลูน)", "exp": "ICS may issue the ARC (ML.A.903) for aircraft with MTOM of 2730 kg or less, rotorcraft with MTOM 1200 kg or less certified for up to four occupants, and other ELA2 aircraft such as gliders or balloons.", "ref": [277], "also": ["Asked 3 times"]}, {"id": 23, "t": "ics", "q": "What documents may be created or prepared and signed by an independent certifying staff (ICS)?", "th": "ICS สามารถจัดทำและลงนามเอกสารใดได้บ้าง?", "o": ["The CRS (ML.A.801) and the Airworthiness Review Certificate (ARC, Form 15c, ML.A.903) for aircraft within the ICS scope", "EASA Form 1 for any component and Form 52 for new aircraft", "An Air Operator Certificate and a Certificate of Airworthiness"], "key": "ICS เซ็นได้: CRS (ML.A.801) + ARC Form 15c (ML.A.903) + ทบทวน maintenance programme", "exp": "ICS may issue the CRS for the above aircraft in accordance with ML.A.801, carry out the airworthiness review and issue the ARC (Form 15c) per ML.A.903, and review the maintenance programme.", "ref": [276, 277]}, {"id": 24, "t": "ics", "q": "What does ICS stand for?", "th": "ICS ย่อมาจากอะไร?", "o": ["Independent Certifying Staff", "Inspection and Certification System", "Internal Control Supervisor"], "key": "ICS = Independent Certifying Staff (ทำงานในนามตัวเอง ไม่ใช่ในนามองค์กร 145)", "exp": "“Independent certifying staff” does not work on behalf of an approved maintenance organisation but meets the requirements of Part-66 for the related aircraft group.", "ref": [276, 145], "also": ["Asked 3 times"]}, {"id": 25, "t": "ics", "q": "What minimum qualification requirements must independent certifying staff (ICS) meet?", "th": "ICS ต้องมีคุณสมบัติขั้นต่ำอะไร?", "o": ["A valid Part-66 licence for the aircraft concerned (or a national maintenance qualification if Part-66 is not applicable), plus a satisfactory airworthiness review under NAA supervision", "Any Part-147 course certificate – no licence is needed", "Employment in a Part-145 organisation with a Category C licence"], "key": "ICS = Part-66 AML ที่ตรงกับเครื่อง (หรือ national) + ผ่าน airworthiness review ภายใต้การดูแลของ NAA", "exp": "ICS shall hold a valid licence per Annex III (Part-66) for the aircraft concerned or, if Annex III is not applicable, a national qualification. Approval is issued after a satisfactory airworthiness review under supervision of the national authority; it is limited by Part-ML and the aircraft scope on the licence.", "ref": [276], "also": ["Asked 2 times"]}, {"id": 26, "t": "misc", "q": "Which organisation has to fulfil the requirements of Regulation 965/2012, Part-CAT?", "th": "องค์กรใดต้องปฏิบัติตามข้อกำหนดของ Regulation 965/2012 Part-CAT?", "o": ["The air operator (airline) conducting commercial air transport, holding an AOC", "A Part-145 maintenance organisation", "A Part-21 design organisation"], "key": "965/2012 = Air Ops → ผู้ประกอบการ/สายการบิน (CAT = รับจ้างขนส่ง ต้องมี AOC)", "exp": "Regulation (EU) 965/2012 specifies the requirements for the operators (airlines), especially commercial air transport (Part-CAT). The operator holds an approved organisation and an AOC.", "ref": [73, 74, 76, 314]}, {"id": 27, "t": "misc", "q": "MEL stands for …?", "th": "MEL ย่อมาจาก …?", "o": ["Minimum Equipment List", "Maintenance Evaluation Level", "Mandatory Equipment Log"], "key": "MEL = Minimum Equipment List (ทำให้บินต่อได้ในขณะมีข้อบกพร่อง มีเวลาจำกัด) • MMEL ออกโดย design org", "exp": "The MEL describes possibilities for continued operation with a technical defect and its time limits. The MMEL is issued by the design organisation; the MEL must contain at least the restrictions of the MMEL.", "ref": [311, 312, 102], "also": ["Asked 2 times"]}, {"id": 28, "t": "pm", "q": "The commercial aircraft operator is responsible for the proper performance … by himself?", "th": "ผู้ประกอบการเครื่องพาณิชย์ต้องรับผิดชอบการปฏิบัติ … ด้วยตนเอง?", "o": ["Of the pre-flight inspection (it need not be done by a Part-145 organisation or Part-66 certifying staff)", "Of all base maintenance checks on the aircraft", "Of issuing the Airworthiness Review Certificate"], "key": "Pre-flight inspection = หน้าที่ PIC/Operator (M.A.201(d)) ไม่ต้องใช้ 145 หรือ certifying staff", "exp": "M.A.201(d): the pilot-in-command or, in the case of air carriers, the operator shall be responsible for the satisfactory accomplishment of the pre-flight inspection. It must be carried out by the pilot or another qualified person but need not be carried out by an approved maintenance organisation or Part-66 certifying staff.", "ref": [84, 57], "also": ["Asked 2 times"]}, {"id": 29, "t": "p21", "q": "Which EASA regulation defines the type design and certification?", "th": "กฎระเบียบ EASA ฉบับใดกำหนดเรื่อง type design และการรับรอง?", "o": ["Regulation (EU) 748/2012 – Part-21", "Regulation (EU) 1321/2014 – Part-M", "Regulation (EU) 965/2012 – Air Operations"], "key": "748/2012 = Part-21 = Initial airworthiness (Type design, TC, 21.J, 21.G)", "exp": "Products require a type certificate as defined in IR EU 748/2012 (Part-21). Parts and equipment must comply with the regulatory requirements = Type Design.", "ref": [64, 65]}, {"id": 30, "t": "p21", "q": "Which authority approves a development (design) organisation in the European Union?", "th": "หน่วยงานใดอนุมัติองค์กรออกแบบ/พัฒนาใน EU?", "o": ["EASA", "The NAA of the country where the organisation is located", "ICAO"], "key": "Design org (21.J) = EASA อนุมัติเอง (exclusive competence) • Production/Maintenance = NAA", "exp": "In the EU, EASA is responsible for approving design organisations and type-certifying aircraft. EASA also approves and monitors design organisations and their products.", "ref": [66, 12], "also": ["Asked 3 times"]}, {"id": 31, "t": "p145", "q": "During an audit by the authority, significant deficiencies were identified in the Part-145 organisation. In what time frame must corrective action be initiated?", "th": "ในการตรวจสอบโดยหน่วยงาน พบข้อบกพร่องสำคัญในองค์กร 145 ต้องเริ่มแก้ไขภายในเวลาเท่าใด?", "o": ["Immediately (Level 1 finding)", "Within 3 months (this is the Level 2 finding)", "Within 12 months or at the next audit"], "key": "Level 1 (significant) = ทันที • Level 2 = ภายใน 3 เดือน", "exp": "Level 1: any significant non-compliance which lowers the safety standard or seriously hazards flight safety → immediate corrective action. Level 2: non-compliance which could lower the safety standard → corrective action within 3 months. After a finding the organisation must identify root cause, define an action plan and demonstrate implementation (145.A.95).", "ref": [45, 231]}, {"id": 32, "t": "p145", "q": "An internal system audit has identified a nonconformity in a department. Who is responsible for arranging the necessary corrective action?", "th": "การตรวจสอบภายในพบ nonconformity ในแผนกหนึ่ง ใครรับผิดชอบจัดการให้เกิดการแก้ไข?", "o": ["The Accountable Manager (compliance monitoring reports findings to him to ensure effective corrective action; the responsible department implements it)", "The Compliance Manager alone – he must carry out the correction himself", "The competent authority (NAA)"], "key": "AM = ผู้รับผิดชอบสูงสุด/จัดสรรทรัพยากร • Compliance Mgr = ตรวจ+ติดตาม • แผนกที่เกี่ยวข้อง = ลงมือแก้", "exp": "145.A.200: compliance monitoring includes a feedback system of findings to the AM to ensure effective implementation of corrective actions. The Compliance Manager audits and monitors corrective actions; corrective actions are developed and implemented in a timely manner by the responsible department.", "ref": [233, 38, 37], "note": "Moderate confidence: the book assigns roles to AM (feedback/resources), Compliance Manager (monitoring) and the department (implementation). ‘Accountable Manager’ is the best fit when the options include him.", "also": ["Asked 2 times"]}, {"id": 33, "t": "p21", "q": "In which case is EASA responsible for the approval of a design organisation?", "th": "กรณีใดที่ EASA เป็นผู้รับผิดชอบอนุมัติองค์กรออกแบบ?", "o": ["Always – design organisations fall under EASA’s exclusive competence", "Only if the design organisation is located outside the EU", "Only for aircraft above 5,700 kg"], "key": "Design Organisation → EASA เสมอ (exclusive competence)", "exp": "Tasks of EASA include approval of organisations in areas where EASA has exclusive competence (e.g. design organisations). EASA approves and monitors design organisations and their products.", "ref": [12, 66], "note": "The question wording (‘in which case’) is vague; the book’s statement is that design organisations are EASA’s exclusive competence."}, {"id": 34, "t": "p66", "q": "Which authority issues the aircraft maintenance licence (AML)?", "th": "หน่วยงานใดออกใบอนุญาต AML?", "o": ["The competent authority (NAA) of a Member State", "EASA directly", "The Part-145 organisation that employs the holder"], "key": "AML = NAA ของประเทศสมาชิกเป็นผู้ออก (ยื่น Form 19) – ไม่ใช่ EASA", "exp": "The initial application is made to the competent authority of one of the Member States using EASA Form 19. The AML is only valid when issued and/or amended by the competent authority and signed by the holder.", "ref": [243, 262], "also": ["Who issues the AML? (asked 4 times)"]}, {"id": 35, "t": "fw", "q": "Which EASA regulation deals with cyber security?", "th": "กฎระเบียบ EASA ฉบับใดเกี่ยวกับ cyber security?", "o": ["Regulation (EU) 2023/203 – Part-IS (Information Security)", "Regulation (EU) 376/2014 – Occurrence reporting", "Regulation (EU) 2018/1139 – Annex on cyber defence"], "key": "Cyber = Part-IS = Reg. (EU) 2023/203 (ISMS)", "exp": "Part-IS of Implementing Regulation (EU) 2023/203 introduces requirements for identification, application and management of information security risks with potential aviation-safety implications, through an Information Security Management System (ISMS).", "ref": [297, 22], "also": ["Asked 3 times"]}, {"id": 36, "t": "p66", "q": "The required basic knowledge of Part-66 for category B1.3 includes the required basic knowledge for which category?", "th": "ความรู้พื้นฐาน Part-66 ของ B1.3 รวมความรู้ของหมวดใด?", "o": ["Category A (the corresponding A subcategory)", "Category B2", "Category C"], "key": "B1.x รวม A (subcategory ที่ตรงกัน) อัตโนมัติ • B2 ไม่รวม A", "exp": "A category B1 AML includes automatically the corresponding A subcategory. (Category B2 does not include the A subcategory.)", "ref": [246, 247], "note": "The book states the rule (B1 includes the corresponding A subcategory); the B1.3 ↔ A3 numbering itself is in Part-66 Appendix I, not spelled out in the book."}, {"id": 37, "t": "p66", "q": "You are the holder of a Part-66 licence with an aircraft rating for Airbus A350-800. Based on this you may …?", "th": "คุณถือใบอนุญาต Part-66 ที่มี rating Airbus A350-800 จากนี้คุณสามารถ …?", "o": ["Exercise CRS privileges on the A350-800 within your licence category, once you hold a certification authorisation from a Part-145 / CAO / Part-M-F organisation", "Certify any Airbus aircraft type, such as A320 or A380, without further rating", "Certify on the A350-800 immediately in any organisation without a certification authorisation"], "key": "Rating = สิทธิ์ตามแบบเครื่อง + ต้องมี Certification Authorisation จากองค์กร (145/CAO) จึงจะเซ็น CRS ได้", "exp": "To exercise CRS privileges on an aircraft type, the AML must be endorsed with the relevant aircraft rating. The holder may not exercise privileges unless he has received a certifying authorisation per Part-M/F, CAO or Part-145 (and has 6 months’ experience in the preceding 2 years).", "ref": [263, 253]}, {"id": 38, "t": "p66", "q": "Which Part-66 certifying staff licences exist?", "th": "ใบอนุญาตบุคลากรออกใบรับรอง Part-66 มีประเภทใดบ้าง?", "o": ["A, B1, B2, B3 and C (plus L and B2L for light aircraft)", "A, B, C and D only", "A1, A2, B1, B2, C1 and C2 only"], "key": "A • B1 • B2 • B3 • C (+ L, B2L)", "exp": "66.A.3 licence categories: A, B1, B2, B3, C. Category B2L (limited avionics) and Category L (sailplanes, balloons, airships, light aeroplanes) are further categories.", "ref": [241, 248, 251]}, {"id": 39, "t": "p66", "q": "The Aircraft Maintenance Licence (AML) Category C describes the licence for the …?", "th": "AML Category C คือใบอนุญาตสำหรับ …?", "o": ["Base Maintenance Certifying Engineer – CRS after base maintenance of the complete aircraft (physical work done by B1/B2 support staff)", "Line Maintenance Certifying Mechanic", "Component certifying staff of a Part-145 ‘C’ organisation"], "key": "C = Base Maintenance Certifying Engineer (ทั้งลำ หลัง base) • A = Line Mechanic", "exp": "A category C AML permits the holder to issue CRS after base maintenance (complete airplane), with the physical work performed by support staff (CAT B1/B2), after Part-145 release authorisation.", "ref": [241, 250]}, {"id": 40, "t": "p66", "q": "What is category B2 certifying staff allowed to sign off (CRS)?", "th": "บุคลากรออกใบรับรอง Category B2 เซ็น CRS ได้ในงานอะไร?", "o": ["Maintenance on avionic and electrical systems, plus electrical/avionic tasks within powerplant and mechanical systems needing only simple tests (does not include the A subcategory)", "Maintenance on aircraft structure, powerplant and mechanical systems", "The complete aircraft after base maintenance"], "key": "B2 = Avionics + Electrical (ไม่รวม A) • B1 = Structure/Powerplant/Mech/Elec", "exp": "A category B2 AML permits the holder to issue CRS and act as B2 support staff for maintenance on avionic and electrical systems and for electrical/avionic tasks within powerplant and mechanical systems requiring only simple tests. It does not include the A subcategory.", "ref": [247]}, {"id": 41, "t": "p66", "q": "What is category B1.1 certifying staff allowed to sign off (CRS)?", "th": "บุคลากรออกใบรับรอง Category B1.1 เซ็น CRS ได้ในงานอะไร?", "o": ["Maintenance on aircraft structure, powerplant, mechanical and electrical systems, plus avionic work needing only simple tests (no troubleshooting) – includes the A subcategory", "Avionic systems including troubleshooting", "Only minor scheduled line maintenance and simple defect rectification"], "key": "B1 = โครงสร้าง + เครื่องยนต์ + กล (Mech) + ไฟฟ้า + avionics แค่ simple test • รวม A อัตโนมัติ", "exp": "A category B1 AML permits the holder to issue CRS and act as B1 support staff for maintenance on aircraft structure, powerplant and mechanical and electrical systems, and avionic work requiring only simple tests to prove serviceability and not requiring troubleshooting. It includes automatically the corresponding A subcategory.", "ref": [246]}, {"id": 42, "t": "p66", "q": "What type of aircraft requires certifying staff in subcategory B1.3?", "th": "อากาศยานประเภทใดต้องใช้บุคลากรออกใบรับรอง subcategory B1.3?", "o": ["Turbine-engine helicopters", "Turbine-engine aeroplanes", "Piston-engine aeroplanes"], "key": "B1.1 = Turbine เครื่องบิน • B1.2 = Piston เครื่องบิน • B1.3 = Turbine ฮ. • B1.4 = Piston ฮ.", "exp": "Part-66 Appendix I subcategories: B1.1 turbine aeroplanes, B1.2 piston aeroplanes, B1.3 turbine helicopters, B1.4 piston helicopters. In the book, B1.1 and B1.3 share the 5-year experience rule (turbine), B1.2/B1.4/B3 the 3-y
