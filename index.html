<title>EASA Part-66 Module 10 — Aviation Legislation | Study Site</title>

<style>
:root{
  --bg:#0b0f12; --side:#0e1418; --panel:#121a1f; --panel2:#18232a; --border:#25323a;
  --text:#e9eff1; --dim:#9db0b7; --amber:#ffb347; --amber-dim:#d39a4a; --amber-fill:#ffb347; --amber-bg:#201808; --on-amber:#1a1200;
  --cyan:#4fe0e0; --cyan-dim:#2fa8a8; --green:#4ade80; --red:#ff7b7b;
  --th-bg:#0f1e24; --ok-bg:#0f2a1b; --bad-bg:#331616; --shadow:0 1px 0 rgba(255,255,255,.03) inset;
  --fs:17px; --bar-h:0px;
}
html[data-theme="light"]{
  --bg:#f3f6f7; --side:#e8eef0; --panel:#ffffff; --panel2:#eef3f5; --border:#d0dbe0;
  --text:#14232a; --dim:#50656d; --amber:#a35d00; --amber-dim:#8a4f00; --amber-fill:#ffb347; --amber-bg:#fff3de; --on-amber:#1a1200;
  --cyan:#00747c; --cyan-dim:#0b8c95; --green:#0f7a3b; --red:#c53030;
  --th-bg:#e6f2f4; --ok-bg:#e2f5e9; --bad-bg:#fde8e8; --shadow:none;
}
html.fs0{--fs:15.5px} html.fs1{--fs:17px} html.fs2{--fs:19.5px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans','Sarabun',system-ui,sans-serif;font-size:var(--fs);line-height:1.65}
h1,h2,h3{font-family:'Chakra Petch','Sarabun',sans-serif;margin:0;line-height:1.25}
a{color:var(--cyan)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:4px}
.skip{position:absolute;left:-999px;top:8px;background:var(--amber-fill);color:var(--on-amber);padding:8px 12px;border-radius:6px;z-index:100}
.skip:focus{left:8px}
.app{display:grid;grid-template-columns:304px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);border-right:1px solid var(--border);position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;padding:18px 12px 24px;display:flex;flex-direction:column;gap:2px}
.brand{padding:4px 10px 14px}
.brand b{font-family:'Chakra Petch',sans-serif;font-size:1.05rem;color:var(--amber);display:block}
.brand span{font-size:.8rem;color:var(--dim)}
.ng{font-size:.76rem;color:var(--dim);padding:14px 10px 4px;font-weight:600}
.nav{display:flex;gap:10px;align-items:baseline;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--text);font-size:.92rem;line-height:1.35;border-left:3px solid transparent}
.nav:hover{background:var(--panel2)}
.nav[aria-current="page"]{background:var(--panel2);border-left-color:var(--cyan);color:var(--cyan)}
.nav .n{font-family:'IBM Plex Mono',monospace;font-size:.78rem;color:var(--amber-dim);min-width:1.6em}
.nav .t small{display:block;color:var(--dim);font-size:.78rem}
.nav .ck{margin-left:auto;color:var(--green);font-size:.85rem}
.sidefoot{margin-top:auto;padding:16px 10px 0;display:flex;gap:8px;flex-wrap:wrap}
.tool{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:.85rem}
.tool:hover{border-color:var(--cyan-dim)}
.appbar{display:none}
.scrim{display:none}
main{padding:30px clamp(16px,4vw,44px) 130px;min-width:0;outline:none}
.wrap{max-width:1020px;margin:0 auto}
.wrap.narrow{max-width:760px}
@media (max-width:920px){
  :root{--bar-h:54px}
  .app{grid-template-columns:1fr}
  .appbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:30;height:var(--bar-h);padding:0 12px;background:var(--side);border-bottom:1px solid var(--border)}
  .appbar .ttl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:.95rem}
  .side{position:fixed;inset:0 auto 0 0;width:min(320px,86vw);z-index:50;transform:translateX(-102%);transition:transform .2s;height:100dvh}
  body.drawer .side{transform:none}
  body.drawer .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40}
  main{padding-top:20px}
}
/* generic */
.crumb{font-size:.82rem;color:var(--dim);margin:0 0 6px}
.h-page{font-size:clamp(1.5rem,3.4vw,2.1rem);color:var(--text)}
.h-page small{display:block;font-family:'Sarabun',sans-serif;font-weight:400;font-size:.55em;color:var(--dim);margin-top:4px}
.lede{color:var(--dim);max-width:62ch;margin:10px 0 0}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px 20px;margin:0 0 14px;box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--amber-fill);color:var(--on-amber);border:0;border-radius:10px;padding:11px 20px;font-family:'Chakra Petch',sans-serif;font-weight:700;cursor:pointer;text-decoration:none;font-size:.98rem}
.btn:hover{filter:brightness(1.06)}
.btn.sec{background:transparent;color:var(--cyan);border:1px solid var(--cyan-dim)}
.btn.sec:hover{background:var(--panel2)}
.btn.big{padding:14px 26px;font-size:1.05rem;width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip,.cl{display:inline-flex;align-items:center;background:var(--panel2);border:1px solid var(--border);border-radius:999px;padding:5px 13px;font-size:.88rem;color:var(--dim);cursor:pointer;text-decoration:none}
.chip[aria-pressed="true"]{color:var(--cyan);border-color:var(--cyan-dim);background:var(--th-bg)}
.cl{color:var(--cyan);border-color:var(--cyan-dim)}
.cl:hover{background:var(--th-bg)}
.cl.q{color:var(--amber);border-color:var(--amber-dim)}
.lbl{font-size:.84rem;color:var(--dim);margin:0 0 8px;font-weight:500}
.hl{font-weight:600;color:var(--amber)}
/* home */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:20px 0}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
.stat b{display:block;font-family:'Chakra Petch',sans-serif;font-size:1.5rem;color:var(--cyan)}
.stat span{font-size:.82rem;color:var(--dim)}
.meter{height:6px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:var(--cyan);border-radius:99px}
.week h2{font-size:1.15rem;margin:26px 0 4px;color:var(--cyan)}
.week h2 small{display:block;font-family:'Sarabun',sans-serif;font-weight:400;color:var(--dim);font-size:.8em}
.day{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin:10px 0}
.day.next{border-color:var(--amber-dim);box-shadow:0 0 0 1px var(--amber-dim)}
.day.done{opacity:.72}
.dn{display:flex;flex-direction:column;align-items:center;gap:6px}
.dn b{font-family:'Chakra Petch',sans-serif;font-size:1.1rem;color:var(--amber)}
.tick{width:30px;height:30px;border-radius:8px;border:2px solid var(--border);background:var(--panel2);cursor:pointer;display:grid;place-items:center;font-size:1rem;color:transparent}
.tick[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#06210f}
.day .t-en{margin:0}
.day .t-th{margin:2px 0 8px;color:var(--dim);font-family:'Sarabun',sans-serif}
.nextflag{font-size:.78rem;color:var(--amber);font-weight:600}
details.dg{margin-top:18px}
details.dg summary{cursor:pointer;color:var(--cyan);padding:6px 0}
/* chapter */
.toolbar{position:sticky;top:var(--bar-h);z-index:20;background:var(--bg);background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);padding:10px 0;margin:14px 0 18px;border-bottom:1px solid var(--border);display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:3px}
.seg button{background:none;border:0;padding:6px 14px;border-radius:7px;cursor:pointer;font-size:.9rem;color:var(--dim)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--cyan);box-shadow:0 0 0 1px var(--cyan-dim) inset}
select.jump{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:8px 10px;max-width:100%;font:inherit;font-size:.9rem}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}
.pchip{font-family:'IBM Plex Mono',monospace;font-size:.78rem;color:var(--cyan);border:1px solid var(--cyan-dim);border-radius:6px;padding:2px 9px;background:transparent;text-decoration:none;display:inline-block}
a.pchip:hover{background:var(--th-bg)}
.diagram{overflow-x:auto}
.diagram svg{display:block;width:100%;height:auto;min-width:600px}
.sec{scroll-margin-top:calc(var(--bar-h) + 78px)}
.sec.flash{outline:2px solid var(--amber);outline-offset:3px}
.chead{margin:0 0 10px}
.cols{display:grid;gap:18px}
.cols.both{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.col p{margin:0}
.col ul{margin:0;padding-left:1.15em}
.col li{margin:0 0 .45em}
.col.en{max-width:70ch}
.col.th{font-family:'Sarabun','IBM Plex Sans',sans-serif;font-size:1.04em;line-height:1.85;background:var(--th-bg);border-radius:10px;padding:12px 14px;color:var(--text)}
.cols:not(.both) .col.th{background:none;padding:0}
.gsearch{width:100%;background:var(--panel2);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:11px 14px;font:inherit;margin:0 0 14px}
.gent .gh{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin:0 0 10px}
.gent .ab{font-family:'IBM Plex Mono',monospace;font-weight:500;color:var(--on-amber);background:var(--amber-fill);border-radius:6px;padding:1px 9px;font-size:.9rem}
.gent .gn{font-weight:600}
.gent .gnt{font-family:'Sarabun',sans-serif;color:var(--dim)}
.endbar{margin:26px 0 0;display:grid;gap:12px}
.pn{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;margin-top:10px}
.pn a{flex:1 1 220px;text-decoration:none;color:var(--text);background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px 16px}
.pn a small{display:block;color:var(--dim);font-size:.78rem}
.pn a:hover{border-color:var(--cyan-dim)}
.pn a.r{text-align:right}
/* practice */
.hub{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-top:18px}
.hub .card{display:flex;flex-direction:column;gap:10px;margin:0}
.hub h3{font-size:1.1rem;color:var(--amber)}
.hub p{margin:0;color:var(--dim);font-size:.94rem}
.hub .grow{flex:1}
.qmeta{display:flex;justify-content:space-between;gap:8px;font-size:.84rem;color:var(--dim);margin:0 0 6px}
.bar{height:6px;background:var(--panel2);border-radius:99px;overflow:hidden;margin:0 0 16px}
.bar i{display:block;height:100%;background:var(--cyan)}
.q-en{font-size:1.2rem;font-weight:600;line-height:1.45;margin:4px 0 2px;max-width:60ch}
.q-th{color:var(--dim);margin:0 0 16px;font-family:'Sarabun',sans-serif}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--panel2);border:1.5px solid var(--border);border-radius:12px;padding:13px 14px;margin:0 0 10px;cursor:pointer;line-height:1.5}
.opt:hover:not(:disabled){border-color:var(--cyan-dim)}
.opt .k{flex:0 0 auto;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-family:'IBM Plex Mono',monospace;font-size:.85rem;background:var(--panel);border:1px solid var(--border);color:var(--amber)}
.opt small{display:block;color:var(--dim);font-family:'Sarabun',sans-serif;font-size:.9em}
.opt.correct{background:var(--ok-bg);border-color:var(--green)}
.opt.wrong{background:var(--bad-bg);border-color:var(--red)}
.opt.dim{opacity:.6}
.fb{border-left:4px solid var(--amber);background:var(--amber-bg);border-radius:0 12px 12px 0;padding:14px 16px;margin:6px 0 14px}
.fb.ok{border-left-color:var(--green)}
.fb h3{font-size:1rem;margin:0 0 8px}
.fb.ok h3{color:var(--green)} .fb.no h3{color:var(--red)}
.fb .key{margin:0 0 12px;font-family:'Sarabun',sans-serif;font-size:1.05em;font-weight:500}
.fb .exp{margin:0 0 10px;color:var(--text);max-width:68ch}
.fb .note{margin:0 0 10px;color:var(--dim);font-size:.92rem;font-family:'Sarabun',sans-serif}
.refs{display:flex;gap:6px;flex-wrap:wrap}
.nextbar{position:sticky;bottom:0;padding:12px 0 calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,transparent);margin-top:10px}
.score{text-align:center;padding:28px 16px}
.score .pct{font-family:'Chakra Petch',sans-serif;font-size:3.6rem;font-weight:700;line-height:1}
.pass{color:var(--green)} .fail{color:var(--red)}
.trow{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:.95rem}
.trow:last-child{border:0}
details.sq{background:var(--panel);border:1px solid var(--border);border-radius:12px;margin:0 0 10px}
details.sq summary{cursor:pointer;padding:12px 16px;list-style:none}
details.sq summary::-webkit-details-marker{display:none}
details.sq[open] summary{border-bottom:1px solid var(--border)}
details.sq .body{padding:14px 16px}
.ans{color:var(--green);font-weight:600;margin:0 0 10px}
.also{font-size:.86rem;color:var(--dim);margin:0 0 10px}
.small{font-size:.86rem;color:var(--dim)}
.foot{margin-top:40px;font-size:.8rem;color:var(--dim)}
input[type=checkbox]{accent-color:var(--cyan);width:18px;height:18px}
.sw{display:flex;gap:10px;align-items:center;cursor:pointer;margin:6px 0 14px}
</style>
</head>

_th": "บทที่ 7 Part CAMO ตอนที่ 1 — ขอบเขต สิทธิ์ ระบบ SMS", "quiz": "—"}, {"d": 12, "task_en": "Ch.7 part 2 — CAMO records/CAME + Part CAO", "task_th": "บทที่ 7 ตอนที่ 2 — บันทึกข้อมูล/CAME และ Part CAO", "quiz": "Ch.7"}, {"d": 13, "task_en": "Ch.8 Part 145 part 1 — 145.A.10–50 (scope, facilities, personnel, certifying staff)", "task_th": "บทที่ 8 Part 145 ตอนที่ 1 — 145.A.10–50", "quiz": "—"}, {"d": 14, "task_en": "Ch.8 part 2 — 145.A.55–205 (records, MOE, changes, SMS)", "task_th": "บทที่ 8 ตอนที่ 2 — 145.A.55–205", "quiz": "Ch.8"}]}, {"title_en": "Week 3 — Certifying Staff, Oversight & Final Review", "title_th": "สัปดาห์ที่ 3 — บุคลากรออกใบรับรอง การกำกับดูแล และทบทวนก่อนสอบ", "days": [{"d": 15, "task_en": "Ch.9 Part 66 part 1 — Licence categories A/B1/B2/B3/C/L, privileges", "task_th": "บทที่ 9 Part 66 ตอนที่ 1 — ประเภทใบอนุญาตและสิทธิ์", "quiz": "—"}, {"d": 16, "task_en": "Ch.9 part 2 — Knowledge/experience requirements, endorsements, revocation", "task_th": "บทที่ 9 ตอนที่ 2 — ข้อกำหนดความรู้/ประสบการณ์ การรับรองแบบ การเพิกถอน", "quiz": "Ch.9"}, {"d": 17, "task_en": "Ch.10 Independent Certifying Staff + Ch.11 Oversight principles", "task_th": "บทที่ 10 ผู้ตรวจสอบอิสระ + บทที่ 11 หลักการกำกับดูแล", "quiz": "Ch.10-11"}, {"d": 18, "task_en": "Ch.12 Maintenance beyond EU regs + Ch.13 Cybersecurity (Part-IS)", "task_th": "บทที่ 12 การซ่อมบำรุงนอกเหนือ EU + บทที่ 13 ความปลอดภัยไซเบอร์", "quiz": "Ch.12-13"}, {"d": 19, "task_en": "Ch.14 Abbreviations & Glossary — full read-through + glossary quiz", "task_th": "บทที่ 14 อักษรย่อและศัพท์ — อ่านทั้งหมด + ทำข้อสอบศัพท์", "quiz": "Ch.14"}, {"d": 20, "task_en": "Full mixed mock exam — all 14 chapters shuffled together, simulate real exam, target ≥75%", "task_th": "ข้อสอบจำลองรวมทุกบท — สลับคำถามทั้งหมด จำลองสถานการณ์จริง เป้าหมาย ≥75%", "quiz": "Full Exam"}, {"d": 21, "task_en": "Review every wrong answer, re-read weak chapters, rest before the real exam", "task_th": "ทบทวนข้อที่ตอบผิดทั้งหมด อ่านซ้ำบทที่อ่อน พักผ่อนก่อนสอ const CHAPTERS = [{"id": 0, "title_en": "Introduction", "title_th": "บทนำ", "pages": "1–5", "sections": [{"p": "1-2", "en": "This course covers 'Luftfahrtgesetzgebung' (Aviation Legislation) — Module 10 of EASA Part-66, categories A, B1 and B2. Chapters run from 0 (Introduction) to 14 (Abbreviations/Glossary), covering the regulatory framework, definitions, Part 21 certification, Air Operations (OPS), Part M/ML continuing airworthiness, Part CAMO/CAO, Part 145, Part 66 certifying staff, independent airworthiness review staff, oversight, non-EU/military maintenance, and cybersecurity.", "th": "คอร์สนี้คือวิชา 'กฎหมายการบิน' (Aviation Legislation) — Module 10 ของ EASA Part-66 สำหรับหมวด A, B1 และ B2 เนื้อหาแบ่งเป็นบทที่ 0 (บทนำ) ถึงบทที่ 14 (อักษรย่อ/ศัพท์) ครอบคลุมกรอบกฎหมาย คำนิยาม การรับรอง Part 21 การปฏิบัติการบิน (OPS) ความสมควรเดินอากาศต่อเนื่อง Part M/ML, Part CAMO/CAO, Part 145, บุคลากรออกใบรับรอง Part 66, เจ้าหน้าที่ตรวจสอบอิสระ การกำกับดูแล การซ่อมบำรุงนอก EU/ทหาร และความปลอดภัยไซเบอร์"}, {"p": "3", "en": "Note from the training provider: in many slides, regulation paragraphs are only reproduced to emphasize the essentials — always check the full text in the official EASA Implementing Regulations for exam-critical detail.", "th": "หมายเหตุจากผู้จัดทำ: หลายสไลด์คัดลอกเฉพาะสาระสำคัญของมาตรากฎหมายเท่านั้น ควรตรวจสอบข้อความเต็มใน EASA Implementing Regulations ฉบับทางการเสมอสำหรับรายละเอียดที่ใช้สอบ"}, {"p": "4", "en": "Part-66 knowledge is graded by taxonomy Level 1–3. Level 1 = knows main elements, common terms, simple explanation. Level 2 = can explain theory, apply practically with detailed procedures, read schematics. Level 3 = can combine/apply elements comprehensively, use manufacturer instructions, interpret results and apply corrective action.", "th": "ความรู้ Part-66 แบ่งระดับ (Taxonomy) 1–3 ระดับ 1 = รู้องค์ประกอบหลัก คำศัพท์ทั่วไป อธิบายง่าย ๆ ได้ ระดับ 2 = อธิบายทฤษฎีได้ ประยุกต์ใช้ตามขั้นตอนละเอียด อ่านแผนผังได้ ระดับ 3 = ผสมผสานและประยุกต์องค์ประกอบต่าง ๆ ได้ครบถ้วน ใช้คู่มือผู้ผลิต ตีความผลและแก้ไขได้"}, {"p": "5", "en": "Module 10 knowledge-level table (IR EU 1321/2014 Annex III): M10.1 Regulatory framework (A1/B1); M10.2 Certifying staff–Maintenance (A2/B2); M10.3 Approved Maintenance Orgs (A2/B2); M10.4 Independent certifying staff (B3); M10.5 Air Operations (A1/B1); M10.6 Certification of aircraft/parts/appliances (A2/B2); M10.7 Continuing Airworthiness (A2/B2); M10.8 Oversight principles (A1/B1); M10.9 Maintenance beyond current EU regs (B1); M10.10 Cybersecurity (A1/B1).", "th": "ตารางระดับความรู้ของ Module 10 (IR EU 1321/2014 Annex III): M10.1 กรอบกฎหมาย (A1/B1); M10.2 บุคลากรออกใบรับรอง-ซ่อมบำรุง (A2/B2); M10.3 องค์กรซ่อมบำรุงที่ได้รับอนุมัติ (A2/B2); M10.4 บุคลากรตรวจสอบอิสระ (B3); M10.5 การปฏิบัติการบิน (A1/B1); M10.6 การรับรองอากาศยาน/ชิ้นส่วน/อุปกรณ์ (A2/B2); M10.7 ความสมควรเดินอากาศต่อเนื่อง (A2/B2); M10.8 หลักการกำกับดูแล (A1/B1); M10.9 การซ่อมบำรุงนอกเหนือกฎ EU ปัจจุบัน (B1); M10.10 ความปลอดภัยไซเบอร์ (A1/B1)"}], "quiz": [{"q_en": "What does the Level 1 taxonomy require the participant to do?", "q_th": "ระดับความรู้ Level 1 กำหนดให้ผู้เรียนทำอะไรได้?", "choices_en": ["Combine and apply elements in a logical, comprehensive way", "Know the main elements and explain the topic using common words and examples", "Interpret measurement results and apply corrective measures", "Apply knowledge using the manufacturer's instructions"], "choices_th": ["ผสมผสานและประยุกต์องค์ประกอบต่าง ๆ อย่างครบถ้วน", "รู้องค์ประกอบหลักและอธิบายด้วยคำง่าย ๆ และตัวอย่าง", "ตีความผลการวัดและใช้มาตรการแก้ไข", "ประยุกต์ความรู้โดยใช้คู่มือผู้ผลิต"], "a": 1}, {"q_en": "Under Module 10's knowledge-level table, what level is M10.2 (Certifying staff — Maintenance) for both A and B categories?", "q_th": "ตามตารางระดับความรู้ Module 10, M10.2 (บุคลากรออกใบรับรอง-ซ่อมบำรุง) กำหนดระดับใดสำหรับทั้ง A และ B?", "choices_en": ["Level 1 for both", "Level 2 for both", "Level 3 for both", "Level 1 for A, Level 3 for B"], "choices_th": ["ระดับ 1 ทั้งคู่", "ระดับ 2 ทั้งคู่", "ระดับ 3 ทั้งคู่", "ระดับ 1 สำหรับ A ระดับ 3 สำหรับ B"], "a": 1}, {"q_en": "Which reference to Part-66 Annex III does Chapter 3 'Definitions' correspond to?", "q_th": "บทที่ 3 'คำนิยาม' สอดคล้องกับหัวข้ออ้างอิงใดใน Part-66 Annex III?", "choices_en": ["10.1 to 10.5", "10.6 / 10.7", "10.9 only", "10.10 only"], "choices_th": ["10.1 ถึง 10.5", "10.6 / 10.7", "10.9 เท่านั้น", "10.10 เท่านั้น"], "a": 0}, {"q_en": "According to the course note, what should be done regarding regulation content reproduced in the slides?", "q_th": "ตามหมายเหตุของคอร์ส ควรทำอย่างไรกับเนื้อหากฎหมายที่คัดลอกไว้ในสไลด์?", "choices_en": ["Treat the slides as the complete legal text", "Further detail should be checked in the EASA implementing regulations", "Ignore the slides entirely", "Only the German version is authoritative"], "choices_th": ["ถือว่าสไลด์เป็นข้อความกฎหมายฉบับสมบูรณ์", "ควรตรวจสอบรายละเอียดเพิ่มเติมใน EASA implementing regulations", "ไม่ต้องสนใจสไลด์เลย", "ฉบับภาษาเยอรมันเท่านั้นที่ใช้อ้างอิงได้"], "a": 1}]}, {"id": 1, "title_en": "Basics / Regulatory Framework", "title_th": "พื้นฐาน / กรอบกฎหมาย", "pages": "6–24", "diagram": "<svg viewBox=\"0 0 780 280\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect x=\"290\" y=\"10\" width=\"200\" height=\"55\" rx=\"8\" fill=\"var(--panel2)\" stroke=\"var(--amber)\" stroke-width=\"1.5\"/>\n<text x=\"390\" y=\"30\" text-anchor=\"middle\" fill=\"var(--amber)\" font-size=\"13\" font-weight=\"600\" font-family=\"Chakra Petch, Sarabun, sans-serif\">(EU) 2018/1139</text>\n<text x=\"390\" y=\"46\" text-anchor=\"middle\" fill=\"var(--text)\" font-size=\"10\">Basic Regulation</text>\n<text x=\"390\" y=\"59\" text-anchor=\"middle\" fill=\"var(--cyan)\" font-size=\"9\">กฎระเบียบพื้นฐาน</text>\n<line x1=\"390\" y1=\"65\" x2=\"130\" y2=\"105\" stroke=\"var(--border)\" stroke-width=\"1.5\"/>\n<line x1=\"390\" y1=\"65\" x2=\"390\" y2=\"105\" stroke=\"var(--border)\" stroke-width=\"1.5\"/>\n<line x1=\"390\" y1=\"65\" x2=\"650\" y2=\"105\" stroke=\"var(--border)\" stroke-width=\"1.5\"/>\n<rect x=\"20\" y=\"105\" width=\"220\" height=\"120\" rx=\"8\" fill=\"var(--panel)\" stroke=\"var(--cyan)\" stroke-width=\"1.2\"/>\n<text x=\"130\" y=\"128\" text-anchor=\"middle\" fill=\"var(--cyan)\" font-size=\"12\" font-weight=\"600\" font-family=\"Chakra Petch, Sarabun, sans-serif\">IR (EU) 748/2012</text>\n<text x=\"130\" y=\"145\" text-anchor=\"middle\" fill=\"var(--text)\" font-size=\"10\">Initial Airworthiness</text>\n<text x=\"130\" y=\"159\" text-anchor=\"middle\" fill=\"var(--dim)\" font-size=\"9\">ความสมควรเดินอากาศเบื้องต้น</text>\n<text x=\"130\" y=\"182\" text-anchor=\"middle\" fill=\"var(--amber)\" font-size=\"10\">Annex I: Part-21</text>\n<text x=\"130\" y=\"198\" text-anchor=\"middle\" fill=\"var(--dim)\" font-size=\"9\">(certification)</text>\n<rect x=\"280\" y=\"105\" width=\"220\" height=\"120\" rx=\"8\" fill=\"var(--panel)\" stroke=\"var(--cyan)\" stroke-width=\"1.2\"/>\n<text x=\"390\" y=\"128\" text-anchor=\"middle\" fill=\"var(--cyan)\" font-size=\"12\" font-weight=\"600\" font-family=\"Chakra Petch, Sarabun, sans-serif\">IR (EU) 1321/2014</text>\n<text x=\"390\" y=\"145\" text-anchor=\"middle\" fill=\"var(--text)\" font-size=\"10\">Continuing Airworthiness</text>\n<text x=\"390\" y=\"159\" text-anchor=\"middle\" fill=\"var(--dim)\" font-size=\"9\">ความสมควรเดินอากาศต่อเนื่อง</text>\n<text x=\"390\" y=\"180\" text-anchor=\"middle\" fill=\"var(--amber)\" font-size=\"9\">Part-M · 145 · 66 · 147</text>\n<text x=\"390\" y=\"195\" text-anchor=\"middle\" fill=\"var(--amber)\" font-size=\"9\">Part-ML · CAMO · CAO · T</text>\n<rect x=\"540\" y=\"105\" width=\"220\" height=\"120\" rx=\"8\" fill=\"var(--panel)\" stroke=\"var(--cyan)\" stroke-width=\"1.2\"/>\n<text x=\"650\" y=\"128\" text-anchor=\"middle\" fill=\"var(--cyan)\" font-size=\"12\" font-weight=\"600\" font-family=\"Chakra Petch, Sarabun, sans-serif\">IR (EU) 965/2012</text>\n<text x=\"650\" y=\"145\" text-anchor=\"middle\" fill=\"var(--text)\" font-size=\"10\">Air Operations</text>\n<text x=\"650\" y=\"159\" text-anchor=\"middle\" fill=\"var(--dim)\" font-size=\"9\">การปฏิบัติการบิน</text>\n<text x=\"650\" y=\"180\" text-anchor=\"middle\" fill=\"var(--amber)\" font-size=\"9\">ARO · ORO · CAT · SPA</text>\n<text x=\"650\" y=\"195\" text-anchor=\"middle\" fill=\"var(--amber)\" font-size=\"9\">NCC · NCO · SPO</text>\n<text x=\"390\" y=\"252\" text-anchor=\"middle\" fill=\"var(--dim)\" font-size=\"10\">Hard Law (binding) ↑ — supplemented by Soft Law: AMC · GM · AltMoC</text>\n<text x=\"390\" y=\"267\" text-anchor=\"middle\" fill=\"var(--dim)\" font-size=\"9\">กฎหมายบังคับ (Hard Law) ↑ — เสริมด้วย Soft Law: AMC · GM · AltMoC</text>\n</svg>", "sections": [{"p": "7", "en": "History: national authorities (LBA, CAA, DGCA, Austro Control, ENAC, BAZL, BCAA…) trace back to ICAN (1919) → ICAO (UN, from 1944) → national authorities & ECAC (1955) → JAA (1990) → EASA (2003) and today's National Aviation Authorities (NAA) working alongside EASA.", "th": "ประวัติ: หน่วยงานระดับชาติ (LBA, CAA, DGCA, Austro Control, ENAC, BAZL, BCAA ฯลฯ) สืบย้อนไปถึง ICAN (1919) → ICAO (UN, ตั้งแต่ 1944) → หน่วยงานระดับชาติ & ECAC (1955) → JAA (1990) → EASA (2003) และปัจจุบันคือหน่วยงานการบินพลเรือนแห่งชาติ (NAA) ที่ทำงานร่วมกับ EASA"}, {"p": "8", "en": "ICAO (International Civil Aviation Organization) is a UN specialized agency, HQ in Montreal. Its mission: aviation safety, unify air traffic laws, equality between states, safe/orderly growth, aircraft development, airway/airport development, economic efficiency, and promoting international air transport. It publishes Annexes (standards).", "th": "ICAO (องค์การการบินพลเรือนระหว่างประเทศ) เป็นหน่วยงานพิเศษของ UN สำนักงานใหญ่ที่มอนทรีออล ภารกิจ: ความปลอดภัยการบิน รวมกฎหมายจราจรทางอากาศ ความเท่าเทียมระหว่างรัฐ การเติบโตอย่างปลอดภัย พัฒนาอากาศยาน พัฒนาเส้นทางบิน/สนามบิน ประสิทธิภาพทางเศรษฐกิจ และส่งเสริมการขนส่งทางอากาศระหว่างประเทศ ออกเอกสารภาคผนวก (Annexes) เป็นมาตรฐาน"}, {"p": "9-10", "en": "EU & EFTA: EFTA states (Norway, Iceland, Switzerland, Liechtenstein) participate in EASA rules without being EU members. The European Commission is the EU's executive body; it proposes legislation to the Council. EU regulations (e.g. (EU) 2018/1139) are directly applicable, binding on all persons/companies, and always take precedence over national law.", "th": "EU & EFTA: ประเทศ EFTA (นอร์เวย์ ไอซ์แลนด์ สวิตเซอร์แลนด์ ลิกเตนสไตน์) เข้าร่วมกฎของ EASA โดยไม่ได้เป็นสมาชิก EU คณะกรรมาธิการยุโรป (European Commission) เป็นองค์กรบริหารของ EU เสนอกฎหมายต่อสภา กฎระเบียบของ EU (เช่น (EU) 2018/1139) มีผลบังคับใช้โดยตรงกับทุกคน/บริษัท และมีลำดับเหนือกว่ากฎหมายภายในประเทศเสมอ"}, {"p": "11-13", "en": "EASA (European Union Aviation Safety Agency): mission = uniform aeronautical/flight standards, avoid differing regulations, common environmental rules, fair competition, highest common safety level for EU citizens, cooperation with international bodies. Tasks: oversight/support of Member States, approvals where EASA has exclusive competence, drafting implementing rules, type certification of aircraft/components, and oversight of Part-145/147/CAMO organisations based outside the EU (via BASA/MAG agreements).", "th": "EASA (สำนักงานความปลอดภัยการบินแห่งสหภาพยุโรป): ภารกิจ = มาตรฐานการบิน/ปฏิบัติการบินที่เป็นหนึ่งเดียว หลีกเลี่ยงกฎที่แตกต่างกัน กฎสิ่งแวดล้อมร่วม การแข่งขันที่เป็นธรรม ความปลอดภัยสูงสุดสำหรับประชาชน EU ความร่วมมือกับองค์กรระหว่างประเทศ หน้าที่: กำกับดูแล/สนับสนุนรัฐสมาชิก อนุมัติในส่วนที่ EASA มีอำนาจเฉพาะ ร่างกฎบังคับใช้ การรับรองแบบอากาศยาน/ชิ้นส่วน และกำกับดูแลองค์กร Part-145/147/CAMO ที่ตั้งอยู่นอก EU (ผ่านข้อตกลง BASA/MAG)"}, {"p": "14", "en": "International cooperation: the EU/EASA sign bilateral agreements with other nations. A BASA (Bilateral Aviation Safety Agreement) is for mutual recognition of certificates between the EU and a non-EU country. A Working Agreement (WA) is usually signed between EASA and a non-EU authority/organisation to regulate technical issues.", "th": "ความร่วมมือระหว่างประเทศ: EU/EASA ลงนามข้อตกลงทวิภาคีกับประเทศอื่น BASA (ข้อตกลงความปลอดภัยการบินทวิภาคี) ใช้สำหรับการยอมรับใบรับรองร่วมกันระหว่าง EU กับประเทศนอก EU ส่วน Working Agreement (WA) มักลงนามระหว่าง EASA กับหน่วยงาน/องค์กรนอก EU เพื่อกำกับประเด็นทางเทคนิค"}, {"p": "15-16", "en": "EASA Basic Regulation (EU) 2018/1139 (founded 2002, current version 2018/1139) sets objectives: high & uniform aviation safety level, common safety rules, high & uniform environmental protection. It does NOT apply to military, customs, police, search & rescue, firefighting, border/coast guard activities, historic aircraft (<1975), very small aircraft, or research aircraft under Member State control.", "th": "EASA Basic Regulation (EU) 2018/1139 (ก่อตั้งปี 2002 ฉบับปัจจุบัน 2018/1139) กำหนดวัตถุประสงค์: ระดับความปลอดภัยการบินสูงและเป็นหนึ่งเดียว กฎความปลอดภัยร่วม การคุ้มครองสิ่งแวดล้อมสูงและเป็นหนึ่งเดียว ไม่ใช้บังคับกับกิจกรรมทหาร ศุลกากร ตำรวจ ค้นหาและกู้ภัย ดับเพลิง ชายแดน/ยามชายฝั่ง อากาศยานประวัติศาสตร์ (<1975) อากาศยานขนาดเล็กมาก หรืออากาศยานวิจัยที่อยู่ภายใต้การควบคุมของรัฐสมาชิก"}, {"p": "17", "en": "An Implementing Regulation implements/regulates specific rules, is binding on all Member States. A Delegating Regulation lets EASA delegate certain tasks/powers to national authorities or recognised organisations, improving efficiency while EASA retains oversight.", "th": "Implementing Regulation ใช้บังคับ/กำกับกฎเฉพาะเรื่อง มีผลผูกพันกับรัฐสมาชิกทุกประเทศ ส่วน Delegating Regulation ให้ EASA มอบหมายงาน/อำนาจบางส่วนแก่หน่วยงานระดับชาติหรือองค์กรที่ได้รับการยอมรับ เพื่อเพิ่มประสิทธิภาพ โดย EASA ยังคงมีอำนาจกำกับดูแลอยู่"}, {"p": "18-20", "en": "Regulation structure: Basic Regulation 2018/1139 branches into Initial Airworthiness (IR 748/2012) and Continuing Airworthiness (IR 1321/2014) = 'Hard Law'. 'Soft Law' = AMC (Acceptable Means of Compliance, practical guides on how to meet requirements), GM (Guidance Material, additional explanations), and AltMoC (Alternative Means of Compliance, agreed with the NAA and reported to EASA via the 'FlexTool' database).", "th": "โครงสร้างกฎระเบียบ: Basic Regulation 2018/1139 แตกเป็น Initial Airworthiness (IR 748/2012) และ Continuing Airworthiness (IR 1321/2014) = 'Hard Law' ส่วน 'Soft Law' ได้แก่ AMC (แนวทางปฏิบัติที่ยอมรับได้ อธิบายวิธีปฏิบัติตามข้อกำหนด) GM (เอกสารแนะนำเพิ่มเติม) และ AltMoC (วิธีปฏิบัติตามทางเลือกที่ตกลงกับหน่วยงานระดับชาติ และต้องรายงานต่อ EASA ผ่านฐานข้อมูล 'FlexTool')"}, {"p": "21-22", "en": "Regulations are revised/amended regularly (new Official Journal numbers issued periodically, roughly every ~15 years for major reissues plus frequent amendments). Companies are given transitional periods to implement amendments; always check the current Official Journal version.", "th": "กฎระเบียบมีการทบทวน/แก้ไขเป็นระยะ (ออกฉบับใหม่ใน Official Journal เป็นระยะ ประมาณทุก ~15 ปีสำหรับการออกฉบับใหญ่ พร้อมการแก้ไขย่อยบ่อยครั้ง) บริษัทจะได้รับช่วงเปลี่ยนผ่านเพื่อปฏิบัติตามการแก้ไข ควรตรวจสอบฉบับปัจจุบันใน Official Journal เสมอ"}, {"p": "23", "en": "Regulation structure table: Basic Reg (EU) 2018/1139 → Initial Airworthiness IR 748/2012 (Annex I Part-21); Continuing Airworthiness IR 1321/2014 (Annex I Part-M, II Part-145, III Part-66, IV Part-147, Va Part-T, Vb Part-ML, Vc Part-CAMO, Vd Part-CAO); Air Operations IR 965/2012 (Annex I Definitions, II ARO, III ORO, IV CAT, V SPA, VI NCC, VII NCO, VIII SPO).", "th": "ตารางโครงสร้างกฎระเบียบ: Basic Reg (EU) 2018/1139 → Initial Airworthiness IR 748/2012 (Annex I Part-21); Continuing Airworthiness IR 1321/2014 (Annex I Part-M, II Part-145, III Part-66, IV Part-147, Va Part-T, Vb Part-ML, Vc Part-CAMO, Vd Part-CAO); Air Operations IR 965/2012 (Annex I คำนิยาม, II ARO, III ORO, IV CAT, V SPA, VI NCC, VII NCO, VIII SPO)"}], "quiz": [{"q_en": "What organization did EASA replace when it was founded in 2002/2003?", "q_th": "EASA เข้ามาแทนที่องค์กรใดเมื่อก่อตั้งในปี 2002/2003?", "choices_en": ["ICAO", "JAA (Joint Aviation Authorities)", "ECAC", "ICAN"], "choices_th": ["ICAO", "JAA (Joint Aviation Authorities)", "ECAC", "ICAN"], "a": 1}, {"q_en": "What is a BASA?", "q_th": "BASA คืออะไร?", "choices_en": ["A working agreement on technical issues only", "A Bilateral Aviation Safety Agreement for mutual recognition of certificates between the EU and a non-EU country", "An EASA internal audit standard", "A type of Airworthiness Directive"], "choices_th": ["ข้อตกลงด้านเทคนิคเท่านั้น", "ข้อตกลงความปลอดภัยการบินทวิภาคีเพื่อยอมรับใบรับรองร่วมกันระหว่าง EU และประเทศนอก EU", "มาตรฐานตรวจสอบภายในของ EASA", "คำสั่งความสมควรเดินอากาศประเภทหนึ่ง"], "a": 1}, {"q_en": "Regulation (EU) 2018/1139 (the Basic Regulation) does NOT apply to which of the following?", "q_th": "ข้อใดที่ Regulation (EU) 2018/1139 (Basic Regulation) ไม่มีผลบังคับใช้?", "choices_en": ["Large commercial airliners", "Military, customs, police, search & rescue and similar state activities", "Part-145 maintenance organisations", "CAMO organisations"], "choices_th": ["เครื่องบินโดยสารพาณิชย์ขนาดใหญ่", "กิจกรรมทหาร ศุลกากร ตำรวจ ค้นหาและกู้ภัย และกิจกรรมของรัฐที่คล้ายกัน", "องค์กรซ่อมบำรุง Part-145", "องค์กร CAMO"], "a": 1}, {"q_en": "What is the difference between an AMC and a GM?", "q_th": "AMC ต่างจาก GM อย่างไร?", "choices_en": ["AMC is hard law, GM is soft law", "AMC is a practical guide on how to meet requirements; GM gives additional explanations/recommendations to support interpretation", "There is no difference", "GM is only used for military aircraft"], "choices_th": ["AMC เป็น hard law ส่วน GM เป็น soft law", "AMC คือแนวทางปฏิบัติที่บอกวิธีปฏิบัติตามข้อกำหนด ส่วน GM ให้คำอธิบาย/คำแนะนำเพิ่มเติมเพื่อช่วยตีความ", "ไม่มีความแตกต่าง", "GM ใช้กับอากาศยานทหารเท่านั้น"], "a": 1}, {"q_en": "An AltMoC (Alternative Means of Compliance) must be reported to EASA via which database?", "q_th": "AltMoC ต้องรายงานต่อ EASA ผ่านฐานข้อมูลใด?", "choices_en": ["FlexTool", "EASA Form 1", "CAME", "ACAM"], "choices_th": ["FlexTool", "EASA Form 1", "CAME", "ACAM"], "a": 0}, {"q_en": "Which Implementing Regulation covers Continuing Airworthiness, containing Part-M, Part-145, Part-66, Part-147, Part-ML and Part-CAMO?", "q_th": "Implementing Regulation ใดครอบคลุมความสมควรเดินอากาศต่อเนื่อง ซึ่งมี Part-M, Part-145, Part-66, Part-147, Part-ML และ Part-CAMO?", "choices_en": ["(EU) No 748/2012", "(EU) No 1321/2014", "(EU) No 965/2012", "(EU) No 1178/2011"], "choices_th": ["(EU) No 748/2012", "(EU) No 1321/2014", "(EU) No 965/2012", "(EU) No 1178/2011"], "a": 1}, {"q_en": "Which regulation covers Initial Airworthiness and contains Part-21?", "q_th": "กฎระเบียบใดครอบคลุม Initial Airworthiness และมี Part-21 อยู่ในนั้น?", "choices_en": ["(EU) No 748/2012", "(EU) No 1321/2014", "(EU) No 965/2012", "(EU) 2018/1139 directly, no implementing rule"], "choices_th": ["(EU) No 748/2012", "(EU) No 1321/2014", "(EU) No 965/2012", "(EU) 2018/1139 โดยตรง ไม่มีกฎบังคับใช้ย่อย"], "a": 0}, {"q_en": "EU regulations, compared to national regulations of Member States, are:", "q_th": "กฎระเบียบของ EU เมื่อเทียบกับกฎหมายภายในประเทศของรัฐสมาชิกแล้ว มีลักษณะอย่างไร?", "choices_en": ["Only advisory", "Always take precedence and are directly applicable", "Only apply if adopted separately by each state", "Apply only to government agencies"], "choices_th": ["เป็นเพียงคำแนะนำ", "มีผลเหนือกว่าเสมอและบังคับใช้ได้โดยตรง", "ใช้บังคับเฉพาะเมื่อแต่ละรัฐนำไปบัญญัติเองแยกต่างหาก", "ใช้บังคับเฉพาะหน่วยงานรัฐเท่านั้น"], "a": 1}]}, {"id": 2, "title_en": "Access to the Legislation via Internet", "title_th": "การเข้าถึงกฎหมายทางอินเทอร์เน็ต", "pages": "25–31", "sections": [{"p": "26", "en": "Always use the current version of regulations from the official EASA website (www.easa.europa.eu) or ICAO (www.icao.int) — never rely on personal handouts, old training scripts or summaries that are not regularly revised. Only use documents that match the company's current quality-management (QM)-checked status.", "th": "ควรใช้กฎระเบียบฉบับปัจจุบันจากเว็บไซต์ทางการของ EASA (www.easa.europa.eu) หรือ ICAO (www.icao.int) เสมอ — อย่าใช้เอกสารส่วนตัว สคริปต์อบรมเก่า หรือสรุปที่ไม่ได้รับการปรับปรุงสม่ำเสมอ ใช้เฉพาะเอกสารที่ตรงกับสถานะที่ผ่านการตรวจสอบระบบคุณภาพ (QM) ของบริษัทเท่านั้น"}, {"p": "27-29", "en": "On the EASA website, regulations are searchable and available in all EU languages. 'Easy Access Rules' publications give an overall consolidated view of a regulation together with its related AMC/GM in one document — very useful for study and reference.", "th": "บนเว็บไซต์ EASA สามารถค้นหากฎระเบียบได้และมีให้บริการในทุกภาษาของ EU เอกสาร 'Easy Access Rules' รวมกฎระเบียบพร้อม AMC/GM ที่เกี่ยวข้องไว้ในเอกสารเดียวเพื่อภาพรวมที่ครบถ้วน — มีประโยชน์มากสำหรับการศึกษาและอ้างอิง"}, {"p": "30-31", "en": "The Official Journal of the European Union is the EU's official publication. Its 'L series' (Legislation) contains EU legislation: regulations, directives, decisions, recommendations and opinions — this is the authoritative published source of any regulation or amendment. National authorities (e.g. LBA in Germany) also publish their own national aviation law online (e.g. Luftverkehrsgesetz).", "th": "Official Journal of the European Union คือสิ่งพิมพ์ทางการของ EU ชุด 'L series' (กฎหมาย) บรรจุกฎหมาย EU ได้แก่ ระเบียบ คำสั่ง มติ คำแนะนำ และความเห็น — เป็นแหล่งอ้างอิงทางการของกฎระเบียบหรือการแก้ไขใด ๆ หน่วยงานระดับชาติ (เช่น LBA ของเยอรมนี) ก็เผยแพร่กฎหมายการบินของตนเองทางออนไลน์เช่นกัน (เช่น Luftverkehrsgesetz)"}], "quiz": [{"q_en": "Why should own handouts or old training summaries not be relied upon for regulation content?", "q_th": "เหตุใดจึงไม่ควรพึ่งพาเอกสารส่วนตัวหรือสรุปการอบรมเก่าสำหรับเนื้อหากฎระเบียบ?", "choices_en": ["They are copyrighted", "They are not revised regularly, unlike the current official regulation version", "They are only in German", "They cost money to access"], "choices_th": ["มีลิขสิทธิ์", "ไม่ได้รับการปรับปรุงสม่ำเสมอ ต่างจากฉบับกฎระเบียบทางการปัจจุบัน", "มีเฉพาะภาษาเยอรมัน", "ต้องเสียเงินเพื่อเข้าถึง"], "a": 1}, {"q_en": "What does the 'L series' of the Official Journal of the European Union contain?", "q_th": "ชุด 'L series' ของ Official Journal of the European Union บรรจุอะไร?", "choices_en": ["Only court judgments", "EU legislation: regulations, directives, decisions, recommendations and opinions", "Only aircraft accident reports", "Only national laws of Germany"], "choices_th": ["เฉพาะคำพิพากษาศาล", "กฎหมาย EU: ระเบียบ คำสั่ง มติ คำแนะนำ และความเห็น", "เฉพาะรายงานอุบัติเหตุอากาศยาน", "เฉพาะกฎหมายภายในของเยอรมนี"], "a": 1}, {"q_en": "What is the purpose of 'Easy Access Rules' publications?", "q_th": "เอกสาร 'Easy Access Rules' มีวัตถุประสงค์อะไร?", "choices_en": ["To replace the Official Journal entirely", "To give a consolidated overall view of a regulation together with its AMC/GM", "To list only military regulations", "To provide translation services only"], "choices_th": ["แทนที่ Official Journal ทั้งหมด", "ให้ภาพรวมกฎระเบียบพร้อม AMC/GM ในเอกสารเดียว", "ระบุเฉพาะกฎระเบียบทางทหาร", "ให้บริการแปลภาษาเท่านั้น"], "a": 1}]}, {"id": 3, "title_en": "Definitions", "title_th": "คำนิยาม", "pages": "32–62", "diagram": "<svg viewBox=\"0 0 760 220\" xmlns=\"http://www.w3.org/2000/svg\">\n<text x=\"380\" y=\"22\" text-anchor=\"middle\" fill=\"var(--amber)\" font-size=\"13\" font-weight=\"600\" font-family=\"Chakra Petch, Sarabun, sans-serif\">Aircraft classification by Maximum Take-Off Weight (MTOW)</text>\n<text x=\"380\" y=\"37\" text-anchor=\"middle\" fill=\"var(--dim)\" font-size=\"10\">การจำแนกอากาศยานตามน้ำหนักวิ่งขึ้นสูงสุด (MTOW)</text>\n<g font-family=\"IBM Plex Mono, monospace\">\n<rect x=\"20\" y=\"70\" width=\"80\" height=\"55\" fill=\"var(--panel)\" stroke=\"var(--cyan)\"/>\n<text x=\"60\" y=\"63\" text-anchor=\"middle\" fill=\"var(--cyan)\" font-size=\"11\" font-weight=\"600\">LSA</text>\n<text x=\"60\" y=\"100\" text-anchor=\"middle\" fill=\"var(--text)\" font-size=\"10\">≤600 kg</text>\n<text x=\"60\" y=\"150\" text-anchor=\"middle\" fill=\"var(--dim)\" font-size=\"8\">อากาศยานกีฬาเบา</text>\n<rect x=\"100\" y=\"70\" width=\"100\" height=\"55\" fill=\"var(--panel)\" stroke=\"var(--cyan)\"/>\n<text x=\"150\" y=\"63\" text-anchor=\"middle\" fill=\"var(--cyan)\" font-size=\"11\" font-weight=\"600\">ELA1</text>\n<text x=\"150\" y=\"100\" text-anchor=\"middle\" fill=\"var(--text)\" font-size=\"10\">≤1200 kg</text>\n<text x=\"150\" y=\"150\" text-anchor=\"middle\" fill=\"var(--dim)\" font-size=\"8\">อากาศยานเบายุโรป 1</text>\n<rect x=\"200\" y=\"70\" width=\"120\" height=\"55\" fill=\"var(--panel)\" stroke=\"var(--cyan)\"/>\n<text x=\"260\" y=\"63\" text-anchor=\"middle\" fill=\"var(--cyan)\" font-size=\"11\" font-weight=\"600\">ELA2</text>\n<text x=\"260\" y=\"100\" text-anchor=\"middle\" fill=\"var(--text)\" font-size=\"10\">≤2000 kg</text>\n<text x=\"260\" y=\"150\" text-anchor=\"middle\" fill=\"var(--dim)\" font-size=\"8\">อากาศยานเบายุโรป 2</text>\n<rect x=\"320\" y=\"70\" width=\"160\" height=\"55\" fill=\"var(--panel)\" stroke=\"var(--amber-dim)\"/>\n<text x=\"400\" y=\"63\" text-anchor=\"middle\" fill=\"var(--amber-dim)\" font-size=\"11\" font-weight=\"600\">Small A/C</text>\n<text x=\"400\" y=\"100\" text-anchor=\"middle\" fill=\"var(--text)\" font-size=\"10\">≤5700 kg, complex</text>\n<text x=\"400\" y=\"150\" text-anchor=\"middle\" fill=\"var(--dim)\" font-size=\"8\">อากาศยานขนาดเล็ก (ซับซ้อน)</text>\n<rect x=\"480\" y=\"70\" width=\"220\" height=\"55\" fill=\"var(--amber-bg)\" stroke=\"var(--amber)\"/>\n<text x=\"590\" y=\"63\" text-anchor=\"middle\" fill=\"var(--amber)\" font-size=\"11\" font-weight=\"600\">Large A/C</text>\n<text x=\"590\" y=\"100\" text-anchor=\"middle\" fill=\"var(--text)\" font-size=\"10\">&gt;5700 kg, &gt;19 PAX, ≥2 pilots</text>\n<text x=\"590\" y=\"150\" text-anchor=\"middle\" fill=\"var(--dim)\" font-size=\"8\">อากาศยานขนาดใหญ่</text>\n</g>\n<text x=\"380\" y=\"185\" text-anchor=\"middle\" fill=\"var(--dim)\" font-size=\"9\">Helicopters: ELA2 &lt;2000 kg (non-complex) · Large helicopter &gt;3175 kg, &gt;9 PAX, ≥2 pilots</text>\n<text x=\"380\" y=\"200\" text-anchor=\"middle\" fill=\"var(--dim)\" font-size=\"9\">เฮลิคอปเตอร์: ELA2 &lt;2000 กก. (ไม่ซับซ้อน) · เฮลิคอปเตอร์ขนาดใหญ่ &gt;3175 กก. &gt;9 ที่นั่ง นักบิน≥2</text>\n</svg>", "glossary": [{"abbr": "A/W", "term_en": "Airworthiness", "term_th": "ความสมควรเดินอากาศ", "desc_en": "Compliance with applicable aviation authority regulations that set the minimum safety level: designed/produced per approved type design, operated within specified limits, maintained per approved procedures, using approved documentation, with continuing airworthiness demonstrated by the Operator/CAMO.", "desc_th": "การปฏิบัติตามกฎระเบียบของหน่วยงานการบินที่กำหนดระดับความปลอดภัยขั้นต่ำ: ออกแบบ/ผลิตตามแบบที่ได้รับอนุมัติ ปฏิบัติการภายในขีดจำกัดที่กำหนด ซ่อมบำรุงตามขั้นตอนที่ได้รับอนุมัติ ใช้เอกสารที่ได้รับอนุมัติ และผู้ประกอบการ/CAMO ต้องแสดงให้เห็นถึงความสมควรเดินอากาศต่อเนื่อง"}, {"abbr": "ORG", "term_en": "Organisation", "term_th": "องค์กร", "desc_en": "A natural person, legal person, or part of a legal person. Different organisations can be approved under European aviation regulations, e.g. Design Org (21.J), Production Org (21.G), CAMO/CAO, Maintenance Org (Part-145), Maintenance Training Org (Part-147).", "desc_th": "บุคคลธรรมดา นิติบุคคล หรือส่วนหนึ่งของนิติบุคคล องค์กรต่าง ๆ สามารถได้รับอนุมัติภายใต้กฎระเบียบการบินยุโรป เช่น องค์กรออกแบบ (21.J) องค์กรผลิต (21.G) CAMO/CAO องค์กรซ่อมบำรุง (Part-145) องค์กรฝึกอบรมซ่อมบำรุง (Part-147)"}, {"abbr": "AM", "term_en": "Accountable Manager", "term_th": "ผู้จัดการที่รับผิดชอบ", "desc_en": "Overall responsible person for proper/safe execution of tasks within scope of the organisation approval. Duties: provide resources, establish/promote safety & quality policy, establish operational (T.O.P) prerequisites, demonstrate basic understanding of the relevant Part, establish substitution rules.", "desc_th": "ผู้รับผิดชอบโดยรวมให้งานภายในขอบเขตการอนุมัติองค์กรดำเนินไปอย่างถูกต้องและปลอดภัย หน้าที่: จัดหาทรัพยากร กำหนด/ส่งเสริมนโยบายความปลอดภัยและคุณภาพ กำหนดเงื่อนไขการปฏิบัติงาน (T.O.P) แสดงความเข้าใจพื้นฐานของ Part ที่เกี่ยวข้อง และกำหนดกฎการมอบหมายทดแทน"}, {"abbr": "CM", "term_en": "Compliance Manager (145.A.30(c))", "term_th": "ผู้จัดการฝ่ายปฏิบัติตามข้อกำหนด", "desc_en": "Independently monitors compliance: establishes an audit plan covering the whole organisation, monitors compliance with the relevant Part, gives feedback to the AM for resources/corrective actions, audits corrective actions. Audits must be systematic, planned, independent, with timely corrective action.", "desc_th": "ตรวจสอบการปฏิบัติตามข้อกำหนดอย่างเป็นอิสระ: จัดทำแผนตรวจสอบครอบคลุมทั้งองค์กร ตรวจสอบการปฏิบัติตาม Part ที่เกี่ยวข้อง ให้ข้อมูลย้อนกลับแก่ AM เพื่อจัดสรรทรัพยากร/แก้ไข และตรวจสอบมาตรการแก้ไข การตรวจสอบต้องเป็นระบบ วางแผนไว้ล่วงหน้า เป็นอิสระ และแก้ไขทันเวลา"}, {"abbr": "—", "term_en": "Safety Manager / SRB / SAG", "term_th": "ผู้จัดการความปลอดภัย / SRB / SAG", "desc_en": "Safety Manager: identifies hazards, tracks risk mitigation, reports safety performance, maintains SMS documentation. Safety Review Board (SRB): high-level committee (AM as chair) overseeing safety strategy. Safety Action Group (SAG): day-to-day working body under the SRB monitoring safety performance measures.", "desc_th": "ผู้จัดการความปลอดภัย: ระบุอันตราย ติดตามมาตรการลดความเสี่ยง รายงานผลด้านความปลอดภัย ดูแลเอกสาร SMS คณะกรรมการทบทวนความปลอดภัย (SRB): คณะกรรมการระดับสูง (มี AM เป็นประธาน) กำกับกลยุทธ์ความปลอดภัย กลุ่มปฏิบัติการความปลอดภัย (SAG): หน่วยทำงานประจำวันภายใต้ SRB ติดตามมาตรการด้านความปลอดภัย"}, {"abbr": "CS", "term_en": "Certifying Staff / Skilled / Unskilled Worker", "term_th": "บุคลากรออกใบรับรอง / ช่างฝีมือ / ผู้ฝึกงาน", "desc_en": "Certifying Staff Component (C/CS): released internally by the company for component/engine maintenance. Certifying Staff A/C (CAT A/B1/B2/C): fulfils Part-66 requirements, holds an AML, has company release authorisation. Skilled Worker: trained, works independently (e.g. NDT, painter, sheet metal). Unskilled Worker: in training, works under supervision.", "desc_th": "Certifying Staff Component (C/CS): ได้รับมอบหมายภายในบริษัทสำหรับซ่อมบำรุงชิ้นส่วน/เครื่องยนต์ Certifying Staff A/C (CAT A/B1/B2/C): ผ่านข้อกำหนด Part-66 ถือ AML และได้รับมอบหมายจากบริษัท ช่างฝีมือ (Skilled Worker): ผ่านการฝึกอบรม ทำงานอิสระ (เช่น NDT ช่างพ่นสี ช่างโลหะแผ่น) ผู้ฝึกงาน (Unskilled Worker): อยู่ระหว่างฝึก ทำงานภายใต้การควบคุมดูแล"}, {"abbr": "CS", "term_en": "Certifying Staff — Tasks", "term_th": "หน้าที่ของบุคลากรออกใบรับรอง", "desc_en": "Verify parts/components/aircraft correspond to type certificate; maintain components or aircraft; release maintenance activities after work completion (Form 1 or CRS). Required in Production (21.G) and Maintenance (Part-145, CAO, M/F) organisations for aircraft and/or components.", "desc_th": "ตรวจสอบว่าชิ้นส่วน/ส่วนประกอบ/อากาศยานตรงตามใบรับรองแบบ ซ่อมบำรุงส่วนประกอบหรืออากาศยาน ปล่อยงานซ่อมบำรุงหลังทำงานเสร็จ (Form 1 หรือ CRS) จำเป็นในองค์กรผลิต (21.G) และซ่อมบำรุง (Part-145, CAO, M/F) สำหรับอากาศยานและ/หรือชิ้นส่วน"}, {"abbr": "MOE/CAME/CAE", "term_en": "Exposition of an Organisation", "term_th": "คู่มือองค์กร (Exposition)", "desc_en": "The handbook (Exposition) gives a clear overview of the organisation and shows how it complies with required regulations; approved by the competent authority. MOE = Maintenance Organisation Exposition; CAME = Continuing Airworthiness Management Org. Exposition; CAE = Combined Airworthiness Exposition.", "desc_th": "คู่มือองค์กร (Exposition) ให้ภาพรวมที่ชัดเจนขององค์กรและแสดงวิธีปฏิบัติตามกฎระเบียบที่กำหนด ได้รับอนุมัติจากหน่วยงานที่มีอำนาจ MOE = คู่มือองค์กรซ่อมบำรุง; CAME = คู่มือองค์กรจัดการความสมควรเดินอากาศต่อเนื่อง; CAE = คู่มือองค์กรความสมควรเดินอากาศแบบผสม"}, {"abbr": "—", "term_en": "Audit & Findings", "term_th": "การตรวจสอบและข้อบกพร่อง", "desc_en": "A finding = non-compliance/deviation from approved standards. Level 1: significant non-compliance lowering safety or seriously hazarding flight safety → immediate corrective action. Level 2: non-compliance that could lower safety → corrective action within 3 months. NAA also performs ACAM (random aircraft airworthiness monitoring) and SAFA (foreign aircraft ramp checks).", "desc_th": "ข้อบกพร่อง = การไม่ปฏิบัติตาม/เบี่ยงเบนจากมาตรฐานที่ได้รับอนุมัติ ระดับ 1: ไม่ปฏิบัติตามอย่างมีนัยสำคัญที่ลดความปลอดภัยหรือเป็นอันตรายร้ายแรงต่อการบิน → ต้องแก้ไขทันที ระดับ 2: ไม่ปฏิบัติตามที่อาจลดความปลอดภัย → แก้ไขภายใน 3 เดือน หน่วยงานระดับชาติยังทำ ACAM (สุ่มตรวจความสมควรเดินอากาศ) และ SAFA (ตรวจอากาศยานต่างชาติที่ลานจอด)"}, {"abbr": "—", "term_en": "Aircraft categories & weight classes", "term_th": "ประเภทและระดับน้ำหนักอากาศยาน", "desc_en": "EASA distinguishes Aeroplane, Helicopter, Airship, Balloon. Large aircraft: MTOW>5700kg, >19 PAX, ≥2 pilots, turbine/turboprop. Small aircraft: MTOW<5700kg, >2000kg, complex, turboprop. Helicopter: MTOW>3175kg, >9 PAX, ≥2 pilots. ELA1: MTOW<1200kg non-complex. ELA2: MTOW<2000kg non-complex. LSA: max 600kg, ≤2 seats, single non-turbine engine, non-pressurised.", "desc_th": "EASA แบ่งประเภทเป็น เครื่องบิน เฮลิคอปเตอร์ เรือเหาะ บอลลูน อากาศยานขนาดใหญ่: MTOW>5700กก. ผู้โดยสาร>19 นักบิน≥2คน เทอร์ไบน์/เทอร์โบพร็อพ อากาศยานขนาดเล็ก: MTOW<5700กก. >2000กก. ซับซ้อน เทอร์โบพร็อพ เฮลิคอปเตอร์: MTOW>3175กก. ผู้โดยสาร>9 นักบิน≥2คน ELA1: MTOW<1200กก. ไม่ซับซ้อน ELA2: MTOW<2000กก. ไม่ซับซ้อน LSA: ไม่เกิน 600กก. ที่นั่ง≤2 เครื่องยนต์เดี่ยวไม่ใช่เทอร์ไบน์ ห้องโดยสารไม่ปรับความดัน"}, {"abbr": "PPA", "term_en": "Products, Parts & Appliances", "term_th": "ผลิตภัณฑ์ ชิ้นส่วน และอุปกรณ์", "desc_en": "Products = aircraft/engines/propellers with their own type certificate (TC/STC). Parts = components/assemblies of an aircraft (e.g. fuel pump = LRU; landing gear/fuselage = assembly). Appliances = equipment parts (emergency equipment, containers, etc.).", "desc_th": "ผลิตภัณฑ์ (Products) = อากาศยาน/เครื่องยนต์/ใบพัดที่มีใบรับรองแบบ (TC/STC) เป็นของตนเอง ชิ้นส่วน (Parts) = ส่วนประกอบ/ชุดประกอบของอากาศยาน (เช่น ปั๊มเชื้อเพลิง = LRU; ล้อลงจอด/ลำตัวเครื่อง = ชุดประกอบ) อุปกรณ์ (Appliances) = ชิ้นส่วนอุปกรณ์ (อุปกรณ์ฉุกเฉิน ตู้บรรจุ ฯลฯ)"}, {"abbr": "TSO/ETSO", "term_en": "Technical Standard Order", "term_th": "คำสั่งมาตรฐานทางเทคนิค", "desc_en": "Aircraft parts/components designed & approved to uniform standards (hardware or software) that can be installed in any aircraft type. TSO = FAA (USA); ETSO = European equivalent. Examples: altimeters, radio equipment, tyres, fire extinguishers, seat belts, brakes.", "desc_th": "ชิ้นส่วน/ส่วนประกอบอากาศยานที่ออกแบบและได้รับอนุมัติตามมาตรฐานเดียวกัน (ฮาร์ดแวร์หรือซอฟต์แวร์) ที่สามารถติดตั้งในอากาศยานประเภทใดก็ได้ TSO = ของ FAA (สหรัฐฯ); ETSO = มาตรฐานยุโรปที่เทียบเท่า ตัวอย่าง: เครื่องวัดระยะสูง วิทยุ ยาง ถังดับเพลิง เข็มขัดนิรภัย เบรก"}, {"abbr": "—", "term_en": "Approved Data & documents (AMM, IPC, WDM, SRM, TSM/FIM, RDAS, TLB, AD, SB)", "term_th": "เอกสารที่ได้รับอนุมัติ", "desc_en": "Design orgs (and sometimes authorities) issue Instructions for Continued Airworthiness (ICA): AMM (Aircraft Maintenance Manual), IPC (Illustrated Parts Catalog), WDM (Wiring Diagram Manual), SRM (Structural Repair Manual), TSM/FIM (Trouble-shooting/Fault Isolation Manual), RDAS (repairs beyond SRM), TLB (Technical Logbook), plus Job Cards, AD (mandatory) and SB (proposed improvement) from the design organisation.", "desc_th": "องค์กรออกแบบ (และบางครั้งหน่วยงานทางการ) ออกเอกสารคำแนะนำความสมควรเดินอากาศต่อเนื่อง (ICA): AMM (คู่มือซ่อมบำรุงอากาศยาน) IPC (แคตตาล็อกชิ้นส่วนพร้อมภาพ) WDM (คู่มือแผนผังสายไฟ) SRM (คู่มือซ่อมโครงสร้าง) TSM/FIM (คู่มือแก้ไขปัญหา) RDAS (ซ่อมนอกเหนือ SRM) TLB (สมุดบันทึกทางเทคนิค) รวมถึง Job Card, AD (บังคับ) และ SB (ข้อเสนอปรับปรุง) จากองค์กรออกแบบ"}, {"abbr": "SB/SIL", "term_en": "Service Bulletin & Service Information Letter", "term_th": "Service Bulletin และ Service Information Letter", "desc_en": "Design organisations continuously improve products; owners/CAMOs are informed via SILs (general info) and SBs (propose technical improvements/inspections with planning, material and implementation info). Implementation is normally decided by the owner/operator/CAMO — UNLESS the SB is safety-critical, in which case the authority issues a mandatory AD.", "desc_th": "องค์กรออกแบบปรับปรุงผลิตภัณฑ์อย่างต่อเนื่อง เจ้าของ/CAMO ได้รับแจ้งผ่าน SIL (ข้อมูลทั่วไป) และ SB (เสนอการปรับปรุงทางเทคนิค/การตรวจสอบ พร้อมข้อมูลการวางแผน วัสดุ และการดำเนินการ) การนำไปปฏิบัติปกติขึ้นอยู่กับดุลยพินิจของเจ้าของ/ผู้ประกอบการ/CAMO — เว้นแต่ SB นั้นสำคัญต่อความปลอดภัย ซึ่งหน่วยงานจะออก AD บังคับ"}, {"abbr": "AD", "term_en": "Airworthiness Directive", "term_th": "คำสั่งความสมควรเดินอากาศ", "desc_en": "Contains mandatory measures when a defect/deficiency is found after certification that affects airworthiness (inspections, repairs, etc.). TC holder issues an SB describing the action; the authority makes it mandatory by publishing the AD. Aircraft may only return to service once the AD/SB has been completed and reported to the authority; ADs from non-EASA authorities also apply if applicable.", "desc_th": "บรรจุมาตรการบังคับเมื่อพบข้อบกพร่องหลังการรับรองแบบที่กระทบต่อความสมควรเดินอากาศ (การตรวจสอบ ซ่อมแซม ฯลฯ) เจ้าของใบรับรองแบบออก SB อธิบายการดำเนินการ หน่วยงานทำให้เป็นข้อบังคับโดยประกาศ AD อากาศยานจะกลับมาให้บริการได้เมื่อดำเนินการตาม AD/SB เสร็จและรายงานต่อหน่วยงานแล้วเท่านั้น AD จากหน่วยงานอื่นที่ไม่ใช่ EASA ก็มีผลบังคับใช้เช่นกันหากเกี่ยวข้อง"}, {"abbr": "CAT", "term_en": "Commercial Air Transport & Specialised Operations", "term_th": "การขนส่งทางอากาศเชิงพาณิชย์และปฏิบัติการเฉพาะทาง", "desc_en": "Commercial Air Transport = carriage of passengers/cargo/mail for remuneration. Specialised operations include agriculture, construction, photography, surveying, observation/patrol, aerial advertisement.", "desc_th": "การขนส่งทางอากาศเชิงพาณิชย์ = การขนส่งผู้โดยสาร/สินค้า/ไปรษณีย์เพื่อค่าตอบแทน ปฏิบัติการเฉพาะทาง ได้แก่ เกษตรกรรม ก่อสร้าง ถ่ายภาพ สำรวจ สังเกตการณ์/ลาดตระเวน โฆษณาทางอากาศ"}, {"abbr": "LM/BM/CM", "term_en": "Line, Base & Component Maintenance", "term_th": "การซ่อมบำรุงระดับลาน ระดับฐาน และระดับชิ้นส่วน", "desc_en": "Line Maintenance: between flights — defect rectification, minor structural repairs, <C-Check inspections, LRU/lifetime-limited part exchange, minor mods, servicing (pre-flight inspection is the operator's responsibility, not line maintenance). Base Maintenance: major structural repairs, C-Check & higher, major mods/ADs, retrofits. Component Maintenance: off-wing shop work per CMM — troubleshooting, SRU replacement, scheduled maintenance, repairs, testing.", "desc_th": "การซ่อมบำรุงระดับลาน (Line): ระหว่างเที่ยวบิน — แก้ไขข้อบกพร่อง ซ่อมโครงสร้างเล็กน้อย ตรวจสอบต่ำกว่า C-Check เปลี่ยน LRU/ชิ้นส่วนอายุจำกัด ดัดแปลงเล็กน้อย งานบริการ (การตรวจก่อนบินเป็นความรับผิดชอบของผู้ประกอบการ ไม่ใช่งานซ่อมบำรุงระดับลาน) การซ่อมบำรุงระดับฐาน (Base): ซ่อมโครงสร้างใหญ่ C-Check ขึ้นไป ดัดแปลงใหญ่/AD การปรับปรุงย้อนหลัง การซ่อมบำรุงชิ้นส่วน (Component): งานในโรงซ่อมนอกเครื่องตาม CMM — แก้ไขปัญหา เปลี่ยน SRU ซ่อมบำรุงตามกำหนด ซ่อมแซม ทดสอบ"}, {"abbr": "SMS", "term_en": "Safety Management System", "term_th": "ระบบการจัดการความปลอดภัย", "desc_en": "A proactive system per Reg. (EU) 376/2014 that identifies hazards, assesses risks, takes action to reduce them to an acceptable level, and reviews effectiveness continuously. Safety Culture components: information culture, knowledge sharing, open communication, error culture (learn from mistakes without blame, except gross negligence/intent/criminal acts), reporting culture (incl. anonymous reports), learning culture.", "desc_th": "ระบบเชิงรุกตาม Reg. (EU) 376/2014 ที่ระบุอันตราย ประเมินความเสี่ยง ดำเนินมาตรการลดความเสี่ยงให้อยู่ในระดับที่ยอมรับได้ และทบทวนประสิทธิผลอย่างต่อเนื่อง องค์ประกอบวัฒนธรรมความปลอดภัย: วัฒนธรรมข้อมูล การแบ่งปันความรู้ การสื่อสารเปิดเผย วัฒนธรรมข้อผิดพลาด (เรียนรู้จากความผิดพลาดโดยไม่กล่าวโทษ ยกเว้นความประมาทร้ายแรง/เจตนา/การกระทำผิดกฎหมาย) วัฒนธรรมการรายงาน (รวมรายงานนิรนาม) วัฒนธรรมการเรียนรู้"}, {"abbr": "SMS", "term_en": "Tasks of an SMS", "term_th": "หน้าที่ของ SMS", "desc_en": "Determine safety policy/objectives; create an organisational framework across all levels; actively involve managers/employees/subcontractors; introduce a safety risk-management process; measure safety performance; ensure safety-oriented communication; create a Just Culture; assign safety responsibility (Safety Manager, SAG, SRB).", "desc_th": "กำหนดนโยบาย/วัตถุประสงค์ด้านความปลอดภัย สร้างกรอบองค์กรครอบคลุมทุกระดับ ให้ผู้บริหาร/พนักงาน/ผู้รับเหมาช่วงมีส่วนร่วมอย่างจริงจัง นำกระบวนการจัดการความเสี่ยงด้านความปลอดภัยมาใช้ วัดผลด้านความปลอดภัย สื่อสารเน้นความปลอดภัย สร้างวัฒนธรรม Just Culture มอบหมายความรับผิดชอบด้านความปลอดภัย (ผู้จัดการความปลอดภัย, SAG, SRB)"}], "quiz": [{"q_en": "Who must demonstrate that continuing airworthiness is maintained for an aircraft?", "q_th": "ใครต้องแสดงให้เห็นว่ามีการรักษาความสมควรเดินอากาศต่อเนื่องของอากาศยาน?", "choices_en": ["The pilot only", "The responsible Operator/CAMO", "The passenger", "The manufacturer only"], "choices_th": ["นักบินเท่านั้น", "ผู้ประกอบการ/CAMO ที่รับผิดชอบ", "ผู้โดยสาร", "ผู้ผลิตเท่านั้น"], "a": 1}, {"q_en": "A Level 1 finding during an audit is defined as:", "q_th": "ข้อบกพร่องระดับ 1 (Level 1 finding) ในการตรวจสอบหมายถึง?", "choices_en": ["Any significant non-compliance which lowers the safety standard or seriously hazards flight safety", "A minor paperwork typo", "Any deviation requiring correction within 3 months", "A recommendation with no required action"], "choices_th": ["การไม่ปฏิบัติตามอย่างมีนัยสำคัญที่ลดมาตรฐานความปลอดภัยหรือเป็นอันตรายร้ายแรงต่อการบิน", "การพิมพ์ผิดในเอกสารเล็กน้อย", "การเบี่ยงเบนใด ๆ ที่ต้องแก้ไขภายใน 3 เดือน", "คำแนะนำที่ไม่ต้องดำเนินการ"], "a": 0}, {"q_en": "What is the maximum MTOW for an ELA1 (non-complex) aircraft?", "q_th": "MTOW สูงสุดของอากาศยาน ELA1 (ไม่ซับซ้อน) คือเท่าใด?", "choices_en": ["600 kg", "1200 kg", "2000 kg", "5700 kg"], "choices_th": ["600 กก.", "1200 กก.", "2000 กก.", "5700 กก."], "a": 1}, {"q_en": "What distinguishes a Service Bulletin (SB) that becomes an Airworthiness Directive (AD)?", "q_th": "อะไรที่ทำให้ Service Bulletin (SB) กลายเป็นคำสั่งความสมควรเดินอากาศ (AD)?", "choices_en": ["The SB is always voluntary regardless of content", "The SB is safety-critical, so the authority makes it mandatory by publishing an AD", "Only the operator can decide, never the authority", "ADs and SBs are unrelated documents"], "choices_th": ["SB เป็นความสมัครใจเสมอไม่ว่าเนื้อหาใด", "SB มีผลกระทบสำคัญต่อความปลอดภัย หน่วยงานจึงทำให้เป็นข้อบังคับด้วยการออก AD", "ผู้ประกอบการเท่านั้นที่ตัดสินใจได้ ไม่ใช่หน่วยงาน", "AD และ SB ไม่เกี่ยวข้องกัน"], "a": 1}, {"q_en": "Which maintenance category includes C-Check and higher, major structural repairs, and retrofits?", "q_th": "การซ่อมบำรุงประเภทใดรวมถึง C-Check ขึ้นไป การซ่อมโครงสร้างใหญ่ และการปรับปรุงย้อนหลัง?", "choices_en": ["Line Maintenance", "Base Maintenance", "Component Maintenance", "Pre-flight inspection"], "choices_th": ["การซ่อมบำรุงระดับลาน", "การซ่อมบำรุงระดับฐาน", "การซ่อมบำรุงชิ้นส่วน", "การตรวจก่อนบิน"], "a": 1}, {"q_en": "In an SMS 'Just Culture', reports about incidents are generally treated how?", "q_th": "ในวัฒนธรรม 'Just Culture' ของ SMS การรายงานเหตุการณ์โดยทั่วไปได้รับการปฏิบัติอย่างไร?", "choices_en": ["Always leads to disciplinary action", "Treated confidentially and not used to the detriment of employees, except gross negligence, intent, or criminal acts", "Only accepted if signed by a manager", "Ignored unless an accident occurs"], "choices_th": ["นำไปสู่การลงโทษเสมอ", "ปฏิบัติอย่างเป็นความลับและไม่ใช้เพื่อลงโทษพนักงาน ยกเว้นความประมาทร้ายแรง เจตนา หรือการกระทำผิดกฎหมาย", "รับเฉพาะที่ผู้จัดการลงนามเท่านั้น", "ละเลยจนกว่าจะเกิดอุบัติเหตุ"], "a": 1}, {"q_en": "What is a TSO/ETSO?", "q_th": "TSO/ETSO คืออะไร?", "choices_en": ["A pilot's licence", "Aircraft parts/components designed and approved to uniform standards, installable in any aircraft type", "A type of Airworthiness Directive", "A maintenance organisation rating"], "choices_th": ["ใบอนุญาตนักบิน", "ชิ้นส่วน/ส่วนประกอบอากาศยานที่ออกแบบและอนุมัติตามมาตรฐานเดียวกัน ติดตั้งได้กับอากาศยานทุกประเภท", "คำสั่งความสมควรเดินอากาศประเภทหนึ่ง", "ระดับการรับรององค์กรซ่อมบำรุง"], "a": 1}, {"q_en": "What document is the Compliance Manager (145.A.30(c)) responsible for establishing?", "q_th": "ผู้จัดการฝ่ายปฏิบัติตามข้อกำหนด (145.A.30(c)) มีหน้าที่จัดทำเอกสารใด?", "choices_en": ["An audit plan covering the whole organisation and all products", "The pilot's flight plan", "The aircraft's Type Certificate", "The company's marketing plan"], "choices_th": ["แผนตรวจสอบครอบคลุมทั้งองค์กรและผลิตภัณฑ์ทั้งหมด", "แผนการบินของนักบิน", "ใบรับรองแบบของอากาศยาน", "แผนการตลาดของบริษัท"], "a": 0}]}, {"id": 4, "title_en": "Part 21 – Certification of Aircraft, Parts & Appliances", "title_th": "Part 21 – การรับรองอากาศยาน ชิ้นส่วน และอุปกรณ์", "pages": "63–71", "diagram": "<svg viewBox=\"0 0 760 230\" xmlns=\"http://www.w3.org/2000/svg\">\n<text x=\"380\" y=\"20\" text-anchor=\"middle\" fill=\"var(--amber)\" font-size=\"13\" font-weight=\"600\" font-family=\"Chakra Petch, Sarabun, sans-serif\">Approved data flow across organisations</text>\n<text x=\"380\" y=\"34\" text-anchor=\"middle\" fill=\"var(--dim)\" font-size=\"10\">การไหลของข้อมูลที่ได้รับอนุมัติระหว่างองค์กร</text>\n<rect x=\"30\" y=\"55\" width=\"180\" height=\"65\" rx=\"6\" fill=\"var(--panel)\" stroke=\"var(--cyan)\"/>\n<text x=\"120\" y=\"78\" text-anchor=\"middle\" fill=\"var(--cyan)\" font-size=\"11\" font-weight=\"600\">Design Org. (21.J)</text>\n<text x=\"120\" y=\"93\" text-anchor=\"middle\" fill=\"var(--text)\" font-size=\"9\">Approved design, OSD/ICA</text>\n<text x=\"120\" y=\"107\" text-anchor=\"middle\" fill=\"var(--dim)\" font-size=\"8\">องค์กรออกแบบ</text>\n<line x1=\"210\" y1=\"87\" x2=\"270\" y2=\"87\" stroke=\"var(--border)\" stroke-width=\"2\" marker-end=\"url(#arrow)\"/>\n<rect x=\"280\" y=\"55\" width=\"180\" height=\"65\" rx=\"6\" fill=\"var(--panel)\" stroke=\"var(--cyan)\"/>\n<text x=\"370\" y=\"78\" text-anchor=\"middle\" fill=\"var(--cyan)\" font-size=\"11\" font-weight=\"600\">Production Org. (21.G)</text>\n<text x=\"370\" y=\"93\" text-anchor=\"middle\" fill=\"var(--text)\" font-size=\"9\">Builds to approved data</text>\n<text x=\"370\" y=\"107\" text-anchor=\"middle\" fill=\"var(--dim)\" font-size=\"8\">องค์กรผลิต</text>\n<line x1=\"460\" y1=\"87\" x2=\"520\" y2=\"87\" stroke=\"var(--border)\" stroke-width=\"2\" marker-end=\"url(#arrow)\"/>\n<rect x=\"530\" y=\"55\" width=\"200\" height=\"65\" rx=\"6\" fill=\"var(--panel)\" stroke=\"var(--cyan)\"/>\n<text x=\"630\" y=\"78\" text-anchor=\"middle\" fill=\"var(--cyan)\" font-size=\"11\" font-weight=\"600\">Maintenance</text>\n<text x=\"630\" y=\"93\" text-anchor=\"middle\" fill=\"var(--text)\" font-size=\"9\">145 / CAO / CAMO</text>\n<text x=\"630\" y=\"107\" text-anchor=\"middle\" fill=\"var(--dim)\" font-size=\"8\">การซ่อมบำรุง</text>\n<rect x=\"280\" y=\"155\" width=\"200\" height=\"60\" rx=\"6\" fill=\"var(--amber-bg)\" stroke=\"var(--amber)\"/>\n<text x=\"380\" y=\"178\" text-anchor=\"middle\" fill=\"var(--amber)\" font-size=\"11\" font-weight=\"600\">Authority (NAA / EASA)</text>\n<text x=\"380\" y=\"193\" text-anchor=\"middle\" fill=\"var(--text)\" font-size=\"9\">Issues Airworthiness Directives</text>\n<text x=\"380\" y=\"207\" text-anchor=\"middle\" fill=\"var(--dim)\" font-size=\"8\">หน่วยงาน — ออก AD</text>\n<line x1=\"330\" y1=\"155\" x2=\"150\" y2=\"122\" stroke=\"var(--amber-dim)\" stroke-width=\"1.3\" stroke-dasharray=\"4,3\" marker-end=\"url(#arrowamber)\"/>\n<line x1=\"430\" y1=\"155\" x2=\"600\" y2=\"122\" stroke=\"var(--amber-dim)\" stroke-width=\"1.3\" stroke-dasharray=\"4,3\" marker-end=\"url(#arrowamber)\"/>\n<defs>\n<marker id=\"arrow\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 Z\" fill=\"var(--cyan)\"/></marker>\n<marker id=\"arrowamber\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 Z\" fill=\"var(--amber-dim)\"/></marker>\n</defs>\n</svg>", "sections": [{"p": "64-65", "en": "Regulation (EU) No 748/2012 (Part-21, Initial Airworthiness) covers aeronautical products, parts and appliances requiring certification per the Chicago Convention. Products (aircraft, engines, propellers) require a Type Certificate (TC). All parts of the airframe/engine/propeller and equipment used for aircraft operation/control must comply with the regulatory requirements = Type Design.", "th": "Regulation (EU) No 748/2012 (Part-21, Initial Airworthiness) ครอบคลุมผลิตภัณฑ์ ชิ้นส่วน และอุปกรณ์การบินที่ต้องได้รับการรับรองตาม Chicago Convention ผลิตภัณฑ์ (อากาศยาน เครื่องยนต์ ใบพัด) ต้องมีใบรับรองแบบ (TC) ชิ้นส่วนทั้งหมดของโครงเครื่อง/เครื่องยนต์/ใบพัด และอุปกรณ์ที่ใช้ในการปฏิบัติการ/ควบคุมอากาศยานต้องปฏิบัติตามข้อกำหนด = แบบที่ได้รับอนุมัติ (Type Design)"}, {"p": "66-68", "en": "4 steps of Type Certification: (1) Certification basis — design org submits project to EASA, which sets the certification basis per the applicable Certification Specification (CS, e.g. CS-25). (2) Certification programme & development — EASA and design org agree on Means of Compliance (MoC) and EASA's level of involvement; development starts. (3) Compliance verification — structure/engines/systems/flight performance analysed against the certification basis via ground/simulator/in-flight tests; EASA witnesses some tests. (4) Issue of approval — EASA issues the Type Certificate Data Sheet (TCDS/TC).", "th": "4 ขั้นตอนการรับรองแบบ (Type Certification): (1) พื้นฐานการรับรอง — องค์กรออกแบบยื่นโครงการต่อ EASA ซึ่งกำหนดพื้นฐานการรับรองตาม Certification Specification (CS เช่น CS-25) (2) โปรแกรมการรับรองและการพัฒนา — EASA และองค์กรออกแบบตกลงวิธีตรวจสอบการปฏิบัติตาม (MoC) และระดับการมีส่วนร่วมของ EASA จากนั้นเริ่มการพัฒนา (3) การตรวจสอบการปฏิบัติตาม — วิเคราะห์โครงสร้าง/เครื่องยนต์/ระบบ/สมรรถนะการบินเทียบกับพื้นฐานการรับรองผ่านการทดสอบภาคพื้นดิน/จำลอง/บิน โดย EASA เป็นสักขีพยานบางการทดสอบ (4) การออกใบอนุมัติ — EASA ออก Type Certificate Data Sheet (TCDS/TC)"}, {"p": "69", "en": "Aircraft production: a DO-PO (Design Org–Production Org) agreement ensures the aircraft always complies with development/design documents from prototype through series production. In series production, a conformity statement (EASA Form 52) is issued; the 21.G organisation certifies conformity to type design, and a certificate of release to service (EASA Form 53) releases the aircraft for delivery.", "th": "การผลิตอากาศยาน: ข้อตกลง DO-PO (องค์กรออกแบบ-องค์กรผลิต) ทำให้มั่นใจว่าอากาศยานปฏิบัติตามเอกสารพัฒนา/ออกแบบเสมอ ตั้งแต่ต้นแบบจนถึงการผลิตแบบซีรีส์ ในการผลิตแบบซีรีส์จะออกหนังสือรับรองความสอดคล้อง (EASA Form 52) องค์กร 21.G รับรองความสอดคล้องกับแบบที่ได้รับอนุมัติ และใบรับรองการปล่อยกลับสู่บริการ (EASA Form 53) จะปล่อยอากาศยานเพื่อส่งมอบ"}, {"p": "70-71", "en": "Approved data flows from the Design Organisation (21.J) — approved design, operation and maintenance documents (OSD & ICA) — to Production (21.G), to Maintenance (CAMO/CAO & 145), with Airworthiness Directives issued by the Authorities feeding back into the process.", "th": "ข้อมูลที่ได้รับอนุมัติไหลจากองค์กรออกแบบ (21.J) — เอกสารออกแบบ ปฏิบัติการ และซ่อมบำรุงที่ได้รับอนุมัติ (OSD & ICA) — ไปยังองค์กรผลิต (21.G) ไปยังการซ่อมบำรุง (CAMO/CAO & 145) โดยคำสั่งความสมควรเดินอากาศจากหน่วยงานทางการจะป้อนกลับเข้าสู่กระบวนการ"}], "quiz": [{"q_en": "Which EASA document is required for a newly developed aircraft type before it may enter service?", "q_th": "เอกสารใดของ EASA ที่จำเป็นสำหรับอากาศยานแบบใหม่ก่อนเข้าประจำการ?", "choices_en": ["Certificate of Registration", "Type Certificate (TC)", "Certificate of Release to Service only", "Airworthiness Review Certificate"], "choices_th": ["ใบสำคัญการจดทะเบียน", "ใบรับรองแบบ (TC)", "ใบรับรองการปล่อยกลับสู่บริการเท่านั้น", "ใบรับรองการตรวจสอบความสมควรเดินอากาศ"], "a": 1}, {"q_en": "In the 4-step type certification process, when does EASA establish the certification basis?", "q_th": "ในกระบวนการรับรองแบบ 4 ขั้นตอน EASA กำหนดพื้นฐานการรับรองเมื่อใด?", "choices_en": ["Step 1, after the design org submits a sufficiently mature project", "Step 4, after all tests are done", "Only after the aircraft enters service", "It is set by ICAO, not EASA"], "choices_th": ["ขั้นตอนที่ 1 หลังองค์กรออกแบบยื่นโครงการที่มีความสมบูรณ์เพียงพอ", "ขั้นตอนที่ 4 หลังการทดสอบทั้งหมดเสร็จสิ้น", "หลังอากาศยานเข้าประจำการเท่านั้น", "กำหนดโดย ICAO ไม่ใช่ EASA"], "a": 0}, {"q_en": "What does the 21.G production organisation certify with a series-production conformity statement?", "q_th": "องค์กรผลิต 21.G รับรองอะไรด้วยหนังสือรับรองความสอดคล้องในการผลิตแบบซีรีส์?", "choices_en": ["That the aircraft conforms to the approved type design (EASA Form 52)", "That the pilot is licensed", "That the airline has an AOC", "That the airport meets ICAO standards"], "choices_th": ["ว่าอากาศยานสอดคล้องกับแบบที่ได้รับอนุมัติ (EASA Form 52)", "ว่านักบินมีใบอนุญาต", "ว่าสายการบินมี AOC", "ว่าสนามบินเป็นไปตามมาตรฐาน ICAO"], "a": 0}, {"q_en": "What does EASA Form 53 represent?", "q_th": "EASA Form 53 คืออะไร?", "choices_en": ["A type certificate", "A certificate of release to service, releasing the aircraft for delivery", "A pilot medical certificate", "A noise certificate"], "choices_th": ["ใบรับรองแบบ", "ใบรับรองการปล่อยกลับสู่บริการ ปล่อยอากาศยานเพื่อส่งมอบ", "ใบรับรองแพทย์ของนักบิน", "ใบรับรองเสียง"], "a": 1}]}, {"id": 5, "title_en": "OPS – Air Operations", "title_th": "OPS – การปฏิบัติการบิน", "pages": "72–77", "sections": [{"p": "73-74", "en": "Regulation (EU) No 965/2012 ('Air Ops Regulation') sets requirements for operators, especially commercial flight operations (Part-CAT) with complex aircraft — the most extensive requirements. It covers: CAT (Commercial Air Transport), NCC (non-commercial ops, complex aircraft), NCO (non-commercial ops, non-complex aircraft), SPO (specialised operations, commercial or non-commercial). Applies to all EU-based operators and, partly, to Third Country Operators (TCO) operating in Europe (e.g. safety management requirements).", "th": "Regulation (EU) No 965/2012 ('Air Ops Regulation') กำหนดข้อกำหนดสำหรับผู้ประกอบการ โดยเฉพาะการปฏิบัติการบินเชิงพาณิชย์ (Part-CAT) ด้วยอากาศยานซับซ้อน — ข้อกำหนดที่ครอบคลุมที่สุด ประกอบด้วย: CAT (การขนส่งทางอากาศเชิงพาณิชย์) NCC (ปฏิบัติการไม่เชิงพาณิชย์ อากาศยานซับซ้อน) NCO (ปฏิบัติการไม่เชิงพาณิชย์ อากาศยานไม่ซับซ้อน) SPO (ปฏิบัติการเฉพาะทาง ทั้งเชิงพาณิชย์และไม่เชิงพาณิชย์) ใช้บังคับกับผู้ประกอบการที่ตั้งอยู่ใน EU ทั้งหมด และบางส่วนกับผู้ประกอบการประเทศที่สาม (TCO) ที่ปฏิบัติการในยุโรป (เช่น ข้อกำหนดด้าน SMS)"}, {"p": "75", "en": "CAT = carriage of passengers/freight/mail for payment. NCC = e.g. demonstration, ferry, acceptance, training, PR flights, and Maintenance Check Flights (MCF, when required by the AMM, subject to SPO.SPEC.MCF/NCO.SPEC.MCF, operator responsible). SPO = specialised activities: agriculture, construction, photography, surveying, observation/patrol, aerial advertising, test flights.", "th": "CAT = การขนส่งผู้โดยสาร/สินค้า/ไปรษณีย์เพื่อค่าตอบแทน NCC = เช่น เที่ยวบินสาธิต เที่ยวบินเฟอร์รี่ เที่ยวบินรับมอบ เที่ยวบินฝึกอบรม เที่ยวบิน PR และเที่ยวบินตรวจสอบซ่อมบำรุง (MCF เมื่อ AMM กำหนด อยู่ภายใต้ SPO.SPEC.MCF/NCO.SPEC.MCF ผู้ประกอบการรับผิดชอบ) SPO = กิจกรรมเฉพาะทาง: เกษตรกรรม ก่อสร้าง ถ่ายภาพ สำรวจ สังเกตการณ์/ลาดตระเวน โฆษณาทางอากาศ เที่ยวบินทดสอบ"}, {"p": "76", "en": "The Operator is responsible for aircraft operation and (if CAT) holds an approved organisation and an Air Operator Certificate (AOC). Must monitor operating procedures, safe operation, and ensure airworthiness through the CAMO — including mass & balance, instruments/safety equipment, ground services interface, maintenance/operations interface (CAMO/Maintenance & MCC), MEL/CDL use, ETOPS and all-weather operation procedures.", "th": "ผู้ประกอบการ (Operator) รับผิดชอบการปฏิบัติการอากาศยาน และ (หากเป็น CAT) ต้องมีองค์กรที่ได้รับอนุมัติและใบรับรองผู้ดำเนินการเดินอากาศ (AOC) ต้องติดตามขั้นตอนปฏิบัติการ การปฏิบัติการที่ปลอดภัย และรับรองความสมควรเดินอากาศผ่าน CAMO — รวมถึงน้ำหนักและสมดุล เครื่องมือ/อุปกรณ์ความปลอดภัย การเชื่อมต่อบริการภาคพื้น การเชื่อมต่อซ่อมบำรุง/ปฏิบัติการ (CAMO/ซ่อมบำรุง & MCC) การใช้ MEL/CDL ETOPS และขั้นตอนปฏิบัติการทุกสภาพอากาศ"}, {"p": "77", "en": "Regulation (EU) No 1178/2011 ('Aircrew') separately covers requirements/conditions for flight deck and cabin crew (aircrew), whether operating for an airline (AOC), gliding, ballooning, or as a private pilot.", "th": "Regulation (EU) No 1178/2011 ('Aircrew') กำหนดข้อกำหนด/เงื่อนไขสำหรับลูกเรือ (นักบินและพนักงานต้อนรับ) แยกต่างหาก ไม่ว่าจะปฏิบัติการให้สายการบิน (AOC) เครื่องร่อน บอลลูน หรือนักบินส่วนตัว"}], "quiz": [{"q_en": "Which category of Air Ops covers commercial carriage of passengers, cargo or mail for remuneration?", "q_th": "ประเภทการปฏิบัติการบินใดครอบคลุมการขนส่งผู้โดยสาร สินค้า หรือไปรษณีย์เชิงพาณิชย์เพื่อค่าตอบแทน?", "choices_en": ["NCO", "NCC", "CAT", "SPO"], "choices_th": ["NCO", "NCC", "CAT", "SPO"], "a": 2}, {"q_en": "A Maintenance Check Flight (MCF) is:", "q_th": "เที่ยวบินตรวจสอบซ่อมบำรุง (MCF) คืออะไร?", "choices_en": ["Always a commercial passenger flight", "A non-commercial flight carried out if required by the AMM, under SPO.SPEC.MCF/NCO.SPEC.MCF, operator responsible", "Only performed by ICAO inspectors", "Not regulated by Air Ops"], "choices_th": ["เที่ยวบินโดยสารเชิงพาณิชย์เสมอ", "เที่ยวบินไม่เชิงพาณิชย์ที่ทำเมื่อ AMM กำหนด ภายใต้ SPO.SPEC.MCF/NCO.SPEC.MCF โดยผู้ประกอบการรับผิดชอบ", "ดำเนินการโดยผู้ตรวจสอบ ICAO เท่านั้น", "ไม่อยู่ภายใต้การกำกับของ Air Ops"], "a": 1}, {"q_en": "Through which organisation must the operator ensure continuing airworthiness of its aircraft?", "q_th": "ผู้ประกอบการต้องรับรองความสมควรเดินอากาศต่อเนื่องของอากาศยานผ่านองค์กรใด?", "choices_en": ["The CAMO", "The airport authority", "ICAO directly", "The passenger insurance company"], "choices_th": ["CAMO", "หน่วยงานสนามบิน", "ICAO โดยตรง", "บริษัทประกันภัยผู้โดยสาร"], "a": 0}, {"q_en": "Which regulation covers requirements for aircrew (flight deck and cabin crew)?", "q_th": "กฎระเบียบใดครอบคลุมข้อกำหนดสำหรับลูกเรือ (นักบินและพนักงานต้อนรับ)?", "choices_en": ["(EU) No 965/2012", "(EU) No 1178/2011", "(EU) No 748/2012", "(EU) No 1321/2014"], "choices_th": ["(EU) No 965/2012", "(EU) No 1178/2011", "(EU) No 748/2012", "(EU) No 1321/2014"], "a": 1}]}, {"id": 6, "title_en": "Part M & ML – Continuing Airworthiness", "title_th": "Part M & ML – ความสมควรเดินอากาศต่อเนื่อง", "pages": "78–145", "diagram": "<svg viewBox=\"0 0 740 340\" xmlns=\"http://www.w3.org/2000/svg\">\n<text x=\"370\" y=\"18\" text-anchor=\"middle\" fill=\"var(--amber)\" font-size=\"13\" font-weight=\"600\" font-family=\"Chakra Petch, Sarabun, sans-serif\">Part-M structure (Subparts A–I)</text>\n<text x=\"370\" y=\"32\" text-anchor=\"middle\" fill=\"var(--dim)\" font-size=\"10\">โครงสร้าง Part-M (Subpart A–I)</text>\n<g font-family=\"IBM Plex Mono, monospace\">\n\n<rect x=\"20\" y=\"50\" width=\"220\" height=\"80\" rx=\"6\" fill=\"var(--panel)\" stroke=\"var(--cyan)\"/><text x=\"34\" y=\"72\" fill=\"var(--amber)\" font-size=\"16\" font-weight=\"700\">A</text><text x=\"130\" y=\"80\" text-anchor=\"middle\" fill=\"var(--text)\" font-size=\"10\">General</text><text x=\"130\" y=\"95\" text-anchor=\"middle\" fill=\"var(--dim)\" font-size=\"8\">ทั่วไป</text>\n<rect x=\"260\" y=\"50\" width=\"220\" height=\"80\" rx=\"6\" fill=\"var(--panel)\" stroke=\"var(--cyan)\"/><text x=\"274\" y=\"72\" fill=\"var(--amber)\" font-size=\"16\" font-weight=\"700\">B</text><text x=\"370\" y=\"80\" text-anchor=\"middle\" fill=\"var(--text)\" font-size=\"10\">Accountability</text><text x=\"370\" y=\"95\" text-anchor=\"middle\" fill=\"var(--dim)\" font-size=\"8\">ความรับผิดชอบ</text>\n<rect x=\"500\" y=\"50\" width=\"220\" height=\"80\" rx=\"6\" fill=\"var(--panel)\" stroke=\"var(--cyan)\"/><text x=\"514\" y=\"72\" fill=\"var(--amber)\" font-size=\"16\" font-weight=\"700\">C</text><text x=\"610\" y=\"80\" text-anchor=\"middle\" fill=\"var(--text)\" font-size=\"9\">Continuing Airworthiness</text><text x=\"610\" y=\"95\" text-anchor=\"middle\" fill=\"var(--dim)\" font-size=\"8\">ความสมควรเดินอากาศต่อเนื่อง</text>\n\n<rect x=\"20\" y=\"140\" width=\"220\" height=\"80\" rx=\"6\" fill=\"var(--panel)\" stroke=\"var(--cyan)\"/><text x=\"34\" y=\"162\" fill=\"var(--amber)\" font-size=\"16\" font-weight=\"700\">D</text><text x=\"130\" y=\"170\" text-anchor=\"middle\" fill=\"var(--text)\" font-size=\"9\">Maintenance Standards</text><text x=\"130\" y=\"185\" text-anchor=\"middle\" fill=\"var(--dim)\" font-size=\"8\">มาตรฐานซ่อมบำรุง</text>\n<rect x=\"260\" y=\"140\" width=\"220\" height=\"80\" rx=\"6\" fill=\"var(--panel)\" stroke=\"var(--cyan)\"/><text x=\"274\" y=\"162\" fill=\"var(--amber)\" font-size=\"16\" font-weight=\"700\">E</text><text x=\"370\" y=\"170\" text-anchor=\"middle\" fill=\"var(--text)\" font-size=\"10\">Components</text><text x=\"370\" y=\"185\" text-anchor=\"middle\" fill=\"var(--dim)\" font-size=\"8\">ส่วนประกอบ</text>\n<rect x=\"500\" y=\"140\" width=\"220\" height=\"80\" rx=\"6\" fill=\"var(--panel)\" stroke=\"var(--dim)\" stroke-dasharray=\"3,2\"/><text x=\"514\" y=\"162\" fill=\"var(--amber)\" font-size=\"16\" font-weight=\"700\">F</text><text x=\"610\" y=\"170\" text-anchor=\"middle\" fill=\"var(--text)\" font-size=\"9\">Maint. Org (→ Part-CAO)</text><text x=\"610\" y=\"185\" text-anchor=\"middle\" fill=\"var(--dim)\" font-size=\"8\">องค์กรซ่อมบำรุง (→CAO)</text>\n\n<rect x=\"20\" y=\"230\" width=\"220\" height=\"80\" rx=\"6\" fill=\"var(--amber-bg)\" stroke=\"var(--amber)\"/><text x=\"34\" y=\"252\" fill=\"var(--amber)\" font-size=\"16\" font-weight=\"700\">G</text><text x=\"130\" y=\"260\" text-anchor=\"middle\" fill=\"var(--text)\" font-size=\"10\">CAMO (→ Part-CAMO)</text><text x=\"130\" y=\"275\" text-anchor=\"middle\" fill=\"var(--dim)\" font-size=\"8\">CAMO</text>\n<rect x=\"260\" y=\"230\" width=\"220\" height=\"80\" rx=\"6\" fill=\"var(--panel)\" stroke=\"var(--cyan)\"/><text x=\"274\" y=\"252\" fill=\"var(--amber)\" font-size=\"16\" font-weight=\"700\">H</text><text x=\"370\" y=\"260\" text-anchor=\"middle\" fill=\"var(--text)\" font-size=\"9\">Certificate of Release to Service</text><text x=\"370\" y=\"275\" text-anchor=\"middle\" fill=\"var(--dim)\" font-size=\"8\">ใบรับรองการปล่อยกลับ</text>\n<rect x=\"500\" y=\"230\" width=\"220\" height=\"80\" rx=\"6\" fill=\"var(--panel)\" stroke=\"var(--cyan)\"/><text x=\"514\" y=\"252\" fill=\"var(--amber)\" font-size=\"16\" font-weight=\"700\">I</text><text x=\"610\" y=\"260\" text-anchor=\"middle\" fill=\"var(--text)\" font-size=\"9\">Airworthiness Review Cert.</text><text x=\"610\" y=\"275\" text-anchor=\"middle\" fill=\"var(--dim)\" font-size=\"8\">ใบรับรองการตรวจสอบ (ARC)</text>\n</g>\n</svg>", "sections": [{"p": "79-80", "en": "Part-M defines the philosophy, criteria and requirements for continuing airworthiness (IR 1321/2014, Annex I). Structure: Subpart A General, B Accountability, C Continuing Airworthiness, D Maintenance Standards, E Components, F Maintenance Organisation (non-CAT, → now Part-CAO), G Continuing Airworthiness Management Organisation (→ CAMO), H Certificate of Release to Service, I Airworthiness Review Certificate; Section B = procedures for competent authorities.", "th": "Part-M กำหนดปรัชญา เกณฑ์ และข้อกำหนดสำหรับความสมควรเดินอากาศต่อเนื่อง (IR 1321/2014, Annex I) โครงสร้าง: Subpart A ทั่วไป, B ความรับผิดชอบ, C ความสมควรเดินอากาศต่อเนื่อง, D มาตรฐานการซ่อมบำรุง, E ส่วนประกอบ, F องค์กรซ่อมบำรุง (ไม่ใช่ CAT → ปัจจุบันคือ Part-CAO), G องค์กรจัดการความสมควรเดินอากาศต่อเนื่อง (→ CAMO), H ใบรับรองการปล่อยกลับสู่บริการ, I ใบรับรองการตรวจสอบความสมควรเดินอากาศ; Section B = ขั้นตอนสำหรับหน่วยงานที่มีอำนาจ"}, {"p": "81-87", "en": "M.A.201 Responsibilities: the owner is responsible for continuing airworthiness (transfers to lessee if stated in registration/lease contract). Pilot-in-command/operator responsible for pre-flig
